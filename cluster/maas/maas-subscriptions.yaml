# Who may consume which MaaS models, with token budgets — the
# governance grant (RHOAI 3.4 MaaS). Workshop seats get the
# model-desk-translated external models with per-model token limits;
# every authenticated cluster user qualifies for now (tighten to
# attendee groups when seats mint their own identities).
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: workshop-seats
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  owner:
    groups:
      - name: redhat-workshop-users
      - name: model-admins
  priority: 0
  tokenMetadata:
    costCenter: workshop
  modelRefs:
    - name: gpt-4o-mini
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: claude-sonnet-4-5
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 200000
          window: 1m
    - name: claude-sonnet-5
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 200000
          window: 1m
    - name: claude-opus-4-6
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 200000
          window: 1m
    - name: qwen3-8-27b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 200000
          window: 1m
    - name: qwen3-6-35b-a3b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 200000
          window: 1m
    - name: claude-haiku-4-5
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 200000
          window: 1m
---
# Ops validation lane: the platform automation SA (group grants don't
# reach SA tokens), tiny budget, for end-to-end probes only.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: ops-validation
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  owner:
    users:
      - system:serviceaccount:claude-code-agent:claude-code-agent
  priority: 0
  tokenMetadata:
    costCenter: ops
  modelRefs:
    - name: gpt-4o-mini
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 20000
          window: 1m
    - name: claude-sonnet-5
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 20000
          window: 1m
    - name: claude-opus-4-6
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 20000
          window: 1m
    - name: qwen3-8-27b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 20000
          window: 1m
    - name: gpt-5-6-sol
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 20000
          window: 1m
---
# Admin personal-API lane: models billed to Dean's own keys, visible
# only to model-admins. Subscriptions (Codex/Claude Max OAuth) can
# NEVER live here — they are runtime auth profiles, not API endpoints.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: admin-models
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  owner:
    groups:
      - name: model-admins
  priority: 10
  tokenMetadata:
    costCenter: admin-personal
  modelRefs:
    - name: gpt-4o
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 200000
          window: 1m
    - name: gpt-5-6-sol
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 500000
          window: 1m
    - name: gpt-5-6-terra
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 500000
          window: 1m
    - name: gpt-5-6-luna
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 500000
          window: 1m
    - name: claude-fable-5
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 500000
          window: 1m
    - name: claude-opus-5
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 500000
          window: 1m

