# OpenShift AI Models-as-a-Service ingress gateway (RHOAI 3.3 MaaS
# prerequisite: a Gateway with EXACTLY this name in openshift-ingress).
# Mirrors the operator-created data-science-gateway: the infra
# ConfigMap injects a serving-cert annotation onto the generated
# Service, so service-ca mints the listener's TLS secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-default-gateway-service-tls"
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ''
      kind: ConfigMap
      name: maas-default-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: maas-default-gateway-service-tls
      allowedRoutes:
        # MaaS attaches routes from its own namespaces (maas-api in
        # redhat-ods-applications, per-tier namespaces it creates,
        # and model project namespaces) — keep attachment open.
        namespaces:
          from: All
---
# Public entry for MaaS. The RHOAI dashboard AUTO-DISCOVERS the MaaS
# URL as https://maas.<apps-domain>/maas-api (maas-ui container log),
# and the gateway controller creates no Routes itself — this Route is
# the same shape as the operator's own rh-ai route onto the
# data-science gateway (reencrypt to the listener's service-ca cert).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  host: maas.apps.salamander.aimlworkbench.com
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: maas-default-gateway-data-science-gateway-class
    weight: 100
  wildcardPolicy: None

