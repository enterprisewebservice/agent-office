apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
  namespace: gitlab-system
spec:
  chart:
    # Pinned chart version that ships with operator v2.11.3. Bumps
    # follow the operator's release notes — never bump chart
    # ahead of the operator's tested matrix.
    version: 9.11.4
    values:
      global:
        hosts:
          # GitLab will serve `gitlab.<domain>`, `registry.<domain>`,
          # `minio.<domain>`, `kas.<domain>` etc. — all subdomains
          # under the cluster's apps wildcard, so OpenShift's HAProxy
          # router picks them up automatically.
          domain: apps.salamander.aimlworkbench.com
          # No suffix needed — base names (`gitlab`, `registry`, …)
          # become the route hostnames.
          hostSuffix: null
          # Cluster's wildcard ingress already serves TLS; the chart's
          # nginx-ingress would duplicate that. We disable certmanager
          # for the same reason — OpenShift's apps domain has a
          # cluster-signed cert (or LE if you've wired it).
          https: true
        ingress:
          # The chart will still emit Ingress resources; OpenShift's
          # ingress operator turns those into Routes automatically.
          configureCertmanager: false
          tls:
            enabled: false
            secretName: null
          # Use a passthrough — the chart-internal webservice/etc.
          # speak HTTPS already against their internal certs; let
          # the OpenShift router pass the connection through to
          # them rather than re-terminate.
          class: openshift-default
        # Initial root password: the operator generates one in a
        # Secret named `<release>-gitlab-initial-root-password` if
        # we don't provide one. Leave unset — easier to rotate.
        initialRootPassword: {}
      # Disable the bundled nginx-ingress — OpenShift's HAProxy
      # router does the same job, and running both creates
      # competing ELBs / Routes that confuse traffic.
      nginx-ingress:
        enabled: false
      # cert-manager: already disabled via global; the chart also
      # has a top-level switch.
      installCertmanager: false
      # Modest resources for a workshop demo. Production GitLab
      # benchmarks recommend 8 CPU / 16 GB minimum per webservice
      # replica; the chart's defaults are tuned higher than we
      # need for "a board for the demo." Override per subsystem.
      gitlab:
        gitlab-shell:
          minReplicas: 1
          maxReplicas: 1
        sidekiq:
          minReplicas: 1
          maxReplicas: 1
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
        webservice:
          minReplicas: 1
          maxReplicas: 1
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
      postgresql:
        primary:
          extendedConfiguration: |
            max_connections = 200
      redis:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
      minio:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
      # registry: same defaults — the bundled container registry is
      # useful for image-on-push demos but optional.
      registry:
        enabled: true
