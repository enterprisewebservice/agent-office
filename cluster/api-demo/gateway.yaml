# The API gateway: an HTTP listener behind an OpenShift Route that terminates
# TLS with the cluster's Let's Encrypt wildcard, the same way OpenShift AI
# fronts its gateways on this cluster (their services are ClusterIP too).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api-gateway
  namespace: api-demo
  labels:
    # pins the gateway to the Service Mesh 3.4 control plane (revision "default",
    # cluster/service-mesh); the Ingress Operator's control plane had stamped
    # istio.io/rev=openshift-gateway on it and Istio honours that label
    istio.io/rev: default
  annotations:
    # same as mcp-gateway: no LoadBalancer address is needed, the Route fronts it
    networking.istio.io/service-type: ClusterIP
spec:
  # Service Mesh 3.4 control plane owned in Git (cluster/service-mesh): tracing
  # and the JSON access log with the consumer identity need our own Istio CR.
  gatewayClassName: istio
  listeners:
    # One listener for every API on this gateway: the Governed REST API template
    # (templates/governed-api) gives each API the hostname api-<name>.apps... and
    # a Route in this namespace; its HTTPRoute attaches from the API's own
    # namespace, which the template labels governed-api=true. The gateway, its
    # access log, tracing and metrics (telemetry.yaml) are the platform's; the
    # API repositories cannot change them (AppProject governed-apis).
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.apps.salamander.aimlworkbench.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              governed-api: "true"
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: inventory-api
  namespace: api-demo
spec:
  host: inventory-api.apps.salamander.aimlworkbench.com
  to:
    kind: Service
    name: api-gateway-istio
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
