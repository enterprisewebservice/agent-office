# API keys: the developer-portal controller copies this selector's labels onto
# every enforcement Secret it creates in kuadrant-system on approval, so keys
# issued through the catalog are accepted here and nowhere else.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: inventory-api-auth
  namespace: api-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: inventory-api
  rules:
    authentication:
      api-key-consumers:
        apiKey:
          selector:
            matchLabels:
              app: inventory-api
          allNamespaces: true
        credentials:
          authorizationHeader:
            prefix: Bearer
    response:
      success:
        filters:
          identity:
            json:
              properties:
                consumer:
                  selector: auth.identity.metadata.labels.devportal\.kuadrant\.io/apikey-namespace
                plan:
                  selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/plan-id
---
# Plan tiers (Technology Preview in 1.4): the tier a consumer chooses when
# requesting a key is stamped on the enforcement Secret and drives the limit.
apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: inventory-api-plans
  namespace: api-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: inventory-api
  plans:
    - tier: gold
      predicate: |
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "gold"
      limits:
        daily: 1000
    - tier: silver
      predicate: |
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "silver"
      limits:
        daily: 200
    - tier: bronze
      predicate: |
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "bronze"
      limits:
        daily: 20
