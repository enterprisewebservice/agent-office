# Adds the request path as a label on the api-demo gateway's Envoy request
# metrics; the Connectivity Link business-user dashboard breaks traffic down by
# request_url_path. Same resource as cluster/gateway-api-state-metrics/
# telemetry-agent-office.yaml (upstream: kuadrant-operator
# config/observability/openshift/telemetry.yaml).
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: namespace-metrics
  namespace: api-demo
spec:
  # JSON access log with identity, plan, request id and traceparent (provider
  # json-access-log on the Service Mesh 3.4 control plane, cluster/service-mesh)
  accessLogging:
    - providers:
        - name: json-access-log
  tracing:
    - providers:
        - name: tempo-otlp
      randomSamplingPercentage: 100
  metrics:
    - providers:
        - name: prometheus
      overrides:
        # user_id and plan: the identity headers Authorino injects after the key
        # check (x-auth-identity, x-auth-plan), so requests, latency and the
        # dashboards built on them can be filtered per consumer. Empty on a 401
        # (no identity yet); present on 429s and 2xx. Per-user labels raise the
        # series count (consumers x paths x codes): fine for a shared demo
        # gateway, size the retention for a busy production one.
        - match:
            metric: REQUEST_COUNT
          tagOverrides:
            request_url_path:
              value: "request.url_path"
            user_id:
              value: "request.headers['x-auth-identity']"
            plan:
              value: "request.headers['x-auth-plan']"
        - match:
            metric: REQUEST_DURATION
          tagOverrides:
            request_url_path:
              value: "request.url_path"
            user_id:
              value: "request.headers['x-auth-identity']"
            plan:
              value: "request.headers['x-auth-plan']"
