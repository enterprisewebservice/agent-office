# RHDH dynamic-plugins config — declares the OCI plugin images
# RHDH's init container installs into the developer-hub pod's
# dynamic-plugins-root volume.
#
# This ConfigMap was originally created by the RHDH Helm release
# `v1` and overlaid via `kubectl apply` to add cluster-specific
# plugins. Adopting it into the agent-office gitops repo so future
# plugin changes (like the source-filtered-entity-picker added
# below) live in version control instead of being manually patched.
#
# After updates here, restart the dev-hub pod to make the init
# container re-pull and re-install:
#
#   oc -n rhdh-test rollout restart deploy/v1-developer-hub
apiVersion: v1
kind: ConfigMap
metadata:
  name: v1-dynamic-plugins
  namespace: rhdh-test
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    # ArgoCD: replace-on-sync so we win over any leftover Helm
    # owner labels — the underlying ConfigMap shape is the same,
    # only the metadata changes hands.
    argocd.argoproj.io/sync-options: Replace=true
data:
  dynamic-plugins.yaml: |
    includes:
    - dynamic-plugins.default.yaml
    plugins:
    # Keycloak org ingestion (workshop multi-user: user1..N become catalog User entities;
    # the genesis template's per-hire gitea routing keys off the keycloak.org/id annotation)
    - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
      disabled: false
    # Red Hat Developer Lightspeed — backend.
    - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-lightspeed-backend:bs_1.45.3__1.2.3!red-hat-developer-hub-backstage-plugin-lightspeed-backend"
      disabled: false
      pluginConfig:
        lightspeed:
          servers:
            - id: openai
              url: https://api.openai.com/v1
              token: ${OPENAI_API_KEY}
              model: gpt-4o

    # Red Hat Developer Lightspeed — frontend.
    - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-lightspeed:bs_1.45.3__1.2.3!red-hat-developer-hub-backstage-plugin-lightspeed"
      disabled: false
      pluginConfig:
        lightspeed:
          prompts:
            - title: "Getting Started with Developer Hub"
              message: "Can you guide me through the first steps to start using Developer Hub?"
            - title: "Create a New Agent"
              message: "How do I create a new AI agent using Agent Office?"
        dynamicPlugins:
          frontend:
            red-hat-developer-hub.backstage-plugin-lightspeed:
              mountPoints:
                - mountPoint: application/provider
                  importName: LightspeedDrawerProvider
                  module: PluginRoot
                - mountPoint: application/internal/drawer-state
                  importName: LightspeedDrawerStateExposer
                  module: PluginRoot
                - mountPoint: application/listener
                  importName: LightspeedFAB
                  module: PluginRoot
              appIcons:
                - name: lightspeedIcon
                  importName: LightspeedIcon
                  module: PluginRoot
              dynamicRoutes:
                - path: /lightspeed
                  importName: LightspeedPage
                  module: PluginRoot
                  menuItem:
                    icon: lightspeedIcon
                    text: Lightspeed

    # RBAC admin UI (Administration → RBAC). The policy ENGINE is part of
    # RHDH core and activates via permission.enabled=true in app-config;
    # this frontend plugin only adds the management UI for superUsers.
    # Policies are file-based and live in rbac-policies-configmap.yaml
    # (mounted at /opt/app-root/src/rbac/), NOT in UI-created DB state,
    # so isolation rules stay in git.
    - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
      disabled: false

    # GitHub scaffolder actions (publish:github, etc.).
    - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
      disabled: false

    # Gitea scaffolder actions (publish:gitea) — the openclaw-agent-genesis
    # template's gitea side. Both providers stay live simultaneously: the
    # template routes per-hire (gitProvider: auto — Keycloak-ingested
    # attendees to Gitea, everyone else to GitHub), and RHDP workshop
    # clusters copy this CM as ground truth (software-factory-deployer).
    # NOT in RHDH's bundled dist (github/gitlab only), so it loads from
    # the rhdh-plugin-export-overlays OCI registry on the same bs_1.45.3
    # stream as the lightspeed plugins above. Inert on salamander: the
    # action registers, but with no integrations.gitea, no giteaHost in
    # the registered template, and no Keycloak-ingested users, every hire
    # keeps publishing to GitHub.
    # Verified live on RHDH 1.9.2 during the 2026-08-24 gitea run.
    - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-scaffolder-backend-module-gitea:bs_1.45.3__0.2.15!backstage-plugin-scaffolder-backend-module-gitea"
      disabled: false

    # ArgoCD scaffolder action (argocd:create-resources).
    - package: ./dynamic-plugins/dist/roadiehq-scaffolder-backend-argocd-dynamic
      disabled: false

    # agent-office Source-Filtered EntityPicker.
    #
    # Custom scaffolder field extension that wraps EntityPicker with
    # a filter-icon popover. Used by the karpathy-research-agent
    # template's `baseModel` field to let workshop attendees narrow
    # the model dropdown by source (Registry / Catalog) without
    # typing. The plugin reads the `agentoffice.ai/model-source`
    # annotation that the operator writes on every entity.
    #
    # Image is built by the Konflux pipeline at
    # `.tekton/source-filtered-entity-picker-on-push.yaml` from the
    # plugin source at `rhdh-plugins/source-filtered-entity-picker/`.
    - package: "oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-source-filtered-entity-picker:v0.0.4!agent-office-backstage-plugin-source-filtered-entity-picker"
      disabled: false
      pluginConfig:
        dynamicPlugins:
          frontend:
            # MUST match the loaded plugin name scalprum logs at startup
            # — that name comes from this plugin's package.json `name`
            # field, which is hyphen-only (`agent-office-backstage-
            # plugin-source-filtered-entity-picker`). The dot-form
            # convention only applies when the package name starts
            # with `@<scope>/...`; ours has no npm scope.
            agent-office-backstage-plugin-source-filtered-entity-picker:
              scaffolderFieldExtensions:
                - importName: sourceFilteredEntityPickerFieldExtension
                  module: PluginRoot

    # codex-reauth-action — backend scaffolder module.
    # Adds the `codex:reauth` scaffolder action that runs OAuth
    # device-code flow against OpenAI Codex and writes the resulting
    # auth.json to Vault path agent-office/codex-subscription-
    # credentials (CAS-protected). ESO syncs the K8s Secret within
    # ~60s and every Codex-backed agent pod picks up the new token
    # on the next kubelet refresh.
    #
    # Backend plugins don't have a dynamicPlugins.frontend block;
    # RHDH's backend loader registers them via the role declared in
    # the bundled package.json (`backend-plugin-module`) and the
    # extension point each module hits (scaffolder.actions.v1).
    #
    # Image is built by .tekton/codex-reauth-action-on-push.yaml
    # from rhdh-plugins/codex-reauth-action/.
    - package: "oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-codex-reauth-backend:v0.0.5!agent-office-backstage-plugin-codex-reauth-backend"
      disabled: false

    # codex-reauth-ui — frontend plugin.
    # Renders:
    #   * CodexAuthCard on the entity overview tab of AgentWorkstation
    #     entities whose model provider is openai-codex.
    #   * CodexAuthPreflightField as a scaffolder field extension
    #     (`ui:field: CodexAuthPreflight`) for any template that wants
    #     to block submission on Codex token freshness.
    # Both open a shared dialog that runs the device-code OAuth flow
    # IN THE BROWSER (server-side calls from cluster IPs are CF-blocked
    # by OpenAI) and posts the resulting tokens to the codex:reauth
    # backend action for KV v2 CAS-write to Vault.
    #
    # Image is built by .tekton/codex-reauth-ui-on-push.yaml.
    - package: "oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-codex-reauth-ui:v0.0.6!agent-office-backstage-plugin-codex-reauth-ui"
      disabled: false
      pluginConfig:
        # Proxy entry so the codex-reauth-ui frontend (running in
        # the user's browser) can reach the agent-office backend's
        # /codex-auth/status endpoint via Backstage's proxy plugin.
        # The card + scaffolder pre-flight fetch:
        #   /api/proxy/agent-office/codex-auth/status
        # which gets rewritten to the agent-office Service.
        #
        # This used to point at the operator's backstage-catalog
        # Service, whose status check was "auth.json present and
        # well-formed" — it stayed green through the 2026-08-23
        # 16-hour newsroom outage. The agent-office backend now
        # live-verifies: JWT expiry, a real refresh-token probe
        # against auth.openai.com, and per-gateway agent auth
        # profiles + desk activity.
        proxy:
          endpoints:
            /agent-office:
              target: http://agent-office.agent-office.svc.cluster.local:8080
              changeOrigin: true
              # No headers passed through — backend endpoint is
              # in-cluster only, no auth needed (the data is metadata,
              # not secrets).
        dynamicPlugins:
          frontend:
            agent-office-backstage-plugin-codex-reauth-ui:
              scaffolderFieldExtensions:
                - importName: codexAuthPreflightFieldExtension
                  module: PluginRoot
              mountPoints:
                # Show the Codex Subscription Auth card only on
                # agent Component entities. We discriminate via the
                # `agentoffice.ai/agent-kind` annotation that the
                # karpathy template's catalog-info.yaml emits
                # (values: autoresearch | research). Non-agent
                # Components (services, gitops apps, etc.) don't
                # carry that annotation, so the card never mounts
                # there.
                #
                # Existing pre-annotation agents need a one-line
                # patch to their catalog-info.yaml; new ones are
                # already correct via the karpathy skeleton update.
                - mountPoint: entity.page.overview/cards
                  importName: CodexAuthCard
                  config:
                    if:
                      allOf:
                        - isKind: component
                        - hasAnnotation: agentoffice.ai/agent-kind
                    layout:
                      gridColumn: "1 / -1"
                      gridRowEnd: span 2

    # agentworkstation-binders — frontend plugin.
    # Mounts an "AgentBindingsCard" on the entity overview page of any
    # AgentWorkstation entity. Card has three tabs (Knowledge Bases /
    # Memory Modules / Skills); each tab is a drag-drop <BindingPanel>
    # backed by a strategy hook. Save composes the YAML diff and fires
    # the `agentworkstation-binder-save` Scaffolder template, which
    # opens a PR against the gitops repo (publish:github:pull-request).
    # PR merge → ArgoCD sync → operator reconciles the new bindings.
    #
    # The plugin reads its source data via the in-cluster
    # /api/proxy/agent-office-binders/binders/* endpoints (operator
    # v1.5.3 binder-proxy), reusing the agent-office-backstage-catalog
    # Service that codex-reauth-ui also proxies through.
    #
    # Skills tab is read-only until operator v1.6.0 normalizes
    # SkillBinding into spec.skillRefs (task #51).
    #
    # Image is built by .tekton/agentworkstation-binders-on-push.yaml
    # from rhdh-plugins/agentworkstation-binders/. NOTE: this entry
    # activates as soon as Konflux pushes v0.0.1 of the image — until
    # then RHDH will fail to install this one plugin and log it; other
    # plugins keep working.
    - package: "oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-agentworkstation-binders:v0.0.20!agent-office-backstage-plugin-agentworkstation-binders"
      disabled: false
      pluginConfig:
        proxy:
          endpoints:
            /agent-office-binders:
              target: http://agent-office-backstage-catalog.agent-office-operator.svc.cluster.local
              changeOrigin: true
              # In-cluster only — operator endpoints are unauthenticated,
              # exposing only K8s metadata (KB/MM/Skill names + spec).
              # The plugin runs in the user's browser; this proxy is the
              # only path from browser to operator.
              #
              # pathRewrite: the plugin's useProxiedK8s hook calls paths
              # like /namespaces/<ns>/knowledgebases (no prefix), but
              # the operator registers its handler at /binders/ in
              # cmd/main.go:334 (mux.Handle("/binders/", binders)).
              # Without rewrite, /api/proxy/agent-office-binders/X
              # arrives at the operator as /X and hits the mux 404.
              # Rewrite adds the /binders/ prefix so the operator's
              # path parser (parts[0]=="binders") matches.
              pathRewrite:
                "^/api/proxy/agent-office-binders/?": "/binders/"
            /agent-office-catalog:
              # v1.6.0: separate proxy entry for the operator's
              # /catalog/* endpoints (runtime skill catalog —
              # /catalog/skills, /catalog/skills/<name>; v1.7.11 adds
              # /catalog/packs, v1.7.12 POST /catalog/recommend). Same
              # operator HTTP server as /binders, just a distinct
              # rewrite so the two route trees don't collide.
              target: http://agent-office-backstage-catalog.agent-office-operator.svc.cluster.local
              changeOrigin: true
              # POST is required by /recommend (the one-step creator);
              # explicit rather than relying on proxy defaults.
              allowedMethods: ['GET', 'POST']
              pathRewrite:
                "^/api/proxy/agent-office-catalog/?": "/catalog/"
        dynamicPlugins:
          frontend:
            agent-office-backstage-plugin-agentworkstation-binders:
              # v0.0.7: the SAME binder experience inside the create
              # wizard. Templates reference it via `ui:field:
              # AgentComposer` on an object property (the openclaw-agent
              # template's "Compose the agent" page). Independent of the
              # entity-page card below — codex-reauth-ui ships both a
              # field extension + a card the same way.
              scaffolderFieldExtensions:
                - importName: agentComposerFieldExtension
                  module: PluginRoot
                # v0.0.10: the one-step creator (`ui:field: AgentGenesis`
                # on the openclaw-agent-genesis template).
                - importName: agentGenesisFieldExtension
                  module: PluginRoot
              mountPoints:
                # Mount on any Component carrying the agent-kind
                # annotation (autoresearch | research | pm | developer
                # | …). Full-width card so the three tabs + drag-drop
                # panels have room to breathe.
                - mountPoint: entity.page.overview/cards
                  importName: AgentBindingsCard
                  module: PluginRoot
                  config:
                    if:
                      anyOf:
                        - hasAnnotation: agentoffice.ai/agent-kind
                    layout:
                      gridColumnEnd:
                        lg: "span 12"
                        md: "span 12"
                        xs: "span 12"

    # ================================================================
    # Integration-test / demo surface (DEMO.md). These three are RHDH
    # default plugins shipped DISABLED; we enable them so the
    # agent-office-integration-tests Component gets a live "CI" tab
    # that shows the demo suite's Tekton PipelineRuns.
    #
    # pluginConfig is restated VERBATIM from dynamic-plugins.default.yaml
    # (not relying on merge-with-default semantics) so the mountPoints +
    # cluster locator are deterministic.
    #
    # No new credentials/RBAC needed: the K8S_CLUSTER_* env vars are
    # already wired on the v1-developer-hub deployment (secret
    # rhdh-k8s-credentials → SA rhdh-kubernetes-plugin, which holds a
    # cluster-reader ClusterRoleBinding — read-only, cluster-wide, so it
    # also sees PipelineRuns in the ephemeral test namespace).
    # ================================================================

    # Kubernetes — backend. Cluster locator reads the pre-wired env vars.
    - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
      disabled: false
      pluginConfig:
        kubernetes:
          serviceLocatorMethod:
            type: multiTenant
          clusterLocatorMethods:
            - type: config
              clusters:
                - name: ${K8S_CLUSTER_NAME}
                  url: ${K8S_CLUSTER_URL}
                  authProvider: serviceAccount
                  skipTLSVerify: true
                  serviceAccountToken: ${K8S_CLUSTER_TOKEN}

    # Kubernetes — frontend. Adds the Kubernetes tab on entities carrying
    # the backstage.io/kubernetes-id annotation.
    - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
      disabled: false
      pluginConfig:
        dynamicPlugins:
          frontend:
            backstage.plugin-kubernetes:
              mountPoints:
                - mountPoint: entity.page.kubernetes/cards
                  importName: EntityKubernetesContent
                  config:
                    layout:
                      gridColumn: 1 / -1
                    if:
                      anyOf:
                        - hasAnnotation: backstage.io/kubernetes-id
                        - hasAnnotation: backstage.io/kubernetes-namespace

    # Tekton — adds the "CI" tab (TektonCI card) showing PipelineRuns for
    # entities where isTektonCIAvailable (the janus-idp.io/tekton
    # annotation). This is the demo-watching surface.
    - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.45.3__3.33.3
      disabled: false
      pluginConfig:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-tekton:
              mountPoints:
                - mountPoint: entity.page.ci/cards
                  importName: TektonCI
                  config:
                    layout:
                      gridColumn: 1 / -1
                    if:
                      allOf:
                        - isTektonCIAvailable
