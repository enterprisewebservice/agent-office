# RHDH dynamic-plugins config — declares the OCI plugin images
# RHDH's init container installs into the developer-hub pod's
# dynamic-plugins-root volume.
#
# This ConfigMap was originally created by the RHDH Helm release
# `v1` and overlaid via `kubectl apply` to add cluster-specific
# plugins. Adopting it into the agent-office gitops repo so future
# plugin changes (like the source-filtered-entity-picker added
# below) live in version control instead of being manually patched.
#
# After updates here, restart the dev-hub pod to make the init
# container re-pull and re-install:
#
#   oc -n rhdh-test rollout restart deploy/v1-developer-hub
apiVersion: v1
kind: ConfigMap
metadata:
  name: v1-dynamic-plugins
  namespace: rhdh-test
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    # ArgoCD: replace-on-sync so we win over any leftover Helm
    # owner labels — the underlying ConfigMap shape is the same,
    # only the metadata changes hands.
    argocd.argoproj.io/sync-options: Replace=true
data:
  dynamic-plugins.yaml: |
    includes:
    - dynamic-plugins.default.yaml
    plugins:
    # Red Hat Developer Lightspeed — backend.
    - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-lightspeed-backend:bs_1.45.3__1.2.3!red-hat-developer-hub-backstage-plugin-lightspeed-backend"
      disabled: false
      pluginConfig:
        lightspeed:
          servers:
            - id: openai
              url: https://api.openai.com/v1
              token: ${OPENAI_API_KEY}
              model: gpt-4o

    # Red Hat Developer Lightspeed — frontend.
    - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-lightspeed:bs_1.45.3__1.2.3!red-hat-developer-hub-backstage-plugin-lightspeed"
      disabled: false
      pluginConfig:
        lightspeed:
          prompts:
            - title: "Getting Started with Developer Hub"
              message: "Can you guide me through the first steps to start using Developer Hub?"
            - title: "Create a New Agent"
              message: "How do I create a new AI agent using Agent Office?"
        dynamicPlugins:
          frontend:
            red-hat-developer-hub.backstage-plugin-lightspeed:
              mountPoints:
                - mountPoint: application/provider
                  importName: LightspeedDrawerProvider
                  module: PluginRoot
                - mountPoint: application/internal/drawer-state
                  importName: LightspeedDrawerStateExposer
                  module: PluginRoot
                - mountPoint: application/listener
                  importName: LightspeedFAB
                  module: PluginRoot
              appIcons:
                - name: lightspeedIcon
                  importName: LightspeedIcon
                  module: PluginRoot
              dynamicRoutes:
                - path: /lightspeed
                  importName: LightspeedPage
                  module: PluginRoot
                  menuItem:
                    icon: lightspeedIcon
                    text: Lightspeed

    # GitHub scaffolder actions (publish:github, etc.).
    - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
      disabled: false

    # ArgoCD scaffolder action (argocd:create-resources).
    - package: ./dynamic-plugins/dist/roadiehq-scaffolder-backend-argocd-dynamic
      disabled: false

    # agent-office Source-Filtered EntityPicker.
    #
    # Custom scaffolder field extension that wraps EntityPicker with
    # a filter-icon popover. Used by the karpathy-research-agent
    # template's `baseModel` field to let workshop attendees narrow
    # the model dropdown by source (Registry / Catalog) without
    # typing. The plugin reads the `agentoffice.ai/model-source`
    # annotation that the operator writes on every entity.
    #
    # Image is built by the Konflux pipeline at
    # `.tekton/source-filtered-entity-picker-on-push.yaml` from the
    # plugin source at `rhdh-plugins/source-filtered-entity-picker/`.
    - package: "oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-source-filtered-entity-picker:v0.0.4!agent-office-backstage-plugin-source-filtered-entity-picker"
      disabled: false
      pluginConfig:
        dynamicPlugins:
          frontend:
            # MUST match the loaded plugin name scalprum logs at startup
            # — that name comes from this plugin's package.json `name`
            # field, which is hyphen-only (`agent-office-backstage-
            # plugin-source-filtered-entity-picker`). The dot-form
            # convention only applies when the package name starts
            # with `@<scope>/...`; ours has no npm scope.
            agent-office-backstage-plugin-source-filtered-entity-picker:
              scaffolderFieldExtensions:
                - importName: sourceFilteredEntityPickerFieldExtension
                  module: PluginRoot

    # codex-reauth-action — backend scaffolder module.
    # Adds the `codex:reauth` scaffolder action that runs OAuth
    # device-code flow against OpenAI Codex and writes the resulting
    # auth.json to Vault path agent-office/codex-subscription-
    # credentials (CAS-protected). ESO syncs the K8s Secret within
    # ~60s and every Codex-backed agent pod picks up the new token
    # on the next kubelet refresh.
    #
    # Backend plugins don't have a dynamicPlugins.frontend block;
    # RHDH's backend loader registers them via the role declared in
    # the bundled package.json (`backend-plugin-module`) and the
    # extension point each module hits (scaffolder.actions.v1).
    #
    # Image is built by .tekton/codex-reauth-action-on-push.yaml
    # from rhdh-plugins/codex-reauth-action/.
    - package: "oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-codex-reauth-action:v0.0.1!agent-office-backstage-plugin-codex-reauth-action"
      disabled: false

    # codex-reauth-ui — frontend plugin.
    # Renders:
    #   * CodexAuthCard on the entity overview tab of AgentWorkstation
    #     entities whose model provider is openai-codex.
    #   * CodexAuthPreflightField as a scaffolder field extension
    #     (`ui:field: CodexAuthPreflight`) for any template that wants
    #     to block submission on Codex token freshness.
    # Both open a shared dialog that runs the device-code OAuth flow
    # IN THE BROWSER (server-side calls from cluster IPs are CF-blocked
    # by OpenAI) and posts the resulting tokens to the codex:reauth
    # backend action for KV v2 CAS-write to Vault.
    #
    # Image is built by .tekton/codex-reauth-ui-on-push.yaml.
    - package: "oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-codex-reauth-ui:v0.0.2!agent-office-backstage-plugin-codex-reauth-ui"
      disabled: false
      pluginConfig:
        # Proxy entry so the codex-reauth-ui frontend (running in
        # the user's browser) can reach the operator's in-cluster
        # /codex-auth/status endpoint via Backstage's proxy plugin.
        # The card + scaffolder pre-flight fetch:
        #   /api/proxy/agent-office/codex-auth/status
        # which gets rewritten to the operator's Service.
        proxy:
          endpoints:
            /agent-office:
              target: http://agent-office-backstage-catalog.agent-office-operator.svc.cluster.local
              changeOrigin: true
              # No headers passed through — operator endpoint is
              # in-cluster only, no auth needed (the data is metadata,
              # not secrets).
        dynamicPlugins:
          frontend:
            agent-office-backstage-plugin-codex-reauth-ui:
              scaffolderFieldExtensions:
                - importName: codexAuthPreflightFieldExtension
                  module: PluginRoot
              mountPoints:
                # Show the Codex Subscription Auth card only on
                # agent Component entities. We discriminate via the
                # `agentoffice.ai/agent-kind` annotation that the
                # karpathy template's catalog-info.yaml emits
                # (values: autoresearch | research). Non-agent
                # Components (services, gitops apps, etc.) don't
                # carry that annotation, so the card never mounts
                # there.
                #
                # Existing pre-annotation agents need a one-line
                # patch to their catalog-info.yaml; new ones are
                # already correct via the karpathy skeleton update.
                - mountPoint: entity.page.overview/cards
                  importName: CodexAuthCard
                  config:
                    if:
                      allOf:
                        - isKind: component
                        - hasAnnotation: agentoffice.ai/agent-kind
                    layout:
                      gridColumn: "1 / -1"
                      gridRowEnd: span 2
