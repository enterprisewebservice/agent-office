# Lets the Developer Hub service account read Connectivity Link policies and
# manage API products / API keys for the API catalog plugin (RHCL 1.4 console
# guide, chapter 3; upstream kuadrant-backstage-plugin
# kuadrant-dev-setup/rbac/rhdh-cluster-role.yaml). The plugin's backend talks
# to the cluster with the Kubernetes plugin's cluster locator credentials
# (secret rhdh-k8s-credentials -> SA rhdh-kubernetes-plugin), not with the pod's
# default SA, so both are bound: a key request from the portal creates the
# consumer namespace kuadrant-<user>-<hash>, the key Secret and the APIKey.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhcl-rhdh-plugin-role
rules:
  - apiGroups: ["kuadrant.io"]
    resources: [authpolicies, ratelimitpolicies, dnspolicies, tlspolicies]
    verbs: [get, list, watch]
  - apiGroups: ["extensions.kuadrant.io"]
    resources: [planpolicies]
    verbs: [get, list, watch]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: [apiproducts, apikeys]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: [apikeys/status]
    verbs: [get, patch, update]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: [apikeyrequests]
    verbs: [get, list, watch]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: [apikeyapprovals]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhcl-rhdh-plugin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhcl-rhdh-plugin-role
subjects:
  - kind: ServiceAccount
    name: default
    namespace: rhdh-test
  - kind: ServiceAccount
    name: rhdh-kubernetes-plugin
    namespace: rhdh-test
