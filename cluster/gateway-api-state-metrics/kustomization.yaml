# Gateway API and Connectivity Link resource-state metrics for the Kuadrant
# dashboards (gatewayapi_gateway_info, gatewayapi_httproute_labels, policy
# status ...). This is what the RHCL 1.4 Observability guide's
#   oc apply -k github.com/Kuadrant/kuadrant-operator/config/install/configure/observability
# installs, vendored and pinned: the custom-resource-state config from
# Kuadrant/gateway-api-state-metrics 0.7.0 and the kube-state-metrics
# deployment from kuadrant-operator v1.5.3 (namespace "monitoring", as upstream).
# User workload monitoring scrapes it; because UWM overrides honorLabels, the
# resources' own namespace label arrives as exported_namespace, which is the
# label the dashboards filter on.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-state-metrics.yaml
  - telemetry-agent-office.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: custom-resource-state
    namespace: monitoring
    files:
      - custom-resource-state.yaml
