# ExternalSecret: agent-office-github-app
#
# Replaces the hand-applied Secret that the agent-office-operator
# reads for GitHub App authentication (wiki pushes, Projects v2 calls,
# and — once the installation-token ExternalSecret (see
# agent-office-github-mcp-installation-token.yaml) lands — minting
# rotating installation tokens for github-mcp-server.)
#
# Source of truth: Vault path `agent-office/data/github-app`
#   (KV v2 mount `agent-office`, secret `github-app`).
#
# Three fields stored under that path — all stable; this credential
# rotates roughly once a year (when GitHub App private keys are
# regenerated):
#   appId           — text, e.g. "3559968"
#   installationId  — text, e.g. "128488425"
#   privateKey      — full PEM (BEGIN/END RSA PRIVATE KEY ...), ~1.6KB
#
# Migration from hand-applied Secret (one-time, before this lands):
#   1. `vault kv put agent-office/github-app appId=… installationId=… privateKey=@app.pem`
#      (already done; verify with `vault kv get agent-office/github-app`)
#   2. Apply this ExternalSecret; ESO will create a new Secret with the
#      same name `agent-office-github-app` and same three keys, but with
#      ESO ownerReferences set. If the hand-applied Secret still exists,
#      delete it manually (`oc delete secret agent-office-github-app -n
#      agent-office`) — ESO recreates it within a few seconds via the
#      refreshInterval below. Brief gap during which the operator's
#      wiki-push reconcile may error out and retry on next loop (~30s);
#      acceptable, no data loss.
#
# Refresh: every 1 hour. The PEM does not rotate often. We do not need
# a fast refresh interval here — the SHORT-lived installation token
# (60min TTL) is generated by ESO's GithubAccessToken generator that
# *references* this Secret, and the generator's own ExternalSecret has
# its own refreshInterval (30m) governing rotation cadence. This
# ExternalSecret only needs to re-sync if the underlying PEM in Vault
# changes (rare).
#
# Consumers of this Secret (do NOT change Secret name without
# coordinating):
#   - agent-office-operator-controller-manager (reads appId/installId/
#     privateKey directly via client.Get; see internal/controller/
#     githubapp.go GitHubAppSecretName const)
#   - GithubAccessToken generator
#     `github-app-installation-token-generator` (uses privateKey to
#     mint installation tokens for github-mcp-server)

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-office-github-app
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/credential: github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster
    kind: ClusterSecretStore
  target:
    name: agent-office-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: agent-office
          agentoffice.ai/credential: github-app
  data:
    - secretKey: appId
      remoteRef:
        key: github-app
        property: appId
    - secretKey: installationId
      remoteRef:
        key: github-app
        property: installationId
    - secretKey: privateKey
      remoteRef:
        key: github-app
        property: privateKey
