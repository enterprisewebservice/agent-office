# One Codex sign-in per agent gateway (28 Oct 2026).
#
# Codex refresh tokens are single-use with rotation, so two holders of one
# sign-in cut each other off at the first refresh. Five gateways used to
# share codex-subscription-credentials and stranded each other; each Codex
# gateway now reads its own Vault key, agent-office/codex/<gateway>, into
# <gateway>-codex-credentials, the Secret its AgentGateway names in
# spec.codexCredentialsSecretRef.
#
# Who writes agent-office/codex/<gateway>:
#   * the first seed, by a person: scripts/codex/README.md exports the
#     sign-in the gateway's own pod already holds (nobody signs in again)
#   * the Dev Hub card's Re-authenticate button on that gateway's row
#     (codex-reauth-action, Vault role codex-reauth-writer)
#
# The codex-auth-sync sidecar copies this credential into the gateway's
# agents only when they hold no usable sign-in or this token expires later
# than theirs, so an older copy never overwrites a refreshed one. Once the
# gateway refreshes in its pod, Vault's copy is a recovery seed only; the
# backend judges these credentials by the gateway's daily test turn and
# never refresh-probes them (a probe would spend the token, and ESO would
# put Vault's spent copy back over the rotated one).
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: handsonmode-help-codex-credentials
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/credential: codex-gateway
    agentoffice.ai/codex-gateway: handsonmode-help
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-cluster
    kind: ClusterSecretStore
  target:
    name: handsonmode-help-codex-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: agent-office
          agentoffice.ai/credential: codex-gateway
          agentoffice.ai/codex-gateway: handsonmode-help
  data:
    - secretKey: auth.json
      remoteRef:
        key: codex/handsonmode-help
        property: auth.json
