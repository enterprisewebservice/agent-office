apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-managed ExternalSecret CRs that materialize sensitive
# credentials into K8s Secrets without putting the payloads in
# git. Each entry here corresponds to a Vault path under
# agent-office/<name>. The actual secret values live in Vault and
# are written either by:
#   * `vault kv put` from a human operator (initial seed)
#   * the codex-reauth scaffolder action (interactive re-auth)
#   * the codex-token-refresh CronJob (periodic refresh)

resources:
  - codex-subscription-credentials.yaml
