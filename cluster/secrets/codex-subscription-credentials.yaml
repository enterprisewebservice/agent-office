# ExternalSecret: codex-subscription-credentials
#
# Replaces the hand-applied Secret that openclaw mounts at
# /home/node/.codex/auth.json. ESO syncs from Vault path
# `agent-office/codex-subscription-credentials` into a same-named
# K8s Secret in the agent-office namespace.
#
# - Vault path: agent-office/data/codex-subscription-credentials
# - Vault property: `auth.json` (one big JSON blob with tokens)
# - K8s Secret key:  `auth.json`  (drop-in shape for the existing
#   subPath volume mount; pods don't need to change.)
#
# Refresh: every 1 minute. When the auto-refresh CronJob (Step 6)
# writes a new auth.json to Vault, every agent picks it up within
# ~60s + the kubelet's mounted-secret refresh interval (~60s) —
# total under 2 minutes from refresh to live token.
#
# Re-creating the K8s Secret: creationPolicy: Owner means ESO owns
# the lifecycle. The previous static Secret had to be deleted (or
# adopted) before this could take effect; see migration notes in
# step-2 commit message.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codex-subscription-credentials
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/credential: codex-subscription
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-cluster
    kind: ClusterSecretStore
  target:
    name: codex-subscription-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: agent-office
          agentoffice.ai/credential: codex-subscription
  data:
    - secretKey: auth.json
      remoteRef:
        key: codex-subscription-credentials
        property: auth.json
