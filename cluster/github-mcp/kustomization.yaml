# cluster/github-mcp — github-mcp-server backed by ESO-rotated App tokens
#
# Hosts the official github/github-mcp-server
# (https://github.com/github/github-mcp-server) as an in-cluster
# Deployment whose GITHUB_PERSONAL_ACCESS_TOKEN env var is a rotating
# GitHub App installation token, minted by ESO's GithubAccessToken
# generator and refreshed every 30min. Reloader bounces the pod when
# the token Secret changes.
#
# Why an App-installation-token instead of a static PAT: the PM Agent
# acts as agent-pipelines-as-code[bot] (the App identity) on every
# GitHub action — audit trail preserved, no per-human PAT, no risk of
# a single human's revocation cascading.
#
# Auth path summary:
#   Vault: agent-office/github-app (PEM, appId, installationId)
#     → ExternalSecret (cluster/secrets/agent-office-github-app.yaml)
#     → K8s Secret: agent-office-github-app
#     → GithubAccessToken generator (this dir)
#     → ExternalSecret with refreshInterval 30m (this dir)
#     → K8s Secret: github-mcp-installation-token
#       (key: GITHUB_PERSONAL_ACCESS_TOKEN)
#     → Deployment.envFrom + Reloader annotation
#     → Pod restart on Secret change → fresh token in env
#
# Reloader install: cluster/reloader-app.yaml (Helm chart).
# MCP Gateway in front: cluster/mcp-gateway-operator-app.yaml + the
# MCPServerRegistration / MCPGatewayExtension / AuthPolicy that get
# added once the operator's CRDs land.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-office
resources:
  # ESO chain
  - githubaccesstoken-generator.yaml
  - externalsecret-installation-token.yaml
  # Server itself (+ the accept-proxy sidecar config — injects the governed
  # App token on the upstream call path, which is the github-MCP fix; see
  # accept-proxy-config.yaml for the full why)
  - accept-proxy-config.yaml
  - mcp-server-deployment.yaml
  - mcp-server-service.yaml
  # MCP Gateway wiring (federation pieces). credentialRef (broker-rbac +
  # broker-token-externalsecret) gives the broker the App token for tool
  # DISCOVERY. Tool CALLS are authenticated by the accept-proxy injecting the
  # same token on the call path (see mcp-server-deployment.yaml) — NOT by an
  # AuthPolicy: the router connects to the backend Service directly, bypassing
  # the Gateway route an AuthPolicy would target (Kuadrant issue #926). The
  # earlier backend-auth-policy + authorino-rbac were removed as dead weight.
  - gateway/mcp-gateway.yaml
  - gateway/mcp-gateway-extension.yaml
  - gateway/github-mcp-server-route.yaml
  - gateway/github-mcp-registration.yaml
  - gateway/broker-token-externalsecret.yaml
  - gateway/broker-rbac.yaml
  - gateway/authorino-tls-envoyfilter.yaml
  - gateway/callers-auth-policy.yaml
