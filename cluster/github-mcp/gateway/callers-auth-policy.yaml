# ⛔ DRAFT — DO NOT APPLY AS-IS. Kept in git as the map, OUT of the Argo app
# (commented in kustomization.yaml). Applying the version below is proven
# INEFFECTIVE at best and, on the mcps hop, HARMFUL (fail-closes every tool
# call). Two live experiments on 2026-09-02 established why:
#
# The MCP gateway front door is a SINGLE Envoy listener (0.0.0.0_80). Its HTTP
# filter chain is:  ext_proc(MCP router, INSERT_FIRST) -> ... -> wasm(Kuadrant
# auth) -> router.  The caller identity (Bearer <seat/platform token>) only
# exists on the FRONT hop; the broker's second hop to a backend presents that
# backend's REGISTRATION credential, not the caller's.
#
#   Attach to `mcp`  (front listener): the ext_proc router answers initialize
#     and tools/list itself and short-circuits the chain, so the wasm auth
#     filter never runs for them (auth-service cluster cx_total stayed 0). And
#     ext_proc runs BEFORE the auth filter, so even for tools/call the broker
#     has already been invoked before Authorino sees the request. Result: no
#     enforcement on discovery; a tokenless client still initialized + listed
#     all 165 tools.
#   Attach to `mcps` (backend listener): the wasm auth filter DOES run on the
#     broker->backend hop, but that hop carries the broker's registration
#     credential (e.g. gitea-mcp-broker-token), which is not one of our
#     api_key identities -> apiKey auth fail-closes EVERY tool call with 500,
#     including the platform token's own calls. Discovery (tools/list) still
#     worked because its backend calls don't match the x-mcp-toolname guard.
#     Verified and reverted within one script; production newsdesks logged
#     zero auth errors.
#
# THE VENDOR-INTENDED PATH is the signed "wristband": the MCPGatewayExtension
# already has trustedHeadersKey.generate: Enabled and the operator minted
# mcp-gateway-trusted-headers(+ -private). A front AuthPolicy would
# authenticate the caller and, in response.success.headers, issue an
# `x-mcp-authorized` JWT (customClaims allowed-capabilities, signed ES256 with
# trusted-headers-private-key) that the broker validates to filter tools/list.
# BLOCKER on THIS gateway class (OpenShift data-science-gateway-class): the
# broker's ext_proc is INSERT_FIRST, i.e. it runs BEFORE the Kuadrant auth
# filter, so the wristband the auth step would produce is not yet present when
# the broker builds its response. Making Authorino run ahead of the MCP
# ext_proc is the open question (filter-order / isolated-gateway per the
# vendor's isolated-gateway-deployment.md). Until that is settled with Dean,
# enforcement is not wired. The CALLER IDENTITIES this policy needs are already
# shipped (every seat + the platform token carry api_key + the
# agentoffice.ai/mcp-* labels/annotations), so whichever design wins, the
# substrate is in place.
#
# Kuadrant refs: docs/guides/authorization.md (x-mcp-* headers),
# user-based-tool-filter.md (wristband), isolated-gateway-deployment.md.
#
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-gateway-callers   # DRAFT — see header; do not apply
  namespace: agent-office
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: caller-authorization
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    sectionName: mcp
  when:
    - predicate: "!request.path.startsWith('/.well-known/')"
  rules:
    authentication:
      "gateway-callers":
        apiKey:
          selector:
            matchLabels:
              agentoffice.ai/mcp-gateway-caller: "true"
          allNamespaces: true
        credentials:
          authorizationHeader:
            prefix: Bearer
    authorization:
      "tool-access":
        opa:
          rego: |
            # (Authorino prepends `default allow = false` itself — do not repeat it)
            headers := input.context.request.http.headers
            tool := object.get(headers, "x-mcp-toolname", "")
            server := object.get(headers, "x-mcp-servername", "")
            meta := object.get(input.auth.identity, "metadata", {})
            ann := object.get(meta, "annotations", {})
            allowed := split(object.get(ann, "agentoffice.ai/mcp-servers", ""), ",")
            home := object.get(ann, "agentoffice.ai/mcp-namespace", "")

            # session traffic that is not a tool call
            allow { tool == "" }

            # platform callers: every registered server
            allow { tool != ""; allowed[_] == "*" }

            # a server this identity lists explicitly (<namespace>/<registration>)
            allow { tool != ""; allowed[_] == server }

            # any server registered in the caller's own namespace
            allow { tool != ""; home != ""; startswith(server, sprintf("%s/", [home])) }
    response:
      unauthenticated:
        code: 401
        headers:
          "WWW-Authenticate":
            value: Bearer realm="mcp-gateway"
        body:
          value: '{"error":"Unauthorized","message":"MCP access denied: no recognised caller token. Send Authorization: Bearer <your seat token>."}'
      unauthorized:
        code: 403
        body:
          expression: |
            '{"error":"Forbidden","message":"MCP access denied: this caller may not use tool ' + ('x-mcp-toolname' in request.headers ? request.headers['x-mcp-toolname'] : '?') + ' on server ' + ('x-mcp-servername' in request.headers ? request.headers['x-mcp-servername'] : '?') + '"}'
