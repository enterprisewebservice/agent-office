# Backend HTTPRoute — attaches the github-mcp-server Service to the
# Gateway's `mcps` listener.
#
# The broker (an Envoy in the gateway pod) routes per-tool MCP calls
# to backends through their HTTPRoutes. To attach to the `mcps`
# listener we use parentRefs.sectionName=mcps + a hostname matching
# the listener's wildcard (*.mcp.local).
#
# Path /mcp is the upstream binary's MCP endpoint (per the v1.0.4
# Streamable-HTTP transport). Anything not /mcp on this hostname
# returns 404 by the backend, which is fine — the broker only
# forwards MCP traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-mcp-server-route
  namespace: agent-office
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: backend-route
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
      namespace: agent-office
      sectionName: mcps
  hostnames:
    - github-mcp.mcp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        # group/kind/weight are API-server defaults, spelled out so
        # ArgoCD's compare sees git == live (omitting them left the app
        # permanently OutOfSync once the compare revived post-032ffc6).
        - group: ""
          kind: Service
          name: github-mcp-server
          port: 8080
          weight: 1
