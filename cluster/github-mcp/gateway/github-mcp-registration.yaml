# MCPServerRegistration — tells the gateway operator's broker about
# the github backend so it can:
#   1. On startup: connect to the backend via the credentialRef and
#      call tools/list to discover available MCP tools.
#   2. On each user request: forward the request to the backend's
#      HTTPRoute (and inject the per-user trusted-header JWT for
#      tool-allowlist enforcement, if user-based filtering is in use).
#
# credentialRef points at github-mcp-broker-token, NOT the
# github-mcp-installation-token Secret directly — because:
#   * the broker expects the Secret VALUE to be the literal
#     `Authorization` header value (i.e. "Bearer ghs_...")
#   * the broker expects the Secret to carry the label
#     `mcp.kuadrant.io/secret: "true"` (it filters Secrets by label)
# Our github-mcp-installation-token contains a raw token (no Bearer
# prefix) and is shaped for envFrom. Mutating it would break the
# github-mcp-server Deployment. So we project a second Secret with
# the bearer-prefixed shape: see broker-token-externalsecret.yaml.
#
# Tool-name prefix: the broker prefixes this backend's tools `github_`
# (agents see `github_issue_write`, etc.). The field that used to set
# this — spec.toolPrefix — was RENAMED to spec.prefix in a newer
# mcp-gateway operator, and the default is now derived from the
# registration name, which for `github` yields exactly the github_
# prefix we want; live state carries no prefix field at all. We match
# live and set nothing. NB: the stale toolPrefix line broke ArgoCD's
# structured-merge diff ("field not declared in schema") from June
# until 2026-08-10, which silently disabled auto-sync for this whole
# app — if this app ever reads sync=Unknown again, check for a schema
# drift like that first.
#
# NOTE: per Kuadrant v0.6.0 design, credentialRef is used ONLY for
# the broker's discovery connection. Per-user requests still need an
# Authorization header. For our case the github-mcp-server requires
# one too — so we additionally attach an AuthPolicy to the backend
# HTTPRoute that rewrites Authorization with the fresh installation
# token from the ESO secret (see backend-auth-policy.yaml).
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: github
  namespace: agent-office
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: registration
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    # client-recipe: the exact spec.tools.mcpServers entry an
    # AgentWorkstation needs to consume this registration. Served by
    # the operator's /catalog/packs endpoint (>= v1.7.11) so composers
    # offer this tool as a searchable catalog item instead of shipping
    # a hardcoded preset. The recipe is data owned HERE, beside the
    # registration it describes — change the wiring, and every
    # composer picks it up without a plugin release.
    #
    # This github backend is the one registration whose client also
    # sends an Authorization header (the gateway separately rewrites
    # it per-call from the ESO-rotated installation token, see
    # backend-auth-policy.yaml) — hence authHeaderValue/envFromSecret
    # here while most registrations need only the bare gateway URL.
    agentoffice.ai/client-recipe: '{"url":"http://mcp-gateway-data-science-gateway-class.agent-office.svc.cluster.local/mcp","type":"http","authHeaderValue":"Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}","envFromSecret":"github-mcp-installation-token"}'
    agentoffice.ai/display-name: "GitHub (governed)"
    agentoffice.ai/description: "Create issues, projects, and repos as a governed identity — github_* tools behind the MCP gateway; the agent never holds a GitHub token."
spec:
  path: /mcp
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: github-mcp-server-route
  credentialRef:
    name: github-mcp-broker-token
    key: AUTHORIZATION
