# ExternalSecret: github-mcp-broker-token
#
# Bearer-prefixed projection of the same installation token, shaped
# for the mcp-gateway operator's broker credentialRef contract:
#
#   * Secret key:   AUTHORIZATION
#     (the broker reads this raw and uses it as the Authorization
#     header value — so it MUST include the "Bearer " prefix)
#
#   * Required label: mcp.kuadrant.io/secret: "true"
#     (the broker filters credential secrets by this label)
#
# Source of truth: same GithubAccessToken generator that drives
# github-mcp-installation-token (see githubaccesstoken-generator.yaml
# in the parent dir). We re-use the generator so both Secrets stay
# in sync — each refresh rolls both consumers (the github-mcp-server
# Deployment via Reloader on `github-mcp-installation-token`, and
# the broker on this Secret via its own watch).
#
# Why we can't just relabel/reshape the existing Secret: the
# github-mcp-server Deployment uses envFrom on
# github-mcp-installation-token expecting the key
# GITHUB_PERSONAL_ACCESS_TOKEN with a RAW token value (no prefix).
# The broker expects key AUTHORIZATION with a `Bearer ` prefix.
# Different consumers, different shape — easier to project twice
# than to maintain two consumers reading one shape.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-mcp-broker-token
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: broker-credential
    agentoffice.ai/credential: github-broker-token
spec:
  refreshInterval: 30m
  target:
    name: github-mcp-broker-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          # REQUIRED — operator filters credential secrets by this label.
          mcp.kuadrant.io/secret: "true"
          app.kubernetes.io/managed-by: agent-office
          app.kubernetes.io/name: github-mcp-server
          app.kubernetes.io/component: broker-credential
      data:
        # Go-template the bearer prefix in front of the generator's
        # `token` field. ESO injects the generator output as
        # `.token` in the template context.
        AUTHORIZATION: "Bearer {{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-mcp-installation-token
