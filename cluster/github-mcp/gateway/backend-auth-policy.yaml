# Backend AuthPolicy — Authorino rewrites the Authorization header on
# every request the broker forwards to github-mcp-server.
#
# Why this exists: the official github-mcp-server, run in HTTP mode
# (`http --toolsets=all`), authenticates EVERY incoming MCP request
# with that request's own `Authorization: Bearer <token>` header and
# reuses the same token for its outbound GitHub API calls. Agents
# calling the gateway do NOT know the App installation token (rotated
# every 30min by ESO; agents have no RBAC to read it). So the gateway
# must inject it as the request transits — Authorino's
# response.success.headers feature does exactly that.
#
# Per the Kuadrant MCP-gateway docs, the MCPServerRegistration
# credentialRef is consumed ONLY by the broker for tool DISCOVERY; it
# is NOT applied to forwarded tool calls. Per-request injection on the
# data path therefore REQUIRES this AuthPolicy on the HTTPRoute.
#
# Token source — the base64 problem and why we read the broker-token:
#   Authorino reads the token from a Secret at REQUEST TIME via a
#   metadata HTTP lookup against the Kubernetes API, so the value is
#   always the current rotated token (no caching, no stale window).
#   The k8s API returns Secret `data` base64-encoded, and Authorino's
#   CEL build has NO base64 decode — both `base64decode` and the
#   cel-go `base64.decode` are undeclared refs that fail to compile
#   (AuthConfig never enforces). The ONLY base64 mechanism Authorino
#   exposes is the JSONPath `@base64:decode` modifier, usable from a
#   `selector` (NOT a CEL `expression`). A selector resolves a single
#   value and can't concatenate a literal "Bearer " prefix — so we
#   read the github-mcp-broker-token Secret, whose AUTHORIZATION key
#   already holds the full "Bearer <token>" string (built by the
#   broker-token ExternalSecret template), and `@base64:decode` it as
#   one unit. No CEL, no concatenation.
#
#   The metadata read is authenticated with a dedicated least-
#   privilege SA token (RBAC: get ONLY github-mcp-broker-token — see
#   authorino-rbac.yaml), sent via sharedSecretRef. Under anonymous
#   auth, auth.identity is empty, so the earlier `auth.identity.token`
#   read silently failed and injected an empty token (a root cause of
#   the 401s).
#
# Auth strategy:
#   - authentication "anonymous": accept any caller (the in-cluster
#     gateway is the trust boundary for MVP; tighten later with SA
#     token validation so only openclaw/pm-agent pods are accepted).
#   - response.success.headers.authorization: OVERWRITE the request's
#     Authorization with the fresh "Bearer <token>", regardless of
#     what the caller sent.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: github-backend-token-inject
  namespace: agent-office
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: backend-auth-policy
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: github-mcp-server-route
  rules:
    authentication:
      "anonymous":
        anonymous: {}
    metadata:
      "token_secret":
        http:
          # Read the broker-token Secret (key AUTHORIZATION = "Bearer <tok>")
          # via the k8s API at request time — always the current rotated token.
          urlExpression: "'https://kubernetes.default.svc/api/v1/namespaces/agent-office/secrets/github-mcp-broker-token'"
          method: GET
          headers:
            "Accept":
              value: "application/json"
        # Authenticate the k8s API read with the dedicated reader SA token
        # (RBAC: get ONLY github-mcp-broker-token — authorino-rbac.yaml).
        sharedSecretRef:
          name: github-mcp-token-reader-sa-token
          key: token
        credentials:
          authorizationHeader:
            prefix: Bearer
    response:
      success:
        headers:
          "authorization":
            plain:
              # JSONPath selector + @base64:decode modifier (Authorino CEL has
              # no base64). The broker-token's AUTHORIZATION value is already
              # "Bearer <token>", so decoding it yields the complete header.
              selector: auth.metadata.token_secret.data.AUTHORIZATION.@base64:decode
