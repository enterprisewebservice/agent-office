# Two shell scripts the sidecar + init container use to mint App
# installation tokens. Plain bash + curl + openssl — no compiled binary
# to maintain, easy to audit.
#
# Both scripts read the App credentials from a Secret volume at /app-key
# (mounted read-only) and write the resulting installation token to a
# shared emptyDir at /tokens/github-installation. The mcp-server
# container reads that file via its entrypoint wrapper.
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-mcp-refresh-scripts
data:
  mint-token.sh: |
    #!/bin/sh
    # Sign an App JWT and exchange for a 1-hour installation token.
    # Writes the token atomically to /tokens/github-installation.
    # Used both as a one-shot (init container) and inside a loop (sidecar).
    set -eu
    APP_ID=$(cat /app-key/appId | tr -d '[:space:]')
    INSTALL_ID=$(cat /app-key/installationId | tr -d '[:space:]')
    KEY=/app-key/privateKey

    now=$(date +%s)
    iat=$((now - 60))
    exp=$((now + 540))

    # Base64URL helpers (alpine has busybox base64 -w0 + tr).
    b64url() {
      base64 -w0 | tr '+/' '-_' | tr -d '='
    }
    hdr=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
    pld=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$iat" "$exp" "$APP_ID" | b64url)
    signing="$hdr.$pld"
    sig=$(printf '%s' "$signing" | openssl dgst -sha256 -sign "$KEY" -binary | b64url)
    jwt="$signing.$sig"

    # Exchange JWT for installation token. Use jq if present, otherwise sed.
    resp=$(curl -sf -X POST \
      -H "Authorization: Bearer $jwt" \
      -H "Accept: application/vnd.github+json" \
      "https://api.github.com/app/installations/${INSTALL_ID}/access_tokens")
    # Prefer Python3 (UBI9 ships it; robust to pretty-printed JSON).
    # Fall back to a whitespace-tolerant sed regex if Python is gone.
    if command -v python3 >/dev/null 2>&1; then
      token=$(printf '%s' "$resp" | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
    elif command -v jq >/dev/null 2>&1; then
      token=$(printf '%s' "$resp" | jq -r .token)
    else
      # GitHub's response is pretty-printed multi-line JSON; the
      # `"token": "..."` line has whitespace after the colon. The
      # earlier no-whitespace regex silently returned empty and
      # crashed the init container — fixed in v1.0.1 of this script.
      token=$(printf '%s' "$resp" | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
    fi
    if [ -z "$token" ] || [ "$token" = "null" ]; then
      echo "FATAL: mint-token: GitHub returned no token. response: $resp" >&2
      exit 1
    fi

    # Atomic write so the mcp-server's entrypoint never reads a torn file.
    printf '%s' "$token" > /tokens/github-installation.new
    mv /tokens/github-installation.new /tokens/github-installation
    echo "$(date -u +%FT%TZ) minted token ($(printf '%s' "$token" | wc -c) bytes)"

  refresh-loop.sh: |
    #!/bin/sh
    # Sidecar entrypoint. Periodically re-mints the installation token
    # (1h TTL; we refresh at 50 min for safety margin), then SIGTERMs
    # github-mcp-server so kubelet restarts it with the fresh token
    # in env. shareProcessNamespace lets us see the binary's PID.
    set -eu
    REFRESH_SEC=${REFRESH_SEC:-3000}    # 50 minutes
    echo "$(date -u +%FT%TZ) refresh-loop started, interval ${REFRESH_SEC}s"
    while true; do
      sleep "$REFRESH_SEC"
      if ! /scripts/mint-token.sh; then
        echo "$(date -u +%FT%TZ) refresh FAILED — leaving old token in place; will retry next cycle" >&2
        continue
      fi
      # Signal the mcp-server binary to exit so kubelet restarts it.
      # The entrypoint wrapper reads /tokens/github-installation at
      # startup, so the new pid will have the fresh token.
      if pkill -SIGTERM -f 'github-mcp-server'; then
        echo "$(date -u +%FT%TZ) SIGTERM sent to github-mcp-server; kubelet will restart"
      else
        echo "$(date -u +%FT%TZ) WARN: no github-mcp-server process to signal; server may have already exited"
      fi
    done

  server-entrypoint.sh: |
    #!/bin/sh
    # Wraps github-mcp-server so we can inject the current installation
    # token from the sidecar-written file into the env var the server
    # expects. The file is guaranteed to exist before this runs because
    # the init container mints it before main containers start.
    set -eu
    if [ ! -s /tokens/github-installation ]; then
      echo "FATAL: server-entrypoint: /tokens/github-installation is empty or missing" >&2
      exit 1
    fi
    export GITHUB_PERSONAL_ACCESS_TOKEN=$(cat /tokens/github-installation)
    echo "$(date -u +%FT%TZ) server-entrypoint: token loaded (length=$(printf '%s' "$GITHUB_PERSONAL_ACCESS_TOKEN" | wc -c)); exec github-mcp-server"
    # The official image's binary lives at /server/github-mcp-server.
    # We run in HTTP mode so the gateway pod can reach us via a K8s
    # Service. `--enable-toolsets all` exposes the full surface
    # (repos, issues, pull-requests, projects, search, etc.) — PM
    # only uses the projects + issues subset but we keep the rest
    # available for future agent roles. Listen on 0.0.0.0:8080;
    # Service publishes ClusterIP on that port.
    exec /server/github-mcp-server http \
      --transport sse \
      --host 0.0.0.0 \
      --port 8080 \
      --enable-toolsets all
