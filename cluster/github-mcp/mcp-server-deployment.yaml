# github-mcp-server Deployment — ESO + Reloader edition.
#
# The full credential chain:
#
#   Vault: agent-office/github-app
#     │ (ExternalSecret in cluster/secrets/agent-office-github-app.yaml,
#     │  refresh every 1h — only changes when PEM is rotated, ~yearly)
#     ▼
#   Secret: agent-office-github-app  (appId, installationId, privateKey)
#     │ (GithubAccessToken generator in cluster/github-mcp/
#     │  githubaccesstoken-generator.yaml signs a JWT + exchanges it
#     │  for a 60-min installation token)
#     ▼
#   Secret: github-mcp-installation-token  (GITHUB_PERSONAL_ACCESS_TOKEN)
#     │ (ExternalSecret in cluster/github-mcp/
#     │  externalsecret-installation-token.yaml refreshes every 30min)
#     ▼
#   THIS Deployment  (envFrom secretRef — binary reads env at startup)
#     │ (Reloader watches the Secret via the annotation below and rolls
#     │  the Deployment when the value changes — ~5s SSE drop, agents
#     │  reconnect transparently)
#     ▼
#   api.github.com  (Authorization: token ghs_...)
#
# Token MINTING stays out of the pod — ESO owns it (no SA, no RBAC, no
# in-pod minting). The one init container below is NOT a minter; it is a
# readiness GATE. envFrom is read once at container start, so if the pod
# boots in the brief window where an ESO refresh has left the Secret
# empty/mid-write, the server comes up token-less and 401s every request
# until the next Reloader bounce (observed in the wild). The gate blocks
# startup until the mounted Secret holds a token github actually accepts,
# so the main container's envFrom can only ever snapshot a valid one. It
# needs no K8s API access — it reads the mounted Secret + calls
# api.github.com, exactly like the server does.
#
# Why Recreate strategy: only ever one instance. Rolling update would
# briefly have two pods sharing the same SSE port from openclaw's
# perspective (harmless but pointless).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp-server
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    # Reloader: bounce this Deployment when the named Secret changes.
    # The Secret is the one ESO refreshes every 30min via the
    # GithubAccessToken generator chain (see comment block above).
    secret.reloader.stakater.com/reload: "github-mcp-installation-token"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-mcp-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      # Default SA is fine — pod talks ONLY to api.github.com via the
      # binary's bearer token. No K8s API access needed (no init
      # container, no token minting in-pod).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Readiness gate — do not start the server until the rotated Secret
      # actually holds a token github accepts (see header comment). This
      # makes the boot resilient to the ESO-refresh / Reloader-restart race.
      initContainers:
        - name: wait-for-valid-token
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 100); do
                T=$(cat /token/GITHUB_PERSONAL_ACCESS_TOKEN 2>/dev/null)
                if [ -n "$T" ] && curl -sf -o /dev/null --max-time 8 \
                     -H "Authorization: Bearer $T" \
                     https://api.github.com/installation/repositories; then
                  echo "github token valid — starting mcp-server"; exit 0
                fi
                echo "[$i] token empty/invalid; waiting for ESO/Reloader to settle..."
                sleep 3
              done
              echo "timed out waiting for a valid github token"; exit 1
          volumeMounts:
            - {name: installation-token, mountPath: /token, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {cpu: 100m, memory: 64Mi}
      containers:
        - name: mcp-server
          image: ghcr.io/github/github-mcp-server:latest
          imagePullPolicy: IfNotPresent
          # HTTP transport on :8080 with all toolsets enabled.
          # The `http` subcommand serves MCP via the Streamable HTTP
          # transport (which supersedes the older SSE-only flag set).
          # Binary always binds 0.0.0.0 in a container — no --host
          # flag exists. Real flags per `server http --help`:
          #   --port (default 8082; we use 8080 to match Service)
          # Global flag for tool surface:
          #   --toolsets=all (covers projects, issues, repos, etc.)
          args:
            - "http"
            - "--port=8080"
            - "--toolsets=all"
          # envFrom: every key in the Secret becomes a pod env var.
          # The Secret has exactly one key — GITHUB_PERSONAL_ACCESS_TOKEN
          # — produced by the ExternalSecret's rewrite rule.
          envFrom:
            - secretRef:
                name: github-mcp-installation-token
          ports:
            - name: sse
              containerPort: 8080
              protocol: TCP
          # TCP socket probe — the binary serves MCP JSON-RPC over
          # HTTP POST, no GET /healthz endpoint. GET / returns 405
          # which kubelet treats as probe failure. Open TCP port is
          # the most reliable "process is alive + listening" signal
          # without depending on MCP protocol semantics.
          startupProbe:
            tcpSocket: {port: sse}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: sse}
            periodSeconds: 10
          # No livenessProbe — token expiry shouldn't kill the pod
          # (Reloader handles the restart). The binary itself has no
          # internal heartbeat we can probe meaningfully.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
      # The same rotated Secret, mounted as a file so the init gate can poll
      # it live (the main container reads it via start-time envFrom instead).
      volumes:
        - name: installation-token
          secret:
            secretName: github-mcp-installation-token
