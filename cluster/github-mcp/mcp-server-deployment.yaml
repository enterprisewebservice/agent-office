# github-mcp-server Deployment — ESO + Reloader + Accept-normalizer edition.
#
# Credential chain (token MINTING stays out of the pod — ESO owns it):
#   Vault: agent-office/github-app
#     → Secret: agent-office-github-app (appId, installationId, privateKey)
#     → GithubAccessToken generator → Secret: github-mcp-installation-token
#     → THIS Deployment (envFrom). In HTTP mode this env token is only a
#       FALLBACK — per-request tokens arrive in the Authorization header
#       from the MCP Gateway broker, so the env value is not on the hot
#       path (the server answers each call with the incoming header).
#
# TWO containers:
#   1. accept-proxy (nginx) — listens :8080 (the Service target), rewrites
#      the Accept header, forwards to the server on :8082.
#   2. mcp-server (github)  — the official server on :8082 (internal only).
#
# WHY the accept-proxy (the github-MCP root cause):
#   github-mcp-server's Streamable HTTP transport (official MCP Go SDK)
#   strictly enforces the spec — a POST whose Accept header omits
#   `text/event-stream` is rejected HTTP 400. The Red Hat MCP Gateway
#   Router (vendoring mark3labs/mcp-go v0.53.0) sends an incomplete
#   `Accept: application/json` when opening its upstream session, so
#   every forwarded tool call failed ("4xx for initialize POST, likely a
#   legacy SSE server") and the broker dropped the github toolset. The
#   proxy rewrites Accept to list both content types, making the Router's
#   request spec-compliant at the one hop we control. Remove this shim
#   once the gateway ships a fixed mark3labs/mcp-go. Config + full
#   rationale: accept-proxy-config.yaml.
#
# Image is pinned by DIGEST (not :latest): a silent :latest drift to a
# stricter server build is exactly what broke this. Pin so upgrades are
# deliberate and reproducible. (Update the digest intentionally.)
#
# Recreate strategy: only ever one instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp-server
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    # Reloader: bounce the Deployment when the rotated token Secret changes.
    secret.reloader.stakater.com/reload: "github-mcp-installation-token"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-mcp-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ── 1. Accept-header normalizer (see header comment for WHY) ──
        - name: accept-proxy
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          imagePullPolicy: IfNotPresent
          # Run nginx directly with our self-contained config (bypasses the
          # s2i run wrapper). Config is mounted at /etc/nginx/nginx.conf.
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: sse            # the Service targets this named port
              containerPort: 8080
              protocol: TCP
          # TCP probes: nginx up + listening. github-mcp-server readiness
          # is gated by the mcp-server container's own probe below.
          startupProbe:
            tcpSocket: {port: sse}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: sse}
            periodSeconds: 10
          volumeMounts:
            - {name: accept-proxy-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
        # ── 2. The official github-mcp-server (internal :8082) ──
        - name: mcp-server
          # Pinned by digest (was :latest — see header comment).
          image: ghcr.io/github/github-mcp-server@sha256:458c77c8a77c2e6ada1db56396bae79c81485c296b77ac7aa7c5afed49010a88
          imagePullPolicy: IfNotPresent
          # Streamable HTTP on :8082 (internal; the accept-proxy fronts it
          # on :8080). --toolsets=all covers projects, issues, repos, etc.
          args:
            - "http"
            - "--port=8082"
            - "--toolsets=all"
          # envFrom: the one Secret key (GITHUB_PERSONAL_ACCESS_TOKEN)
          # becomes a pod env var. HTTP mode uses it only as a fallback;
          # real auth is the per-request header injected by the broker.
          envFrom:
            - secretRef:
                name: github-mcp-installation-token
          ports:
            - name: mcp
              containerPort: 8082
              protocol: TCP
          startupProbe:
            tcpSocket: {port: mcp}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: mcp}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
      volumes:
        - name: accept-proxy-config
          configMap:
            name: github-mcp-accept-proxy
        - name: nginx-tmp
          emptyDir: {}
