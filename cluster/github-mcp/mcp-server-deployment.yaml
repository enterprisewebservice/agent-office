# github-mcp-server Deployment — ESO + Reloader + Accept-normalizer edition.
#
# Credential chain (token MINTING stays out of the pod — ESO owns it):
#   Vault: agent-office/github-app
#     → Secret: agent-office-github-app (appId, installationId, privateKey)
#     → GithubAccessToken generator → Secret: github-mcp-installation-token
#     → THIS Deployment (envFrom). In HTTP mode this env token is only a
#       FALLBACK — per-request tokens arrive in the Authorization header
#       from the MCP Gateway broker, so the env value is not on the hot
#       path (the server answers each call with the incoming header).
#
# TWO containers:
#   1. accept-proxy (nginx) — listens :8080 (the Service target), rewrites
#      the Accept header, forwards to the server on :8082.
#   2. mcp-server (github)  — the official server on :8082 (internal only).
#
# WHY the accept-proxy (the github-MCP root cause):
#   The MCPServerRegistration `credentialRef` is consumed ONLY by the broker
#   for tool DISCOVERY (per the Kuadrant external-mcp-server guide); it is NOT
#   propagated to the router's per-call `initialize` (Kuadrant issue #926). So
#   tool DISCOVERY worked (broker 200) but tool CALLS reached github-mcp-server
#   unauthenticated and were rejected (400/401 — mark3labs/mcp-go mislabels
#   that as "legacy SSE / 4xx for initialize POST"). The accept-proxy injects
#   the governed App token on EVERY upstream request — the one hop on the
#   direct Service path both the broker and router traverse — so calls
#   authenticate, while the agent never holds the token. It also normalizes
#   the Accept header (Streamable-HTTP/SSE) defensively. Full rationale +
#   config: accept-proxy-config.yaml.
#
# Image is pinned by DIGEST (not :latest): a silent :latest drift to a
# stricter server build is exactly what broke this. Pin so upgrades are
# deliberate and reproducible. (Update the digest intentionally.)
#
# Recreate strategy: only ever one instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp-server
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    # Reloader: bounce the Deployment when EITHER rotated token Secret changes
    # — installation-token (server env fallback) or broker-token (the App
    # token the accept-proxy injects; bounce re-bakes it from the Secret).
    secret.reloader.stakater.com/reload: "github-mcp-installation-token,github-mcp-broker-token"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-mcp-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ── 1. Accept-header normalizer (see header comment for WHY) ──
        - name: accept-proxy
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          imagePullPolicy: IfNotPresent
          # Bake the governed App token from the mounted broker-token Secret
          # into the nginx include (/tmp/auth.conf), then run nginx with our
          # self-contained config. The agent never holds the token; Reloader
          # restarts the pod on Secret rotation so the bake refreshes.
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf 'proxy_set_header Authorization "%s";\n' "$(tr -d '\n' < /run/ghtoken/AUTHORIZATION)" > /tmp/auth.conf
              exec nginx -g 'daemon off;'
          ports:
            - name: sse            # the Service targets this named port
              containerPort: 8080
              protocol: TCP
          # TCP probes: nginx up + listening. github-mcp-server readiness
          # is gated by the mcp-server container's own probe below.
          startupProbe:
            tcpSocket: {port: sse}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: sse}
            periodSeconds: 10
          volumeMounts:
            - {name: accept-proxy-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: ghtoken, mountPath: /run/ghtoken, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
        # ── 2. The official github-mcp-server (internal :8082) ──
        - name: mcp-server
          # Pinned to a release tag (was :latest — the silent drift it caused
          # is the kind of surprise we don't want). v1.1.2 ships the current
          # MCP go-sdk; update deliberately.
          image: ghcr.io/github/github-mcp-server:v1.1.2
          imagePullPolicy: IfNotPresent
          # Streamable HTTP on :8082 (internal; the accept-proxy fronts it
          # on :8080). --toolsets=all covers projects, issues, repos, etc.
          args:
            - "http"
            - "--port=8082"
            - "--toolsets=all"
          # envFrom: the one Secret key (GITHUB_PERSONAL_ACCESS_TOKEN)
          # becomes a pod env var. HTTP mode uses it only as a fallback;
          # real auth is the per-request header injected by the broker.
          envFrom:
            - secretRef:
                name: github-mcp-installation-token
          ports:
            - name: mcp
              containerPort: 8082
              protocol: TCP
          startupProbe:
            tcpSocket: {port: mcp}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: mcp}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
      volumes:
        - name: accept-proxy-config
          configMap:
            name: github-mcp-accept-proxy
        - name: nginx-tmp
          emptyDir: {}
        # The governed App token the accept-proxy injects (key: AUTHORIZATION
        # = "Bearer <tok>"). Same Secret the broker uses via credentialRef.
        - name: ghtoken
          secret:
            secretName: github-mcp-broker-token
