# ClusterIP Service exposing the github-mcp-server's SSE endpoint.
# openclaw will reach this via the gateway pod's --mcp-config
# (cluster-local DNS: github-mcp-server.agent-office.svc.cluster.local:8080).
apiVersion: v1
kind: Service
metadata:
  name: github-mcp-server
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: github-mcp-server
  ports:
    - name: sse
      port: 8080
      targetPort: sse
      protocol: TCP
