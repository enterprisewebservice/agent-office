# nginx config for the accept-proxy sidecar fronting github-mcp-server.
#
# It does TWO things for the governed github MCP path:
#
# 1. ACCEPT normalization — advertises both `application/json` and
#    `text/event-stream` upstream. The Kuadrant gateway's data path (mcp-go)
#    is Streamable-HTTP/SSE; a POST that omits text/event-stream is 400'd.
#
# 2. AUTH injection (the real fix) — sets the Authorization header to the
#    governed GitHub App token on EVERY upstream request. Per the Kuadrant
#    guide (docs/guides/external-mcp-server.md), the MCPServerRegistration
#    `credentialRef` is consumed ONLY by the broker for tool DISCOVERY; it is
#    NOT propagated to the router's per-call `initialize` (Kuadrant issue
#    #926). So tool CALLS reached github-mcp-server without a usable
#    credential and were rejected (400/401 — "legacy SSE" was a misleading
#    relabel). We inject the shared App token here — the one hop on the
#    direct Service path that BOTH the broker and the router traverse — so
#    every upstream request authenticates. The agent never holds the token
#    (the governance boundary is preserved).
#
#    The token is baked into /tmp/auth.conf at container start from the
#    mounted github-mcp-broker-token Secret (see the Deployment command), and
#    Reloader restarts the pod when that Secret rotates so the bake refreshes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-mcp-accept-proxy
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: accept-proxy
    app.kubernetes.io/managed-by: agent-office-gitops
data:
  nginx.conf: |
    # Self-contained — all writable paths point at /tmp (an emptyDir) so
    # the container can run with a random OpenShift UID.
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/cbt;
      proxy_temp_path        /tmp/pt;
      fastcgi_temp_path      /tmp/fct;
      uwsgi_temp_path        /tmp/ut;
      scgi_temp_path         /tmp/st;
      access_log /dev/stdout;
      server {
        listen 8080;
        location / {
          proxy_pass http://127.0.0.1:8082;
          proxy_http_version 1.1;
          # (1) Accept normalization.
          proxy_set_header Accept "application/json, text/event-stream";
          # (2) Governed App-token injection — baked from the mounted Secret
          #     at startup as: proxy_set_header Authorization "Bearer <tok>";
          include /tmp/auth.conf;
          proxy_set_header Connection "";
          # Stream SSE responses straight through (no buffering).
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
