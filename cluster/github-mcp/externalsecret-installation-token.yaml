# ExternalSecret: github-mcp-installation-token
#
# Materializes the rotating GitHub App installation token (minted by
# the GithubAccessToken generator in githubaccesstoken-generator.yaml)
# into a K8s Secret with the env-var shape that the upstream
# github-mcp-server binary expects:
#
#   Secret keys:
#     GITHUB_PERSONAL_ACCESS_TOKEN   — fresh installation token,
#                                       starts with `ghs_`
#
# The github-mcp-server Deployment mounts this Secret via envFrom
# (so the binary sees GITHUB_PERSONAL_ACCESS_TOKEN at startup as if
# it were a plain PAT). Reloader watches this Secret and rolls the
# Deployment on each refresh.
#
# Refresh cadence: 30 minutes. GitHub installation tokens TTL is
# 60 min, so we have a 30 min safety margin (and Reloader's
# restart latency of a few seconds is negligible).
#
# `sourceRef.generatorRef` is the ESO mechanism for "the value
# is produced by a generator, not pulled from a SecretStore." The
# `dataFrom` block invokes the generator and merges the returned
# map (`token`, `expiresAt`) into the target Secret. We use a
# `rewrite` regex to rename the generator's `token` field to
# `GITHUB_PERSONAL_ACCESS_TOKEN`, which is what the upstream
# binary reads.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-mcp-installation-token
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: installation-token
    agentoffice.ai/credential: github-installation-token
spec:
  refreshInterval: 30m
  target:
    name: github-mcp-installation-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      # Merge: keep the generator's GITHUB_PERSONAL_ACCESS_TOKEN and ADD
      # api_key beside it (Replace would drop the generated key).
      mergePolicy: Merge
      metadata:
        labels:
          app.kubernetes.io/managed-by: agent-office
          app.kubernetes.io/name: github-mcp-server
          app.kubernetes.io/component: installation-token
          # MCP gateway caller identity (gateway/callers-auth-policy.yaml):
          # every platform agent presents this token to the front door;
          # Authorino matches it against `api_key` below. "*" = every
          # registered server — the platform agents are one trust domain.
          agentoffice.ai/mcp-gateway-caller: "true"
          authorino.kuadrant.io/managed-by: authorino
        annotations:
          agentoffice.ai/mcp-caller: platform-agents
          agentoffice.ai/mcp-servers: "*"
      data:
        api_key: "{{ .GITHUB_PERSONAL_ACCESS_TOKEN }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-mcp-installation-token
      rewrite:
        - regexp:
            source: "^token$"
            target: "GITHUB_PERSONAL_ACCESS_TOKEN"
