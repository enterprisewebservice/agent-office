# The OBC's credentials are generated at runtime, so a small Job (plain UBI9 +
# the cluster's own oc, never an external CLI image) copies them into the Secret
# shape the Loki Operator expects (access_key_id, access_key_secret,
# bucketnames, endpoint). Re-runnable; Argo re-creates it on each sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-bucket-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-bucket-secret
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-bucket-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-bucket-secret
subjects:
  - kind: ServiceAccount
    name: loki-bucket-secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-bucket-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: loki-bucket-secret
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: registry.access.redhat.com/ubi9/ubi:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              curl -sL http://downloads.openshift-console.svc.cluster.local:80/amd64/linux/oc.tar -o /tmp/oc.tar
              tar -x -C /tmp -f /tmp/oc.tar oc
              OC=/tmp/oc
              for i in $(seq 1 60); do
                if $OC get secret loki-bucket >/dev/null 2>&1 && $OC get configmap loki-bucket >/dev/null 2>&1; then break; fi
                echo "waiting for the ObjectBucketClaim to be bound ($i)"; sleep 10
              done
              AK=$($OC get secret loki-bucket -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              SK=$($OC get secret loki-bucket -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
              BUCKET=$($OC get configmap loki-bucket -o jsonpath='{.data.BUCKET_NAME}')
              $OC create secret generic logging-loki-s3 \
                --from-literal=access_key_id="$AK" \
                --from-literal=access_key_secret="$SK" \
                --from-literal=bucketnames="$BUCKET" \
                --from-literal=endpoint="https://s3.openshift-storage.svc:443" \
                --dry-run=client -o yaml | $OC apply -f -
              echo "logging-loki-s3 written for bucket $BUCKET"
