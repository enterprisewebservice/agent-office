# Application logs from the demo namespaces only. The whole cluster's application
# logs OOM-killed the collectors and swamped a demo-size Loki (1,200 pods); widen
# the includes list, the collector memory and the LokiStack size together.
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: collector
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceAccount:
    name: collector
  collector:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
  inputs:
    # only the namespaces the demo reads; the whole cluster's application logs
    # OOM-killed the collectors and swamped a demo-size Loki
    - name: demo-namespaces
      type: application
      application:
        includes:
          - namespace: api-demo
          - namespace: kuadrant-system
          - namespace: istio-system
          - namespace: observability
          - namespace: agent-office
          - namespace: bestbuy-demo
  outputs:
    - name: default-lokistack
      type: lokiStack
      lokiStack:
        target:
          name: logging-loki
          namespace: openshift-logging
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          key: service-ca.crt
          configMapName: openshift-service-ca.crt
  pipelines:
    - name: application-logs
      inputRefs: [demo-namespaces]
      outputRefs: [default-lokistack]
