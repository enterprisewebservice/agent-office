# Application logs for the demo, scoped to the containers the demo reads. A
# collector that starts without a checkpoint replays the whole history of
# whatever it includes; with entire namespaces included that was 190,000 lines
# of agent chatter on one node, which Loki rejected (too old, then rate limited)
# while the unacknowledged backlog sat in the collector until it was OOM-killed,
# and the next start began from zero again (1 Oct 2026, three of eight nodes).
# Loki is for the demo's signals, not for history: include containers, not
# namespaces, and widen this list, the collector memory and the LokiStack size
# together.
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: collector
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceAccount:
    name: collector
  collector:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
  inputs:
    - name: demo-namespaces
      type: application
      application:
        # Loki is for the demo's signals, not for history: a container that
        # produces (or replays) more than this is dropped above the ceiling at
        # the collector, so a start without a checkpoint can never pile up a
        # backlog. The gateway logs one line per request; Developer Hub about
        # ten a second at its busiest.
        tuning:
          rateLimitPerContainer:
            maxRecordsPerSecond: 200
        includes:
          # the shared API gateway's JSON access log: consumer identity, plan,
          # response code, request id, trace id on every request (cluster/service-mesh)
          - namespace: api-demo
            container: istio-proxy
          # the demo APIs' own output: inventory, orders, and every API the
          # Governed REST API template creates (namespaces api-<name>)
          - namespace: api-demo
          - namespace: "api-*"
          # policy decisions: Authorino (authentication), Limitador (plans),
          # the developer-portal controller (key requests and approvals)
          - namespace: kuadrant-system
            container: authorino
          - namespace: kuadrant-system
            container: limitador
          - namespace: kuadrant-system
            container: manager
          # Developer Hub's audit events: template runs, catalog and RBAC
          # changes, each with the actor
          - namespace: rhdh-test
            container: backstage-backend
          # the MCP gateway's data plane (agents' tool calls), not the agents
          - namespace: agent-office
            container: istio-proxy
  outputs:
    - name: default-lokistack
      type: lokiStack
      lokiStack:
        target:
          name: logging-loki
          namespace: openshift-logging
        authentication:
          token:
            from: serviceAccount
        tuning:
          # smaller writes, shorter retries: a rejected batch is dropped after
          # a minute instead of held in memory
          maxWrite: 1Mi
          minRetryDuration: 1
          maxRetryDuration: 60
      tls:
        ca:
          key: service-ca.crt
          configMapName: openshift-service-ca.crt
  pipelines:
    - name: application-logs
      inputRefs: [demo-namespaces]
      outputRefs: [default-lokistack]
