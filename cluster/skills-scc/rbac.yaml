# Grant `use` of the agent-office-imagevol SCC to the agent-office
# default ServiceAccount (the SA the operator's gateway pods run as).
# Without this, gateway pods that mount the skills image volume are
# rejected by restricted-v2 ("image volumes are not allowed").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: use-agent-office-imagevol-scc
  labels:
    app.kubernetes.io/managed-by: agent-office
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["agent-office-imagevol"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-office-imagevol-default-sa
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: use-agent-office-imagevol-scc
subjects:
  - kind: ServiceAccount
    name: default
    namespace: agent-office
