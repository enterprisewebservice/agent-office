# ClusterSecretStore — global ESO config that says "to fetch a
# secret from Vault, use this address + this auth method."
# ExternalSecret CRs in any namespace reference this by name.
#
# Auth: Kubernetes auth method (vault token derived from a SA
# JWT). Each consuming namespace's SA presents its JWT to Vault;
# Vault validates via the kube TokenReview API and issues a
# scoped Vault token tied to a policy.
#
# This pairs with:
#  - kubernetes-auth-config-job.yaml — bootstrap Job that enables
#    Vault's kubernetes auth backend + writes the policy and role.
#  - external-secrets SA in each consuming namespace must be bound
#    to the role we create.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "agent-office"     # KV v2 mount path (set up by bootstrap)
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            # ESO 0.11 names its data-plane controller SA based on
            # the OperatorConfig CR's name (`cluster`) — so the actual
            # SA is `cluster-external-secrets`, NOT `external-secrets`.
            # The Vault auth/kubernetes role is bound to this SA name.
            name: cluster-external-secrets
            namespace: external-secrets
