apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater-config
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/enterprisewebservice/agent-office.git
    targetRevision: main
    path: cluster/imageupdater
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ServerSideApply so we co-own the ConfigMap with the OpenShift GitOps
    # operator (it owns the metadata + ownerReference; we own the data block).
    syncOptions:
      - ServerSideApply=true
