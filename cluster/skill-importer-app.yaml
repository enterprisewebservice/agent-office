# ArgoCD Application — manages cluster/skill-importer/ from gitops.
#
# Scope: the Tekton Pipeline resource (and any future sibling pipelines for
# anthropic-skills, community-skills, etc.). Does NOT manage the
# quay-push-secret (created out-of-band, see README) or PipelineRuns
# (created per-import via `oc create`).
#
# Part of v1.6.0 — the skill-catalog importer that pulls SKILL.md-format
# skills from upstream repos and pushes them to Quay as OCI artifacts for
# the operator's /catalog/skills endpoint to surface.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-office-skill-importer
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/enterprisewebservice/agent-office.git
    targetRevision: HEAD
    path: cluster/skill-importer
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-office
  syncPolicy:
    automated:
      prune: true   # safe to prune — only the Pipeline is in scope
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # agent-office already exists
