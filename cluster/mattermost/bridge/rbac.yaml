# The mm-bridge ServiceAccount drives openclaw agents via `oc exec` into
# their gateway pods, so it needs pods/exec + read on pods/AgentWorkstations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mm-bridge
  namespace: agent-office
  labels: { app.kubernetes.io/part-of: agent-office }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mm-bridge
  namespace: agent-office
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [agentoffice.ai]
    resources: [agentworkstations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mm-bridge
  namespace: agent-office
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mm-bridge
subjects:
  - kind: ServiceAccount
    name: mm-bridge
    namespace: agent-office
