apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: agent-office-operator-catalog
  namespace: openshift-marketplace
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  sourceType: grpc
  # Tile metadata for Ecosystem Software Catalog / OperatorHub.
  displayName: Agent Office Operator
  publisher: Red Hat Solution Architecture
  description: >-
    OLM-managed operator for the Governed Agent Platform on OpenShift.
    Owns the AgentWorkstation and MemoryModule CRDs and ships a
    ConsolePlugin that adds Memory Module / Agent Workstation tabs to
    the operator CSV detail page in OpenShift Console.
  # Stable v0.0.1 tag — OLM's registryPoll below detects digest changes
  # behind this tag every 5 minutes, so subsequent operator-catalog
  # pipeline runs flow through to a fresh tile without manual GitOps
  # edits or Image Updater wiring.
  image: quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-operator-catalog:v0.3.0
  # Pull secret for the cluster's internal Quay (already exists in
  # openshift-marketplace; created when the cluster was bootstrapped).
  # OLM links this to the auto-created CatalogSource ServiceAccount.
  secrets:
    - quay-pull-secret
  updateStrategy:
    registryPoll:
      interval: 5m
  grpcPodConfig:
    securityContextConfig: restricted
