---
# Pre-create the per-CatalogSource ServiceAccount that OLM auto-makes,
# but with imagePullSecrets already wired to the cluster's internal Quay.
# When OLM reconciles its own SA with the same name, it adds an
# ownerReference but leaves imagePullSecrets alone (different field
# manager under ServerSideApply), so the catalog pod can pull from
# private cluster Quay without manual `oc patch`.
#
# This is slice 2's declarative replacement for the one-shot
# `oc patch sa agent-office-operator-catalog ...` we ran by hand in
# slice 1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-office-operator-catalog
  namespace: openshift-marketplace
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
    olm.managed: "true"
imagePullSecrets:
  - name: quay-pull-secret
