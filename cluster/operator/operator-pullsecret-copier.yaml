---
# Copies the existing quay-pull-secret from agent-office to
# agent-office-operator so the operator's controller-manager pod can
# pull from cluster Quay (private). The Secret content is NEVER stored
# in git — the Job reads the live secret in-cluster and writes it to
# the operator's namespace.
#
# This is a slice-2 stop-gap. The proper fix is ExternalSecrets +
# Vault (or adding cluster Quay creds to the cluster's global
# pull-secret). Both are tracked separately in the platform punch list.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-pull-secret-copier
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-pull-secret-copier-source
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["quay-pull-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-pull-secret-copier-source
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-pull-secret-copier-source
subjects:
  - kind: ServiceAccount
    name: quay-pull-secret-copier
    namespace: agent-office-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-pull-secret-copier-dest
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-pull-secret-copier-dest
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-pull-secret-copier-dest
subjects:
  - kind: ServiceAccount
    name: quay-pull-secret-copier
    namespace: agent-office-operator
---
# CronJob (every hour) keeps the destination secret in sync with the
# source so a credential rotation in agent-office propagates without
# manual intervention. The first run is triggered by ArgoCD's
# selector below (PreSync hook would be ideal but ArgoCD doesn't honour
# hooks on CronJob; instead the Job's image is small and fast enough to
# poll).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quay-pull-secret-copier
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  schedule: "@hourly"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: quay-pull-secret-copier
          containers:
            - name: oc
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  oc -n agent-office get secret quay-pull-secret -o json \
                    | jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields,.metadata.ownerReferences) | .metadata.namespace="agent-office-operator"' \
                    | oc apply -f -
                  echo "synced quay-pull-secret to agent-office-operator"
---
# One-shot Job that runs immediately on first apply (CronJob's first
# run waits up to an hour). After this completes the CronJob handles
# subsequent rotations.
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-pull-secret-copier-bootstrap
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: quay-pull-secret-copier
      containers:
        - name: oc
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              oc -n agent-office get secret quay-pull-secret -o json \
                | jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields,.metadata.ownerReferences) | .metadata.namespace="agent-office-operator"' \
                | oc apply -f -
              echo "bootstrap synced quay-pull-secret to agent-office-operator"
