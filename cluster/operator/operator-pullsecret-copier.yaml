---
# Copies the existing quay-pull-secret from agent-office to
# agent-office-operator so the operator's controller-manager pod can
# pull from cluster Quay (private). The Secret content is NEVER stored
# in git — the Job reads the live secret in-cluster and writes it to
# the operator's namespace.
#
# Slice-2 stop-gap. The proper fix is ExternalSecrets + Vault (or
# adding cluster Quay creds to the cluster's global pull-secret).
#
# Sync ordering (ArgoCD sync-waves):
#   wave="-2": SA + per-namespace Roles + RoleBindings
#   wave="-1": bootstrap Job (waits for Completed before next wave)
#   wave="0":  everything else (Subscription, OperatorGroup, ...)
#
# Without this ordering the Subscription kicks off OLM, the operator
# pod ImagePullBackOffs because no pull secret exists yet, the
# Subscription never reaches Healthy, ArgoCD's "wait for Healthy"
# blocks forever, and the Job that would have copied the secret
# is stuck behind that wait — circular.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-pull-secret-copier
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-pull-secret-copier-source
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["quay-pull-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-pull-secret-copier-source
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-pull-secret-copier-source
subjects:
  - kind: ServiceAccount
    name: quay-pull-secret-copier
    namespace: agent-office-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-pull-secret-copier-dest
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-pull-secret-copier-dest
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-pull-secret-copier-dest
subjects:
  - kind: ServiceAccount
    name: quay-pull-secret-copier
    namespace: agent-office-operator
---
# CronJob (every hour) keeps the destination secret in sync with the
# source so a credential rotation in agent-office propagates without
# manual intervention.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quay-pull-secret-copier
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: "@hourly"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: quay-pull-secret-copier
          containers:
            - name: oc
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  # ose-cli doesn't ship jq; do the namespace swap with
                  # oc + here-doc instead so we have no extra deps.
                  DATA=$(oc -n agent-office get secret quay-pull-secret -o jsonpath='{.data.\.dockerconfigjson}')
                  cat <<EOF | oc -n agent-office-operator apply -f -
                  apiVersion: v1
                  kind: Secret
                  type: kubernetes.io/dockerconfigjson
                  metadata:
                    name: quay-pull-secret
                    labels:
                      app.kubernetes.io/managed-by: agent-office-gitops
                  data:
                    .dockerconfigjson: $DATA
                  EOF
                  echo "synced quay-pull-secret to agent-office-operator"
---
# Bootstrap Job — runs once before everything else (sync-wave -1)
# so the destination Secret exists by the time OLM starts the
# operator pod (sync-wave 0).
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-pull-secret-copier-bootstrap
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Hook + Replace makes ArgoCD recreate the Job on each sync (Jobs
    # are immutable once created). Skip when the destination Secret
    # already exists by checking inside the Job script.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: quay-pull-secret-copier
      containers:
        - name: oc
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              if oc -n agent-office-operator get secret quay-pull-secret >/dev/null 2>&1; then
                echo "destination secret already exists, nothing to do"
                exit 0
              fi
              DATA=$(oc -n agent-office get secret quay-pull-secret -o jsonpath='{.data.\.dockerconfigjson}')
              cat <<EOF | oc -n agent-office-operator apply -f -
              apiVersion: v1
              kind: Secret
              type: kubernetes.io/dockerconfigjson
              metadata:
                name: quay-pull-secret
                labels:
                  app.kubernetes.io/managed-by: agent-office-gitops
              data:
                .dockerconfigjson: $DATA
              EOF
              echo "bootstrap synced quay-pull-secret to agent-office-operator"
