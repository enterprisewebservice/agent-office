---
# Namespace for the operator's controller pod. CRs (AgentWorkstation,
# MemoryModule, AgentGateway) can live in ANY namespace — the operator
# is installed in AllNamespaces mode below.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
    app.kubernetes.io/part-of: agent-office
---
# OperatorGroup with AllNamespaces install mode (omit
# spec.targetNamespaces). The operator runs once in
# agent-office-operator and watches every namespace on the cluster.
# OLM copies the CSV into every namespace, so the operator tile
# shows up under "Installed Operators" everywhere — same UX as the
# Keycloak / Cert-Manager / Tekton operators. The CSV-detail tabs
# (Agent Workstations, Memory Modules, Agent Gateways) then list
# instances cluster-wide instead of being scoped to a single ns.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: agent-office-operator
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec: {}
