---
# OLM Subscription — installs the operator from the in-cluster catalog
# automatically, picks up new digests behind :v0.0.1 via registryPoll on
# the CatalogSource without manual installPlan approval.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: agent-office-operator
  namespace: agent-office-operator
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  channel: alpha
  name: agent-office-operator
  source: agent-office-operator-catalog
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  config:
    env:
      # Federate the mindifact registry into /catalog/packs so the Dev Hub
      # composer can find packs that are NOT yet installed on this cluster
      # — the whole point of a registry. Unset this and federation is off;
      # the local catalog is unaffected either way.
      - name: AGENT_REGISTRY_URLS
        value: https://mindifact.ai/v1/index.json
      # Recommend with a REAL model, on the ChatGPT/Codex subscription.
      # No API key: the operator execs a bounded `openclaw agent` turn in
      # the gateway pod, which already holds the OAuth session every agent
      # here uses. Keyword scoring stays as the fallback when the gateway
      # is unreachable.
      - name: AGENT_RECOMMENDER_GATEWAY
        value: research-gateway
      - name: AGENT_RECOMMENDER_AGENT
        value: web-browser-researcher
      - name: AGENT_RECOMMENDER_MODEL
        value: openai/gpt-5.6-sol
