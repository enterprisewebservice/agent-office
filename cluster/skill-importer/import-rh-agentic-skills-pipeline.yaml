# Tekton Pipeline — import-rh-agentic-skills
#
# Clones a remote skills repo (default: openshift/agentic-skills), enumerates
# the folders that contain a SKILL.md file, and for each one runs:
#   skillctl build <skill-dir>
#   skillctl push  <quay-ref>
#
# Skills land in Quay as OCI artifacts following the skillimage.dev standard
# (the same standard Red Hat is shipping their official agentic skills under).
# Each pushed image carries OCI annotations identifying its source repo +
# revision so the operator's /catalog/skills endpoint can filter / surface
# provenance later.
#
# This is part of v1.6.0 #2 — see CLAUDE-NOTES or the project task list for
# the full architecture. Pairs with:
#   - import-anthropic-skills-pipeline.yaml (sibling, same shape, different source)
#   - operator's /catalog/skills endpoint (reads Quay manifests, exposes for
#     binders plugin + MCP discovery server)
#
# Manual trigger:
#   oc create -f cluster/skill-importer/manual-pipelinerun.yaml
#
# Scheduled trigger (future): wrap with an EventListener + Trigger, or a
# k8s CronJob that templates a PipelineRun.
#
# Prereqs in the cluster (one-time, see README in this directory):
#   - openshift-pipelines operator installed (Tekton + ClusterTasks)
#   - quay-push-secret in the agent-office namespace (docker-config JSON
#     with credentials to push to the destination Quay namespace)
#   - the skillctl image (ghcr.io/redhat-et/skillctl) reachable from the
#     cluster (it's a public ghcr image — should be reachable by default)
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: import-rh-agentic-skills
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/purpose: skill-catalog-importer
spec:
  description: >-
    Clone a SKILL.md-format source repo, build each skill folder into an
    OCI artifact via skillctl, push to the destination Quay namespace
    with provenance annotations.
  params:
    - name: source-repo-url
      type: string
      default: https://github.com/openshift/agentic-skills.git
      description: HTTPS URL of the source skills repo to clone.
    - name: source-revision
      type: string
      default: main
      description: Branch, tag, or commit SHA to check out.
    - name: source-tier
      type: string
      default: rh-official
      description: >-
        Tier label applied as the agentoffice.ai/skill-tier OCI annotation
        on every pushed image. Lets the operator catalog filter by source
        provenance (rh-official | anthropic-official | community |
        customer-authored). The binders plugin / MCP discovery server can
        surface this on each catalog entry.
    - name: destination-quay-registry
      type: string
      default: quay-quay-quay-test.apps.salamander.aimlworkbench.com
      description: The Quay hostname to push imported skills to.
    - name: destination-quay-namespace
      type: string
      default: deanpeterson
      description: The Quay namespace/org under which skill images are pushed.
    - name: image-prefix
      type: string
      default: agent-office-skill-
      description: >-
        Per-image name prefix. Pushed image refs look like
        <registry>/<namespace>/<image-prefix><skill-name>:<tag>.
    - name: image-tag
      type: string
      default: latest
      description: >-
        Tag applied to every pushed skill image. Use a date/sha-based tag in
        scheduled runs (e.g. "2026-05-28-d598d8f") and "latest" in manual
        ad-hoc runs.
  workspaces:
    - name: source
      description: >-
        Shared workspace — git-clone task drops the source repo here,
        build-and-push task reads from it.
    - name: quay-push-secret
      description: >-
        Mounted at /workspace/quay-push-secret as a docker config json,
        used by skillctl push for registry auth. Create once with:
          oc create secret docker-registry quay-push-secret \
            --docker-server=quay-quay-quay-test.apps.salamander.aimlworkbench.com \
            --docker-username=<robot-or-user> \
            --docker-password=<token> \
            -n agent-office
  tasks:

    # ----------------------------------------------------------------
    # 1. Clone the source skills repo into the shared workspace.
    # ----------------------------------------------------------------
    - name: clone-source
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.source-repo-url)
        - name: revision
          value: $(params.source-revision)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: source

    # ----------------------------------------------------------------
    # 2. Enumerate skill folders, build + push each via skillctl.
    #
    # Inline taskSpec so the whole pipeline lives in one file. The
    # script:
    #   a) finds every directory under the cloned repo that contains
    #      a SKILL.md file
    #   b) for each found skill, runs `skillctl build <dir>` and
    #      `skillctl push <quay-ref>` with provenance annotations
    #   c) emits a summary at the end (count of pushed skills + their
    #      refs) for the PipelineRun's results
    # ----------------------------------------------------------------
    - name: build-and-push-skills
      runAfter: [clone-source]
      params:
        - name: source-tier
          value: $(params.source-tier)
        - name: source-repo-url
          value: $(params.source-repo-url)
        - name: source-revision
          value: $(params.source-revision)
        - name: destination-quay-registry
          value: $(params.destination-quay-registry)
        - name: destination-quay-namespace
          value: $(params.destination-quay-namespace)
        - name: image-prefix
          value: $(params.image-prefix)
        - name: image-tag
          value: $(params.image-tag)
      workspaces:
        - name: source
          workspace: source
        - name: quay-push-secret
          workspace: quay-push-secret
      taskSpec:
        params:
          - name: source-tier
            type: string
          - name: source-repo-url
            type: string
          - name: source-revision
            type: string
          - name: destination-quay-registry
            type: string
          - name: destination-quay-namespace
            type: string
          - name: image-prefix
            type: string
          - name: image-tag
            type: string
        workspaces:
          - name: source
            description: cloned source skills repo
          - name: quay-push-secret
            description: docker config json for registry auth
        results:
          - name: pushed-count
            description: Number of skills successfully pushed
          - name: failed-count
            description: Number of skills that failed to build or push
        steps:
          - name: build-and-push
            image: ghcr.io/redhat-et/skillctl:latest
            env:
              # skillctl reads docker auth from the standard
              # DOCKER_CONFIG location. Point it at the mounted secret.
              - name: DOCKER_CONFIG
                value: /workspace/quay-push-secret
              - name: SOURCE_TIER
                value: $(params.source-tier)
              - name: SOURCE_REPO_URL
                value: $(params.source-repo-url)
              - name: SOURCE_REVISION
                value: $(params.source-revision)
              - name: DESTINATION_QUAY_REGISTRY
                value: $(params.destination-quay-registry)
              - name: DESTINATION_QUAY_NAMESPACE
                value: $(params.destination-quay-namespace)
              - name: IMAGE_PREFIX
                value: $(params.image-prefix)
              - name: IMAGE_TAG
                value: $(params.image-tag)
            script: |
              #!/usr/bin/env sh
              set -eu

              echo "=========================================================="
              echo "Importing skills"
              echo "  source-repo:     $SOURCE_REPO_URL @ $SOURCE_REVISION"
              echo "  destination:     $DESTINATION_QUAY_REGISTRY/$DESTINATION_QUAY_NAMESPACE/${IMAGE_PREFIX}<name>:$IMAGE_TAG"
              echo "  tier annotation: $SOURCE_TIER"
              echo "=========================================================="

              cd /workspace/source

              # Find every directory containing a SKILL.md file. The
              # openshift/agentic-skills layout puts skills directly at the
              # repo root (one folder per skill); other repos may nest under
              # skills/. We accept both via a recursive find.
              SKILL_DIRS="$(find . -name SKILL.md -not -path '*/node_modules/*' -not -path '*/.git/*' -exec dirname {} \; | sort -u)"

              if [ -z "$SKILL_DIRS" ]; then
                echo "No SKILL.md files found under $(pwd) — nothing to import."
                printf '0' | tee $(results.pushed-count.path) >/dev/null
                printf '0' | tee $(results.failed-count.path) >/dev/null
                exit 0
              fi

              pushed=0
              failed=0

              for skill_dir in $SKILL_DIRS; do
                # Skill name = the leaf folder name. SKILL.md frontmatter
                # has the canonical name field, but for the image tag the
                # folder name is reliable and matches the upstream
                # convention.
                skill_name="$(basename "$skill_dir")"
                image_ref="${DESTINATION_QUAY_REGISTRY}/${DESTINATION_QUAY_NAMESPACE}/${IMAGE_PREFIX}${skill_name}:${IMAGE_TAG}"

                echo ""
                echo "----------------------------------------------------------"
                echo "Skill: $skill_name"
                echo "  dir: $skill_dir"
                echo "  ref: $image_ref"
                echo "----------------------------------------------------------"

                # skillctl build packages the skill folder into an OCI
                # artifact in the local store. skillctl push uploads to
                # the destination registry with provenance annotations.
                if ! skillctl build "$skill_dir"; then
                  echo "  ✗ skillctl build failed for $skill_name"
                  failed=$((failed + 1))
                  continue
                fi

                # Push with annotations:
                #   agentoffice.ai/skill-tier — source provenance label
                #   agentoffice.ai/source-repo — origin repo URL
                #   agentoffice.ai/source-revision — commit SHA/branch
                # Operator's catalog endpoint will read these from the OCI
                # manifest to filter and display in the binders plugin.
                if ! skillctl push "$image_ref" \
                    --annotation "agentoffice.ai/skill-tier=$SOURCE_TIER" \
                    --annotation "agentoffice.ai/source-repo=$SOURCE_REPO_URL" \
                    --annotation "agentoffice.ai/source-revision=$SOURCE_REVISION" \
                    --annotation "agentoffice.ai/imported-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; then
                  echo "  ✗ skillctl push failed for $skill_name"
                  failed=$((failed + 1))
                  continue
                fi

                echo "  ✓ pushed $image_ref"
                pushed=$((pushed + 1))
              done

              echo ""
              echo "=========================================================="
              echo "Import complete"
              echo "  pushed: $pushed"
              echo "  failed: $failed"
              echo "=========================================================="

              printf '%s' "$pushed" | tee $(results.pushed-count.path) >/dev/null
              printf '%s' "$failed" | tee $(results.failed-count.path) >/dev/null

              # Exit non-zero if any skill failed so the PipelineRun is
              # marked Failed and ops can investigate.
              if [ "$failed" -gt 0 ]; then
                exit 1
              fi
  results:
    - name: pushed-count
      description: Number of skills successfully pushed
      value: $(tasks.build-and-push-skills.results.pushed-count)
    - name: failed-count
      description: Number of skills that failed to build or push
      value: $(tasks.build-and-push-skills.results.failed-count)
