# Skill importer pipeline + supporting resources.
#
# Managed by the cluster/skill-importer-app.yaml ArgoCD Application —
# add new pipelines (anthropic-skills importer, etc.) by listing them
# below.
#
# Manual PipelineRuns are NOT listed here (they're throwaway, one per
# import). To trigger a run:
#   oc create -n agent-office -f cluster/skill-importer/manual-pipelinerun.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-office

resources:
  - import-rh-agentic-skills-pipeline.yaml
  # Future:
  # - import-anthropic-skills-pipeline.yaml
  # - import-community-skills-pipeline.yaml
