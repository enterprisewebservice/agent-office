# Manual PipelineRun for import-rh-agentic-skills.
#
# Run with:
#   oc create -n agent-office -f cluster/skill-importer/manual-pipelinerun.yaml
#
# Each `oc create` produces a fresh PipelineRun (PipelineRuns are
# immutable). The generateName suffix appears in `oc get pipelinerun`
# output so multiple runs don't collide.
#
# For scheduled imports later, wrap this in a k8s CronJob that templates
# the PipelineRun spec — same shape, different trigger.
#
# To import a DIFFERENT source repo, copy this file and override params:
#   source-repo-url: https://github.com/anthropics/skills.git
#   source-tier:     anthropic-official
# (And keep this one as the rh-official importer.)
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: import-rh-agentic-skills-
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/purpose: skill-catalog-importer
    agentoffice.ai/source-tier: rh-official
spec:
  pipelineRef:
    name: import-rh-agentic-skills
  params:
    - name: source-repo-url
      value: https://github.com/openshift/agentic-skills.git
    - name: source-revision
      value: main
    - name: source-tier
      value: rh-official
    # Defaults for destination and image naming come from the Pipeline
    # spec. Override here per-run if needed (e.g. to push to a staging
    # Quay namespace before promoting).
  workspaces:
    - name: source
      # Emptyvolume — a fresh checkout per run. ~50MB for typical
      # skill repos; 1Gi is plenty.
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: quay-push-secret
      secret:
        # See README.md in this directory for one-time secret setup.
        secretName: quay-push-secret
