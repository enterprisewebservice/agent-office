# Granite Guardian 3.2 5B on the free RTX 3090 Ti (ec-0d-9a-89-19-46), served
# by Red Hat's vLLM image: bf16, short context (a chat message plus the
# guardian prompt), the whole card. Raw deployment (the cluster's KServe mode).
# Swap the model by re-running jobs/download-granite-guardian.yaml with another
# MODEL and pointing storageUri at its directory.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-guardian
  namespace: guardrails
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/managed-by: agent-office-gitops
  annotations:
    openshift.io/display-name: "Granite Guardian 3.2 5B (content detector)"
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    # one GPU on the node: a rolling update can never schedule the new pod
    # beside the old one, so replace instead of surge.
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      kubernetes.io/hostname: ec-0d-9a-89-19-46
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-cuda-runtime
      storageUri: pvc://guardian-models/granite-guardian-3.2-5b
      args:
        - --dtype=bfloat16
        - --max-model-len=4096
        - --gpu-memory-utilization=0.85
        - --max-num-seqs=32
        - --enable-chunked-prefill
      resources:
        requests:
          cpu: "2"
          memory: 12Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
