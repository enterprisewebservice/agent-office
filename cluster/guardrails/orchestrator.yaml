apiVersion: trustyai.opendatahub.io/v1alpha1
kind: GuardrailsOrchestrator
metadata:
  name: guardrails
  namespace: guardrails
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  orchestratorConfig: fms-orchestr8-config-nlp
  enableBuiltInDetectors: true      # regex/PII detector sidecar (detector id "regex")
  enableGuardrailsGateway: true     # sidecar: /all/v1/chat/completions with input+output detection
  guardrailsGatewayConfig: fms-orchestr8-config-gateway
  replicas: 1
