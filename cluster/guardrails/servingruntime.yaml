# Red Hat's vLLM runtime (the object the dashboard template "vLLM NVIDIA GPU
# ServingRuntime for KServe" renders in OpenShift AI 3.4.4). Serves Granite
# Guardian as an OpenAI-compatible model on :8080; guardian-detector (see
# detector-shim.yaml) turns that into the Detector API the orchestrator
# expects, seven risks in parallel instead of one after another.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cuda-runtime
  namespace: guardrails
  annotations:
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime for KServe
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:dd65c7ed88a9369b962f1299ed19c6c8819ff0a64595c10e32f1e82ab0750e27
      command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
