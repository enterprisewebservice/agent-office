# FMS Guardrails Orchestrator config. One detector today (Granite Guardian on
# the GPU behind the guardian-detector shim); the built-in regex/PII detector is enabled on the CR and reachable
# as detector id "regex" if a caller asks for it. `openai` points at the
# cluster's LiteLLM front door (model-desk) so the orchestrator's
# /api/v2/chat/completions-detection can also front the metered brains later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fms-orchestr8-config-nlp
  namespace: guardrails
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
data:
  config.yaml: |
    # the client's bearer (each seat gateway carries the model-desk key) travels
    # through to LiteLLM; the orchestrator never holds a model credential itself
    passthrough_headers:
      - authorization
      - Authorization
    openai:
      service:
        # frontdoor-proxy answers /tokenize (which LiteLLM lacks) and streams the rest to LiteLLM
        hostname: frontdoor-proxy.guardrails.svc.cluster.local
        port: 8000
    detectors:
      granite-guardian:
        type: text_contents
        service:
          hostname: guardian-detector.guardrails.svc.cluster.local
          port: 8000
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
