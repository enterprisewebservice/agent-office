# The guardrails gateway (sidecar in the orchestrator pod, Red Hat image): a
# drop-in OpenAI /v1/chat/completions per route. Seat brains point their
# baseUrl at /all/v1: every request is screened on input and output by the
# Granite Guardian detector (per-risk policy in the shim), then generated by
# the LiteLLM front door via the orchestrator. /passthrough/v1 exists for
# platform admins who need to bypass (nothing points at it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fms-orchestr8-config-gateway
  namespace: guardrails
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
data:
  config.yaml: |
    orchestrator:
      host: "localhost"
      port: 8032
    detectors:
      - name: granite-guardian
        input: true
        output: true
        detector_params: {}
    routes:
      - name: all
        detectors:
          - granite-guardian
        fallback_message: "I can't help with that. The platform's content guardrail flagged it, so it was not sent to the model. This workshop is for building and running agents; a person reviews flagged messages."
      - name: passthrough
        detectors: []
