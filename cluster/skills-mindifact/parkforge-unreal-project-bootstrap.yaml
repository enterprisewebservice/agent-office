      \ Read the current stroke count **k** from the\n   stroke-listing verb (`list_strokes`) \u2014 the\
      \ prediction and step 6's\n   return-to-baseline check both compare against a measured k, never\
      \ a\n   remembered one.\n3. Write the prediction DOWN, in the transcript, before the call:\n\n \
      \      PREDICTION: raise_here(x=<ax>, y=<ay>, radius=400, height=60)\n       expect: 1 new stroke\
      \ id; height at anchor h0+60 = <number>,\n               within \xB1(z_scale/128) = \xB10.78125;\
      \ delta_grid_max 60\n               within the same quantization; stroke count <k>+1.\n\n   (radius\
      \ 400 / height +60 is the pinch row from terrain-strokes \u2014 small on\n   purpose.)\n4. Make\
