      \ the prediction block and the measured block, side by side,\nin the transcript, plus the removal\
      \ numbers.\n\n## The failure catechism\n\n- **Every rail names its verification; a rail whose verification\
      \ is not in\n  the transcript did not happen.** No rail may be skipped silently \u2014\n  skipping\
      \ is a decision the user makes, out loud, and the skipped rail's\n  name goes in the final report.\n\
      - **An install under a running editor looks clean and is broken.**\n  Registration happens at editor\
      \ start; the `.uproject` surgery loses to the\n  editor's own save. Rail 1 exists because the failure\
      \ gives no error.\n- **\"numpy is on the machine\" is the wrong interpreter.** The engine embeds\n\
      \  its own Python; only rail 3's readback proves anything.\n- **FILL_ME is not a default, it is\
      \ a landmine \u2014 and the parenthetical is\n  documentation, not a value.** Copying the reference\
      \ park's numbers out of\n  the FILL_ME text without measuring is exactly the failure the template's\n\
      \  design forbids. The harness's `profile-filled` gate exists so a\n  half-filled profile can never\
      \ reach a live editor unnoticed.\n- **The landscape step is manual because it is unproven, not because\
      \ manual\n  is fine.** Improvising scripted creation in a user's project is how\n  startup maps\
      \ get bricked. Factory brief, or the recipe \u2014 nothing else.\n- **Origins are measured, never\
      \ assumed.** The original park's constants\n  were measured from the actor (T5); a new world's are\
      \ too. An assumed\n  corner is a guessed coordinate.\n- **Patch the canon, never the artifact.**\
      \ The brain lives in the meshforge\n  repo; `Content/Python` is what the installer wrote. A fix\
      \ in the artifact\n  dies at the next install.\n- **Never edit `Saved/ParkForge/` by hand.** Operational\
      \ state belongs to\n  the toolsets; the versioned record is `ParkForgeData/`.\n- **One editor, one\
      \ world, one profile.** The loader's default path is the\n  reference park's; any other world pins\
      \ `PARKFORGE_PROFILE` in the launch\n  environment or its verbs read the wrong world's constants\
      \ and mutate the\n  wrong project's state store.\n- **The first launch is for the recipe; the definitive\
      \ launch comes after\n  the profile.** The loader refuses a FILL_ME origin at import, taking the\n\
      \  whole parkforge registration with it, and toolsets register only at\n  editor start \u2014 so\
      \ parkforge verbs are structurally absent until an editor\n  starts against the completed profile.\
      \ Plan the restart; announce it.\n- **The smoke stroke never stays.** A bootstrap that leaves a\
      \ test bump in\n  the world has failed rail 8, however good its numbers were.\n\n## Hard limits\
      \ \u2014 do not attempt, regardless of who asks\n\n- **No scripted Landscape creation.** Not proven\
