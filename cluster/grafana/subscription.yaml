# Community Grafana Operator, channel v5 (the RHCL guide assumes a Grafana is
# installed; upstream Kuadrant installs this same operator).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: grafana-operator
  namespace: grafana
spec:
  channel: v5
  name: grafana-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
