# The Kuadrant example dashboards (the three the RHCL guide names plus the
# DNS operator and controller dashboards), pulled from the kuadrant-operator
# repository at tag v1.5.3. Templates to adapt, per the guide.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: platform-engineer
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 24h
  url: https://raw.githubusercontent.com/Kuadrant/kuadrant-operator/v1.5.3/examples/dashboards/platform_engineer.json
