# genesis-train Skill — lets an agent (e.g. genesis-worker) TRAIN the Genesis
# first-principles model on OpenShift AI and report whether it learned.
#
# The model + pipeline are pre-registered on the agent-office DSPA as
# "genesis-model" (linear regression by hand-written gradient descent — see
# integration-tests/genesis-demo/pipeline/pipeline.py and the
# genesis-first-principles KB). This skill just submits a RUN against it and
# polls. The actual training runs as Argo-orchestrated pods the DSPA launches
# (generate_data → train_gd → evaluate); evaluate HARD-FAILS unless the model
# recovers the truth (w≈2, b≈1), so a SUCCEEDED run provably means "it learned."
#
# Delivered as an exec skill: the agent runs the embedded script using the
# gateway pod's ServiceAccount token. The Role/RoleBinding below authorize that
# SA against the DSP API's oauth-proxy (it SARs `get` on the DSPA /api
# subresource). Apply: oc apply -f cluster/skills/genesis-train.yaml
apiVersion: agentoffice.ai/v1alpha1
kind: Skill
metadata:
  name: genesis-train
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/skill-family: genesis
spec:
  displayName: Train the Genesis Model
  description: Train the Genesis first-principles predictive model on OpenShift AI (Data Science Pipelines) and report whether it recovered the true parameters.
  version: v1
  invocation:
    tool: exec
  requires:
    - exec
  source:
    inline: |
      Use this skill when asked to **train the Genesis model**, **build/train the
      predictive model**, or **run the first-principles model on OpenShift AI**.

      It trains `genesis-model` — linear regression `ŷ = w·x + b` learned by
      hand-written gradient descent — on the OpenShift AI Data Science Pipelines
      server (DSPA). The pipeline is already registered; you just submit a run
      and wait. Training runs as Argo pods the DSPA launches; the run only
      SUCCEEDS if the model recovers the universe's true parameters (w≈2, b≈1),
      so **SUCCEEDED ⇒ it learned**.

      ## How to run it
      Save this script and run it with `bash`:

      ```bash
      set -euo pipefail
      DSP="https://ds-pipeline-dspa.agent-office.svc.cluster.local:8443"
      TOK=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      jf(){ python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('$1','') if isinstance(d,dict) else '')"; }
      api(){ local m="$1" p="$2" d="${3:-}" o c b
        local a=(-sk --connect-timeout 10 -H "Authorization: Bearer $TOK" -w $'\n%{http_code}')
        [ "$m" != GET ] && a+=(-X "$m"); [ -n "$d" ] && a+=(-H 'Content-Type: application/json' --data "$d")
        o=$(curl "${a[@]}" "$DSP$p"); c=${o##*$'\n'}; b=${o%$'\n'*}
        case "$c" in 2[0-9][0-9]) printf '%s' "$b";; *) echo "DSP $m $p -> HTTP $c: $(printf '%s' "$b"|head -c200)">&2; return 1;; esac; }

      PID=$(api GET "/apis/v2beta1/pipelines?page_size=200" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next((p["pipeline_id"] for p in d.get("pipelines",[]) if p.get("display_name")=="genesis-model"),""))')
      [ -n "$PID" ] || { echo "genesis-model pipeline is not registered on the DSPA"; exit 1; }
      EID=$(api GET "/apis/v2beta1/experiments?page_size=200" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next((e["experiment_id"] for e in d.get("experiments",[]) if e.get("display_name")=="genesis-model"),""))')
      [ -n "$EID" ] || EID=$(api POST "/apis/v2beta1/experiments" '{"display_name":"genesis-model","description":"Genesis first-principles model runs"}' | jf experiment_id)
      TS=$(date +%Y%m%d-%H%M%S)
      BODY=$(EID="$EID" PID="$PID" TS="$TS" python3 -c 'import os,json;print(json.dumps({"display_name":"genesis-train-"+os.environ["TS"],"experiment_id":os.environ["EID"],"pipeline_version_reference":{"pipeline_id":os.environ["PID"]},"runtime_config":{"parameters":{"n":200,"true_w":2.0,"true_b":1.0,"noise":0.5,"seed":7,"epochs":300,"lr":0.05}}}))')
      RID=$(api POST "/apis/v2beta1/runs" "$BODY" | jf run_id)
      [ -n "$RID" ] || { echo "could not submit run"; exit 1; }
      echo "submitted run genesis-train-$TS (id=$RID); training on the DSPA…"
      for i in $(seq 1 60); do
        ST=$(api GET "/apis/v2beta1/runs/$RID" | jf state); echo "  [$i] $ST"
        case "$ST" in
          SUCCEEDED) echo "RESULT: SUCCEEDED — the model LEARNED (recovered the true w≈2, b≈1 within tolerance)."; echo "View it: OpenShift AI → Experiments and runs → genesis-model → run genesis-train-$TS (loss curve + learned_w / learned_b / test_mse)."; exit 0;;
          FAILED|SKIPPED|CANCELED|ERROR) echo "RESULT: $ST — the model did NOT recover the truth (or the pipeline errored)."; exit 1;;
        esac
        sleep 12
      done
      echo "RESULT: timed out waiting for the run"; exit 1
      ```

      ## How to report back
      Tell the user plainly whether it **learned**: if the run SUCCEEDED, say the
      Genesis model trained on OpenShift AI and recovered the universe's true
      slope and intercept (w≈2, b≈1) from noisy data — that's gradient descent
      working. Give them the run name and point them to **Experiments and runs →
      genesis-model** in the OpenShift AI dashboard to see the loss fall and the
      learned_w / learned_b metrics. If it FAILED, say so and share the last state.
---
# Authorize the gateway pod's ServiceAccount (currently `default`) against the
# DSP API's oauth-proxy, which SARs `get` on the DSPA /api subresource.
# Reversible: delete this file's objects to revoke. (Hardening follow-up: give
# the gateway a dedicated SA instead of `default`.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: genesis-dsp-submit
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/skill-family: genesis
rules:
  # The DSP oauth-proxy SARs the HTTP method as a verb on the DSPA /api
  # subresource: GET→get, POST→create, etc. Submitting + polling a run needs
  # get (read pipelines/experiments/runs) + create (POST a run).
  - apiGroups: [datasciencepipelinesapplications.opendatahub.io]
    resources: [datasciencepipelinesapplications/api]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: genesis-dsp-submit
  namespace: agent-office
  labels:
    app.kubernetes.io/managed-by: agent-office
    agentoffice.ai/skill-family: genesis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: genesis-dsp-submit
subjects:
  - kind: ServiceAccount
    name: default
    namespace: agent-office
