apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secret-store
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Sync-wave 0: deploy AFTER ESO (sync-wave -1) and Vault
    # (sync-wave -1) are Ready. ClusterSecretStore CRD comes from
    # ESO; the auth-bootstrap Job pokes Vault — both must exist.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/enterprisewebservice/agent-office.git
    targetRevision: main
    path: cluster/vault-secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      # ESO CRD or Vault unseal not ready yet → retry with backoff
      # until both converge. Important on initial cluster bring-up.
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
