apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-office-integration-tests
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/enterprisewebservice/agent-office.git
    targetRevision: main
    # The Pipeline + beat Tasks + runner RBAC (kustomize). The per-run
    # PipelineRun under integration-tests/run/ is intentionally NOT here
    # — it's the on-demand trigger (`oc create -f .../run/pipelinerun.yaml`).
    path: integration-tests/pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-office
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
