# The backend's API key, mirrored ONE key at a time with External Secrets'
# kubernetes provider (same pattern as the hub's help-mail secret): nothing
# is typed by a human, nothing lives in git.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: runtab-backend-store
  labels:
    app.kubernetes.io/name: runtab-support-mcp
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  provider:
    kubernetes:
      remoteNamespace: claude-code-agent
      server:
        url: kubernetes.default
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: runtab-support-secret-reader }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: runtab-support-backend
  labels:
    app.kubernetes.io/name: runtab-support-mcp
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: SecretStore, name: runtab-backend-store }
  target:
    name: runtab-support-backend
    creationPolicy: Owner
  data:
    - secretKey: CCS_API_KEY
      remoteRef: { key: ccs-secrets, property: CCS_API_KEY }
