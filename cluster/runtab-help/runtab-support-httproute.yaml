# Attaches the tool server to the platform's MCP gateway (same shape as
# seat-triage / ops-metrics): the gateway stays the governance point, the
# route is this backend's declaration.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: runtab-support-mcp-route
  labels:
    app.kubernetes.io/name: runtab-support-mcp
    app.kubernetes.io/component: backend-route
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
      namespace: agent-office
      sectionName: mcps
  hostnames:
    - runtab-support.mcp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: ""
          kind: Service
          name: runtab-support-mcp
          port: 8080
          weight: 1
