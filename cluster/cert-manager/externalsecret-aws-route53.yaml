# AWS credential for cert-manager's Route 53 DNS-01 solver (ClusterIssuer
# letsencrypt-prod). Materialised from Vault by External Secrets; the key
# pair is never in git.
#
# Vault: KV v2 mount `agent-office`, secret `aws-route53`, properties
#        access-key-id and secret-access-key.
# AWS:   IAM user cert-manager-dns01 (account 703413595208), inline policy
#        Route53CertManager-DNS01: ChangeResourceRecordSets and
#        ListResourceRecordSets on hosted zones Z05939181UAPRPGKZ9ZLF
#        (aimlworkbench.com) and Z07235946XFQQU2GAXO5 (runtab.io),
#        GetChange on change/*, ListHostedZonesByName. A copy of the policy
#        is in aws-route53-dns01-policy.json.
# Rotate: `aws iam create-access-key --user-name cert-manager-dns01`, write
#        the pair to Vault (`vault kv put agent-office/aws-route53 -` with
#        {"access-key-id":…,"secret-access-key":…} on stdin), deactivate the
#        old key. ESO refreshes the Secret within refreshInterval.
#
# Why it lives here: the previous copy was a hand-made Secret in the
# cert-manager namespace and vanished with the namespace in the September
# CRD wipes. Nothing could renew the Let's Encrypt wildcards after that and
# both expired on 14 Oct 2026. OpenShift GitOps self-heals this object and
# ESO re-creates the Secret from Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-route53
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster
    kind: ClusterSecretStore
  target:
    name: aws-route53
    creationPolicy: Owner
    deletionPolicy: Retain
  # The three strategy fields are ESO's defaults, spelled out so Argo's diff
  # matches what the API server stores (otherwise the app sits OutOfSync).
  data:
    - secretKey: access-key-id
      remoteRef:
        key: aws-route53
        property: access-key-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret-access-key
      remoteRef:
        key: aws-route53
        property: secret-access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
