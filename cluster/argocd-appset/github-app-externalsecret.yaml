# GitHub App credentials for the ArgoCD ApplicationSet SCM generator,
# synced from the SAME Vault path as agent-office-github-app — but into
# openshift-gitops and with the key NAMES ArgoCD's GitHub-App SCM auth
# expects (githubAppID / githubAppInstallationID / githubAppPrivateKey).
# Lets the ApplicationSet scan enterprisewebservice for agent gitops
# repos as the governed, auto-rotated App identity (no PAT).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-office-github-app-scm
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster
  target:
    name: agent-office-github-app-scm
    creationPolicy: Owner
  data:
    - secretKey: githubAppID
      remoteRef: { key: github-app, property: appId }
    - secretKey: githubAppInstallationID
      remoteRef: { key: github-app, property: installationId }
    - secretKey: githubAppPrivateKey
      remoteRef: { key: github-app, property: privateKey }
