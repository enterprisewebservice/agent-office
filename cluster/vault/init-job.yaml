# One-shot bootstrap Job that initializes Vault on first install.
#
# Sequence:
#   1. Wait until vault-0 returns 501 from /v1/sys/health (running
#      but not initialized) OR 200/standby (already initialized).
#   2. If uninitialized: run `vault operator init` with 1 key share
#      threshold 1 (demo posture; production wants 5/3).
#   3. Capture the unseal key + root token, write them to the K8s
#      Secret `vault-bootstrap-keys` in the vault namespace.
#   4. If already initialized: no-op.
#
# Idempotent. ArgoCD will re-run after pruning; the script handles
# the "already initialized" case by returning success silently.
#
# HARDEN-LATER: replace shamir keys with auto-unseal (KMS) so this
# Job stops being the keeper of the unseal material in etcd.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap-init
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Hooks run AFTER the helm chart's pods exist.
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-bootstrap-init
    spec:
      serviceAccountName: vault-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: init
          image: docker.io/hashicorp/vault:1.17.6
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc:8200"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Waiting for Vault to be reachable..."
              for i in $(seq 1 60); do
                code=$(wget --quiet -O - --server-response \
                  "$VAULT_ADDR/v1/sys/health" 2>&1 | \
                  awk '/HTTP\/1.[01]/ {print $2}' | tail -1 || true)
                # Codes: 200 = initialized+unsealed+active,
                #        429 = standby, 472 = DR replication,
                #        473 = perf-standby, 501 = uninitialized,
                #        503 = sealed.
                case "$code" in
                  200|429|472|473|501|503)
                    echo "Vault HTTP $code reachable"; break ;;
                esac
                sleep 2
              done

              status=$(vault status -format=json 2>/dev/null || true)
              initialized=$(echo "$status" | sed -n 's/.*"initialized":[[:space:]]*\([a-z]*\).*/\1/p' | head -1)
              if [ "$initialized" = "true" ]; then
                echo "Vault already initialized — bootstrap is a no-op"
                exit 0
              fi

              echo "Running vault operator init (key shares=1, threshold=1, demo posture)"
              # Tell vault to write to a file so we can parse with
              # awk on a single line (older sed in busybox can't do
              # multi-line patterns reliably; previous attempt lost
              # the keys to a parse miss + Vault landed initialized
              # with no Secret to capture them).
              init_out=$(vault operator init \
                -key-shares=1 -key-threshold=1 -format=json)
              echo "$init_out" > /tmp/init.json

              # Flatten the JSON to one token per line then grep:
              # `cat` -> tr removes newlines + extra spaces.
              flat=$(tr -d '\n\r ' < /tmp/init.json)
              unseal_key=$(echo "$flat" | sed -n 's/.*"unseal_keys_b64":\["\([^"]*\)".*/\1/p')
              root_token=$(echo "$flat" | sed -n 's/.*"root_token":"\([^"]*\)".*/\1/p')

              if [ -z "$unseal_key" ] || [ -z "$root_token" ]; then
                echo "ERROR: failed to parse init output"
                cat /tmp/init.json
                exit 1
              fi

              echo "Persisting unseal key + root token to Secret vault-bootstrap-keys"
              cat > /tmp/secret.json <<EOF
              {
                "apiVersion": "v1",
                "kind": "Secret",
                "metadata": {
                  "name": "vault-bootstrap-keys",
                  "namespace": "vault",
                  "annotations": {
                    "agentoffice.ai/note": "Vault unseal+root keys generated by vault-bootstrap-init Job. HARDEN-LATER: replace with KMS auto-unseal."
                  }
                },
                "type": "Opaque",
                "stringData": {
                  "unseal-key-1": "${unseal_key}",
                  "root-token": "${root_token}"
                }
              }
              EOF
              # Use the in-pod kube API to create/update the Secret
              KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              wget --quiet -O - \
                --ca-certificate=$KUBE_CA \
                --header="Authorization: Bearer $KUBE_TOKEN" \
                --header="Content-Type: application/json" \
                --post-file=/tmp/secret.json \
                "https://kubernetes.default.svc/api/v1/namespaces/vault/secrets" \
                || echo "(secret may already exist; ignoring)"

              echo "Unsealing Vault with the new key"
              vault operator unseal "$unseal_key" >/dev/null
              echo "Vault initialized + unsealed successfully"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-bootstrap
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-bootstrap
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault-bootstrap
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-bootstrap
