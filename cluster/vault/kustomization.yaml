apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-scoped resources around the Vault helm chart. The helm
# chart itself is installed by the sibling vault-app.yaml ArgoCD
# Application using its spec.source.helm block — kustomize would
# struggle to manage the chart's templates directly.
#
# Resources here are the things ArgoCD's helm path can't render:
#   * namespace (helm doesn't create it before the install)
#   * bootstrap init Job (one-time on first install)
#   * unseal Job (on every ArgoCD sync)
#   * unseal CronJob (every 2 minutes, catches pod restarts that
#     happen without a sync — see unseal-cronjob.yaml)
#
# These are wired as PostSync hooks so they fire AFTER the chart's
# StatefulSet exists.

resources:
  - namespace.yaml
  - scc-binding.yaml
  - init-job.yaml
  - unseal-job.yaml
  - unseal-cronjob.yaml
