apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MCP Gateway operator install via OLM. Drops the three MCP-flavored
# CRDs (MCPServerRegistration, MCPGatewayExtension, MCPVirtualServer)
# into the cluster, plus the operator controller-manager Deployment.
#
# No namespace.yaml — installs into the existing kuadrant-system
# namespace alongside rhcl-operator (Connectivity Link). No
# operatorgroup.yaml — the kuadrant-system OperatorGroup is
# AllNamespaces, so this operator can watch CRs in any namespace.
#
# Backend MCP servers (e.g. our github-mcp-server in agent-office)
# get registered via MCPServerRegistration CRs that live alongside
# the server they describe; the operator picks them up from any
# namespace.

resources:
  - subscription.yaml
