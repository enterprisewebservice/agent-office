# One model across two nodes. Qwen3-Coder-30B-A3B-Instruct-FP8 is a 30B
# Mixture-of-Experts coding model (3.3B active, 128 experts), 31 GB in FP8,
# which no single 24 GB card can hold. With data parallelism 2 and expert
# parallelism on, each of the two pods (LeaderWorkerSet leader + worker, one
# GPU each on two nodes) keeps a full copy of the attention and shared layers
# and half of the 128 routed experts. The cards are Ampere, so vLLM runs the
# FP8 weights through its Marlin kernels (weight-only, bf16 compute).
# It replaced DeepSeek-Coder-V2-Lite on 8 Nov 2026 because the IDE beat needs
# tool calling: Qwen3-Coder has a native function-call format, parsed by
# vLLM's qwen3_xml parser. Context raised to 32K for agent-mode prompts.
# Shape and environment follow the OpenShift AI 3.4 guide "Deploy models using
# Distributed Inference with llm-d", section 8.7 (reference multi-node MoE
# deployment on TCP networking without RDMA), trimmed to one GPU per pod and
# without its --enforce-eager: vLLM's default CUDA graphs are on (Dean, 6 Nov). The FP8 weights
# take 15.8 GiB per card; the KV cache (about 4 GiB, 32K context fits 1.3 times) is sized after
# the graphs' memory (VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS). With the default 256 sequences
# the graphs took 2.1 GiB and left 1.9 GiB for the cache (32K needs 3.0); 32 sequences is plenty
# for a demo and keeps the graphs small. Without the estimate the graph capture ran out of memory.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-coder-30b-a3b
  namespace: llm-d-demo
  annotations:
    security.opendatahub.io/enable-auth: "true"
    # Stop switch. While this line is present the OpenShift AI controller removes the
    # model's LeaderWorkerSet, route and scheduler (both GPUs are released) and keeps
    # this object. Delete the line to start the model again; see README "Start and stop".
    serving.kserve.io/stop: "true"
spec:
  replicas: 1
  model:
    uri: oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/qwen3-coder-30b-a3b:v1   # ModelCar image built by build/ from hf://Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
    name: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
  parallelism:
    data: 2          # two pods on two nodes
    dataLocal: 1     # one data-parallel rank per pod
    expert: true     # experts split across the ranks
    tensor: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    scheduler: {}
  template:
    containers:
      - name: main
        env:
          - name: VLLM_API_SERVER_COUNT
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: CUDA_DEVICE_ORDER
            value: PCI_BUS_ID
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len 32768 --max-num-seqs 32 --enable-auto-tool-choice --tool-call-parser qwen3_xml --enable-force-include-usage --disable-uvicorn-access-log"   # CUDA graphs on (vLLM default), 0.90 memory; 32 sequences keeps the graphs small
          - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
            value: "1"            # size the KV cache after CUDA-graph memory; without it the first start OOMed while capturing graphs (8 Nov)
          - name: VLLM_ALL2ALL_BACKEND
            value: naive          # TCP all-to-all, no RDMA needed
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: NCCL_NET_GDR_LEVEL
            value: "0"
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_NSOCKS_PERTHREAD
            value: "2"
          - name: NCCL_SOCKET_NTHREADS
            value: "2"
          - name: NCCL_BUFFSIZE
            value: "2097152"
          - name: NCCL_DEBUG
            value: WARN
          - name: NVSHMEM_REMOTE_TRANSPORT
            value: ucx
          - name: NVSHMEM_DISABLE_CUDA_VMM
            value: "0"
          - name: NVSHMEM_BOOTSTRAP_TWO_STAGE
            value: "1"
          - name: NVSHMEM_BOOTSTRAP_TIMEOUT
            value: "300"
          - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
            value: eth0
          - name: UCX_TLS
            value: "tcp,sm,self,cuda_copy,cuda_ipc"
          - name: UCX_NET_DEVICES
            value: eth0
        resources:
          limits:
            cpu: "8"
            memory: 64Gi
            ephemeral-storage: 80Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 40Gi
            ephemeral-storage: 60Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 2400
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
  worker:
    containers:
      - name: main
        env:
          - name: VLLM_API_SERVER_COUNT
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: CUDA_DEVICE_ORDER
            value: PCI_BUS_ID
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len 32768 --max-num-seqs 32 --enable-auto-tool-choice --tool-call-parser qwen3_xml --enable-force-include-usage --disable-uvicorn-access-log"   # CUDA graphs on (vLLM default), 0.90 memory; 32 sequences keeps the graphs small
          - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
            value: "1"            # size the KV cache after CUDA-graph memory; without it the first start OOMed while capturing graphs (8 Nov)
          - name: VLLM_ALL2ALL_BACKEND
            value: naive
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: NCCL_NET_GDR_LEVEL
            value: "0"
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_NSOCKS_PERTHREAD
            value: "2"
          - name: NCCL_SOCKET_NTHREADS
            value: "2"
          - name: NCCL_BUFFSIZE
            value: "2097152"
          - name: NCCL_DEBUG
            value: WARN
          - name: NVSHMEM_REMOTE_TRANSPORT
            value: ucx
          - name: NVSHMEM_DISABLE_CUDA_VMM
            value: "0"
          - name: NVSHMEM_BOOTSTRAP_TWO_STAGE
            value: "1"
          - name: NVSHMEM_BOOTSTRAP_TIMEOUT
            value: "300"
          - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
            value: eth0
          - name: UCX_TLS
            value: "tcp,sm,self,cuda_copy,cuda_ipc"
          - name: UCX_NET_DEVICES
            value: eth0
        resources:
          limits:
            cpu: "8"
            memory: 64Gi
            ephemeral-storage: 80Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 40Gi
            ephemeral-storage: 60Gi
            nvidia.com/gpu: "1"
