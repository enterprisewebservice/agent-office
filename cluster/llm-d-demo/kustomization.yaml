apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# llm-d demo for JCI (9 Nov 2026): a small model with the inference scheduler in
# front, and a 16B MoE model spanning two commodity GPU nodes. See README.md.
namespace: llm-d-demo
resources:
  - namespace.yaml
  - llminferenceservice.yaml
  - access.yaml
  - maas.yaml
  - llminferenceservice-deepseek.yaml
  - maas-deepseek.yaml
