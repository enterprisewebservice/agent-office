apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# llm-d demo for the recorded session "The governed road": a small model with the inference scheduler in
# front, and a 30B MoE coding model spanning two commodity GPU nodes. See README.md.
namespace: llm-d-demo
resources:
  - namespace.yaml
  - llminferenceservice.yaml
  - access.yaml
  - maas.yaml
  - llminferenceservice-qwen3-coder.yaml
  - maas-qwen3-coder.yaml
  - governed-road-helper.yaml
  - build/modelcar-build.yaml
  # For the next model build only: add models-pvc.yaml and models-fetch-job.yaml (edit the
  # Job's model), run the TaskRun under build/run/, then remove both again: the volume holds
  # 31 GB of CephFS that nothing reads once the image is in Quay.
