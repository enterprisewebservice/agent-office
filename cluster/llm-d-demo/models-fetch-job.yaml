# One-time fetch of the spanning model into the shared volume, using the same
# storage-initializer image KServe runs as an init container (args: source, destination),
# with the same 24Gi memory limit and download env: the high-performance HF
# downloader buffers several GB (an 8Gi limit got it OOM-killed, exit 137).
# qwen3-8b was fetched by the first job (5.7 GB, /models/qwen3-8b) and stays.
# Leave the completed Job in place: deleting it would make GitOps run it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-d-models-fetch-v2
  namespace: llm-d-demo
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: deepseek-coder-v2-lite
          image: registry.redhat.io/rhoai/odh-kserve-storage-initializer-rhel9@sha256:ff733612e0e3b5f3221c55a7b62562588dc186391e73b7df685a5fd2f5a3c819
          args: ["hf://deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct", "/models/deepseek-coder-v2-lite"]
          env:
            - { name: HF_HUB_ENABLE_HF_TRANSFER, value: "1" }
            - { name: HF_XET_HIGH_PERFORMANCE, value: "1" }
            - { name: HF_XET_NUM_CONCURRENT_RANGE_GETS, value: "8" }
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { cpu: "4", memory: 24Gi }
          volumeMounts:
            - { name: models, mountPath: /models }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-d-models
