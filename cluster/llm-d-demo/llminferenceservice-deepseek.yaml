# One model across two nodes. DeepSeek-Coder-V2-Lite-Instruct is a 16B
# Mixture-of-Experts model, about 31 GB in bf16, which no single 24 GB card can
# hold. With data parallelism 2 and expert parallelism on, each of the two pods
# (LeaderWorkerSet leader + worker, one GPU each on two nodes) keeps a full copy
# of the attention and shared layers and half of the 64 routed experts.
# Shape and environment follow the OpenShift AI 3.4 guide "Deploy models using
# Distributed Inference with llm-d", section 8.7 (reference multi-node MoE
# deployment on TCP networking without RDMA), trimmed to one GPU per pod and
# without its --enforce-eager: vLLM's default CUDA graphs are on (Dean, 6 Nov).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: deepseek-coder-v2-lite
  namespace: llm-d-demo
  annotations:
    security.opendatahub.io/enable-auth: "true"
spec:
  replicas: 1
  model:
    uri: oci://quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/deepseek-coder-v2-lite:v1   # ModelCar image built by build/ from hf://deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct
    name: deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct
  parallelism:
    data: 2          # two pods on two nodes
    dataLocal: 1     # one data-parallel rank per pod
    expert: true     # experts split across the ranks
    tensor: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    scheduler: {}
  template:
    containers:
      - name: main
        env:
          - name: VLLM_API_SERVER_COUNT
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: CUDA_DEVICE_ORDER
            value: PCI_BUS_ID
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len 8192 --trust-remote-code --disable-uvicorn-access-log"   # vLLM defaults otherwise: CUDA graphs on, 0.90 memory
          - name: VLLM_ALL2ALL_BACKEND
            value: naive          # TCP all-to-all, no RDMA needed
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: NCCL_NET_GDR_LEVEL
            value: "0"
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_NSOCKS_PERTHREAD
            value: "2"
          - name: NCCL_SOCKET_NTHREADS
            value: "2"
          - name: NCCL_BUFFSIZE
            value: "2097152"
          - name: NCCL_DEBUG
            value: WARN
          - name: NVSHMEM_REMOTE_TRANSPORT
            value: ucx
          - name: NVSHMEM_DISABLE_CUDA_VMM
            value: "0"
          - name: NVSHMEM_BOOTSTRAP_TWO_STAGE
            value: "1"
          - name: NVSHMEM_BOOTSTRAP_TIMEOUT
            value: "300"
          - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
            value: eth0
          - name: UCX_TLS
            value: "tcp,sm,self,cuda_copy,cuda_ipc"
          - name: UCX_NET_DEVICES
            value: eth0
        resources:
          limits:
            cpu: "8"
            memory: 64Gi
            ephemeral-storage: 80Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 40Gi
            ephemeral-storage: 60Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 2400
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
  worker:
    containers:
      - name: main
        env:
          - name: VLLM_API_SERVER_COUNT
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: CUDA_DEVICE_ORDER
            value: PCI_BUS_ID
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len 8192 --trust-remote-code --disable-uvicorn-access-log"   # vLLM defaults otherwise: CUDA graphs on, 0.90 memory
          - name: VLLM_ALL2ALL_BACKEND
            value: naive
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: NCCL_NET_GDR_LEVEL
            value: "0"
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_NSOCKS_PERTHREAD
            value: "2"
          - name: NCCL_SOCKET_NTHREADS
            value: "2"
          - name: NCCL_BUFFSIZE
            value: "2097152"
          - name: NCCL_DEBUG
            value: WARN
          - name: NVSHMEM_REMOTE_TRANSPORT
            value: ucx
          - name: NVSHMEM_DISABLE_CUDA_VMM
            value: "0"
          - name: NVSHMEM_BOOTSTRAP_TWO_STAGE
            value: "1"
          - name: NVSHMEM_BOOTSTRAP_TIMEOUT
            value: "300"
          - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
            value: eth0
          - name: UCX_TLS
            value: "tcp,sm,self,cuda_copy,cuda_ipc"
          - name: UCX_NET_DEVICES
            value: eth0
        resources:
          limits:
            cpu: "8"
            memory: 64Gi
            ephemeral-storage: 80Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 40Gi
            ephemeral-storage: 60Gi
            nvidia.com/gpu: "1"
