# Helper for the recorded session "The governed road": the same proof as demo.sh, written for the
# console's web terminal (oc, curl, jq; no python). Extract it in the terminal with
#   oc extract cm/governed-road -n llm-d-demo --to=. --confirm && chmod +x road.sh
# then ./road.sh door | span | mcp | guard | image | allow github | deny github
apiVersion: v1
kind: ConfigMap
metadata:
  name: governed-road
  namespace: llm-d-demo
data:
  road.sh: |
    #!/usr/bin/env bash
    # One front door for models, one model across two nodes, governed tools, the guardrail log.
    # Streams every model call and asks for the usage chunk: on Connectivity Link 1.4.3 the metering
    # filter returns an empty body for non-streaming answers (Kuadrant/wasm-shim#443).
    set -u
    NS=llm-d-demo
    GW=https://maas.apps.salamander.aimlworkbench.com
    URL=$GW/llm-d-demo/qwen3-8b/v1;   MODEL=RedHatAI/Qwen3-8B-quantized.w4a16
    URL2=$GW/llm-d-demo/qwen3-coder-30b-a3b/v1; MODEL2=Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
    SEAT_NS=${SEAT_NS:-deanpeterson-agent-workspace}; SEAT_SECRET=${SEAT_SECRET:-deanpeterson-gitea-token}   # the presenter's seat credential (allow/deny)
    B=$'\e[1m'; D=$'\e[2m'; R=$'\e[0m'
    say() { printf '\n%s%s%s\n' "$B" "$*" "$R"; }
    p() { [ -z "${FAST:-}" ] && sleep "$1" || true; }   # pacing for the narration; FAST=1 skips
    stream() {  # stream "<prompt>" <url> <model> <max_tokens> : shows the request, prints tokens as they arrive, then tokens/s
      local t0 t1 n raw=/tmp/road-stream.$$
      printf '   %sPOST%s      %s/chat/completions\n' "$D" "$R" "$2"
      printf '   %sheader%s    Authorization: Bearer %s... (the key minted for this run)\n' "$D" "$R" "${KEY:0:10}"
      printf '   %smodel%s     %s\n' "$D" "$R" "$3"
      printf '   %squestion%s  "%s"\n' "$D" "$R" "$1"
      printf '   %sanswer%s\n' "$D" "$R"
      t0=$(date +%s.%N)
      curl -sk -N "$2/chat/completions" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
        -d "{\"model\":\"$3\",\"messages\":[{\"role\":\"user\",\"content\":\"$1\"}],\"max_tokens\":$4,\"stream\":true,\"stream_options\":{\"include_usage\":true},\"chat_template_kwargs\":{\"enable_thinking\":false}}" 2>/dev/null \
        | tee "$raw" | sed -u -e 's/^data: //' | grep --line-buffered -v '^\[DONE\]' \
        | jq -rj --unbuffered '.choices[0].delta.content // empty'
      t1=$(date +%s.%N)
      n=$(grep -o '"completion_tokens":[0-9]*' "$raw" | tail -1 | cut -d: -f2); rm -f "$raw"
      printf '\n%s%s tokens in %.1f s, %.0f tokens/s%s\n' "$D" "${n:-?}" "$(awk -v a="$t1" -v b="$t0" 'BEGIN{print a-b}')" "$(awk -v n="${n:-0}" -v a="$t1" -v b="$t0" 'BEGIN{print (a-b>0)? n/(a-b) : 0}')" "$R"
    }
    case "${1:-}" in
    door)
      OCT=$(oc whoami -t)
      say "1. The Models-as-a-Service catalog: one endpoint, every model"
      curl -sk "$GW/maas-api/v1/models" -H "Authorization: Bearer $OCT" | jq -r '(.data // .)[] | .id' | column -c 110
      p 4
      say "2. No key"
      curl -sk -o /dev/null -w "   HTTP %{http_code}\n" "$URL/models"
      p 4
      say "3. Mint a key for myself (the same flow as for Claude or GPT here)"
      KEY=$(curl -sk -X POST "$GW/maas-api/v1/api-keys" -H "Authorization: Bearer $OCT" -H "Content-Type: application/json" -d '{"name":"road-door","expiration":"2h"}' | jq -r .key)
      echo "   key minted: ${KEY:0:10}... (expires in two hours)"
      curl -sk -o /dev/null -w "   with the key: HTTP %{http_code}\n" "$URL/models" -H "Authorization: Bearer $KEY"
      p 4
      say "4. A key from another lane, asking for a model that lane does not include"
      LT=$(oc create token claude-code-agent -n claude-code-agent --duration=1h)
      LKEY=$(curl -sk -X POST "$GW/maas-api/v1/api-keys" -H "Authorization: Bearer $LT" -H "Content-Type: application/json" -d '{"name":"road-lane","expiration":"1h"}' | jq -r .key)
      echo "   ops lane key: ${LKEY:0:10}...  ->  claude-opus-5"
      curl -sk -w "\n   HTTP %{http_code}\n" "$GW/models-as-a-service/claude-opus-5/v1/chat/completions" -H "Authorization: Bearer $LKEY" -H "Content-Type: application/json" \
        -d '{"model":"claude-opus-5","messages":[{"role":"user","content":"hi"}],"max_tokens":5,"stream":true,"stream_options":{"include_usage":true}}' | head -c 600; echo
      ;;
    span)
      KEY=$(curl -sk -X POST "$GW/maas-api/v1/api-keys" -H "Authorization: Bearer $(oc whoami -t)" -H "Content-Type: application/json" -d '{"name":"road-span","expiration":"1h"}' | jq -r .key)
      say "1. Two LLMInferenceServices: a small model, and one 30B Mixture-of-Experts coding model across two nodes"
      oc get llminferenceservice -n $NS -o custom-columns='NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,MODEL:.spec.model.uri'
      echo
      oc get pods -n $NS -o custom-columns='POD:.metadata.name,NODE:.spec.nodeName,STATUS:.status.phase' | grep -v router-scheduler
      p 20
      say "2. GPU memory on each half of the spanning model (31 GB of weights, 24 GB cards)"
      for p in $(oc get pods -n $NS -o name | grep 'qwen3-coder-30b-a3b-kserve-mn-0'); do
        node=$(oc get -n $NS "$p" -o jsonpath='{.spec.nodeName}')
        printf '   %-46s %-20s %s\n' "${p#pod/}" "$node" "$(oc exec -n $NS "${p#pod/}" -c main -- nvidia-smi --query-gpu=name,memory.used,memory.total --format=csv,noheader 2>/dev/null)"
      done
      p 16
      say "3. A coding question to the spanning model, streamed through the front door"
      stream "Write a Python function that returns the busiest hour from a list of (timestamp, kwh) tuples. Code only, no explanation." "$URL2" "$MODEL2" 160
      ;;
    mcp)
      say "Tool servers registered on the MCP gateway"
      oc get mcpserverregistration -n agent-office -o json | jq -r '.items[] | [.metadata.name, .spec.state, (.status.discoveredTools|tostring)+" tools", "credential: "+.spec.credentialRef.name] | @tsv' | column -t -s $'\t' | sed 's/^/   /'
      say "The GitHub registration: the route it fronts and the credential the gateway injects"
      oc get mcpserverregistration github -n agent-office -o json | jq -r '"   route:      \(.spec.targetRef.kind)/\(.spec.targetRef.name) (path \(.spec.path))\n   credential: secret \(.spec.credentialRef.name), key \(.spec.credentialRef.key)\n   tools:      \(.status.discoveredTools) discovered"'
      say "Who may call what: the allow-list is an annotation on each caller's own credential"
      oc get secret -A -l agentoffice.ai/mcp-gateway-caller=true -o json | jq -r '.items[] | [.metadata.namespace+"/"+.metadata.name, (.metadata.annotations["agentoffice.ai/mcp-servers"] // "-")] | @tsv' | column -t -s $'\t' | head -8 | sed 's/^/   /'
      ;;
    guard)
      say "The bridge log: what the guardrail decided, and the scores behind it"
      oc logs deploy/mm-bridge -n agent-office --since=30m 2>/dev/null | grep '\[guard\] BLOCKED' | tail -1 | sed 's/ \([a-z_]*\)=/\n   \1= /g'
      ;;
    image)
      say "The model weights are a container image in Quay (public repository): tags, size, when it was pushed"
      curl -sk "https://quay-quay-quay-test.apps.salamander.aimlworkbench.com/api/v1/repository/deanpeterson/qwen3-coder-30b-a3b/tag/" \
        | jq -r '.tags[] | "   \(.name)\t\(((.size // 0) / 1073741824 * 10 | floor) / 10) GB\t\(.last_modified)"' | column -t -s "$(printf '\t')"
      ;;
    allow|deny)
      # The seat's allow-list is an annotation on its own credential (callers-auth-policy.yaml): add or
      # remove one registered server, e.g. ./road.sh allow github. Authorino watches the Secret, so the
      # next tools/call from the IDE sees the change; nothing restarts and nothing on the laptop changes.
      srv="agent-office/${2:?usage: ./road.sh allow|deny <registration>, e.g. github}"
      cur=$(oc get secret "$SEAT_SECRET" -n "$SEAT_NS" -o jsonpath='{.metadata.annotations.agentoffice\.ai/mcp-servers}')
      new=$(printf '%s' "$cur" | tr ',' '\n' | grep -v '^$' | grep -vx "$srv" | { cat; [ "$1" = allow ] && echo "$srv"; } | paste -sd, -)
      oc annotate secret "$SEAT_SECRET" -n "$SEAT_NS" "agentoffice.ai/mcp-servers=$new" --overwrite >/dev/null
      say "Seat $SEAT_NS/$SEAT_SECRET may now call:"
      printf '%s' "$new" | tr ',' '\n' | sed 's/^/   /'
      # RHCL 1.4.3: Authorino re-reads a seat's annotations only when the policy spec changes (its secret controller
      # looks for AuthConfigs in the secret's namespace; ours live in kuadrant-system). A comment change in the
      # rule makes Kuadrant regenerate the AuthConfigs and Authorino re-index every seat; effective in ~10 s.
      rego=$(oc get authpolicy mcp-gateway-tool-access -n agent-office -o jsonpath='{.spec.rules.authorization.server-allow-list.opa.rego}' | sed '/^# reindex [0-9]*$/d')
      rego="$rego"$'\n'"# reindex $(date +%s)"
      oc patch authpolicy mcp-gateway-tool-access -n agent-office --type=json -p "$(jq -cn --arg r "$rego" '[{op:"replace",path:"/spec/rules/authorization/server-allow-list/opa/rego",value:$r}]')" >/dev/null
      echo "   policy re-synced; the gateway applies it within about ten seconds"
      ;;
    *) echo "usage: ./road.sh door | span | mcp | guard | image | allow <server> | deny <server>";;
    esac
