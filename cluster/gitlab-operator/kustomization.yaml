apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Certified GitLab Inc operator install for in-cluster GitLab
# Self-Managed. The operator's owned CRD is `GitLab` (one per
# install). v2.11.3 ships in the `stable` channel; the
# Subscription pins startingCSV so registry-poll auto-upgrades
# don't surprise the cluster between gitops syncs.
#
# This app deploys the OPERATOR only. The GitLab CR (the actual
# GitLab instance with its postgres / redis / gitaly / sidekiq
# pods) lives in a separate gitops app one sync-wave later, so
# Argo can wait for the operator's CRD to be installed before
# trying to apply the CR.
resources:
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
