apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: gitlab-operator
  namespace: gitlab-system
spec:
  # GitLab certified operator (v2.11.3) declares installMode
  # OwnNamespace=true ONLY (SingleNamespace / MultiNamespace /
  # AllNamespaces all unsupported). So the OperatorGroup MUST scope
  # itself to its own namespace — `targetNamespaces: [gitlab-system]`
  # is the canonical OwnNamespace shape.
  targetNamespaces:
    - gitlab-system
  upgradeStrategy: Default
