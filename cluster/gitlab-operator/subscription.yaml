apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gitlab-operator-kubernetes
  namespace: gitlab-system
spec:
  # Certified channel from GitLab Inc (provider on the
  # certified-operators CatalogSource). The community-operators
  # source carries the same package, but the certified build is
  # the one Red Hat / GitLab support together — preferred per the
  # cluster's operator-managed-install convention.
  channel: stable
  name: gitlab-operator-kubernetes
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # Pinning the starting CSV gives ArgoCD a deterministic spec
  # to compare against; future bumps come via gitops edits, not
  # silent registry-poll upgrades.
  startingCSV: gitlab-operator-kubernetes.v2.11.3
