apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-system
  labels:
    # Pod security standards: GitLab's nginx-ingress + sidekiq +
    # gitaly need raised privileges. Operator install lands here too.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    # Cluster monitoring lights up scrape targets for GitLab's
    # prometheus exporters out of the box.
    openshift.io/cluster-monitoring: "true"
