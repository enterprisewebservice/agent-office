# In-cluster image build for seat-triage-mcp (same recipe as projectboard-mcp):
# clone the repo, buildah bud the Dockerfile, push to the cluster's Quay.
# Not part of the help-desk kustomization; run build/run/taskrun.yaml.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: seat-triage-mcp-build
  namespace: agent-office
  labels:
    app.kubernetes.io/name: seat-triage-mcp
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/enterprisewebservice/agent-office.git
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      default: quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/seat-triage-mcp:v0.1.0
    - name: context
      type: string
      default: mcp-servers/seat-triage-mcp
  workspaces:
    - name: dockerconfig
      description: quay-push-secret (kubernetes.io/dockerconfigjson)
  steps:
    - name: build-and-push
      # The same image + capability the cluster's own `buildah` task
      # (openshift-pipelines) runs with under pipelines-scc. Upstream
      # quay.io/buildah/stable now fails there on uid_map ("operation not
      # permitted"); the Red Hat build carries the setuid helpers it needs.
      image: registry.redhat.io/rhel9/buildah@sha256:43905f40b285c32725fd6239c236df7a6bfc562e5c1b7d8338dc369a2aa2b9f8
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      env:
        - name: BUILDAH_ISOLATION
          value: chroot
      script: |
        set -euo pipefail
        AUTH="$(workspaces.dockerconfig.path)/.dockerconfigjson"
        git clone --depth 1 --branch "$(params.git-revision)" "$(params.git-url)" /tmp/src
        cd "/tmp/src/$(params.context)"
        echo "building $(params.image) from local context $(pwd)"
        buildah --storage-driver=vfs bud --isolation chroot -f Dockerfile -t "$(params.image)" .
        buildah --storage-driver=vfs push --authfile "$AUTH" "$(params.image)"
        echo "pushed $(params.image)"
