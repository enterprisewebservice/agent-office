# The house ChatGPT/Codex subscription as a published brain.
# Visible only to Dean in the hiring UI; rides the existing gateway
# subscription plumbing (codexCredentialsSecretRef + modelAuth) — the
# connection is the permissioned menu entry, not new credential flow.
apiVersion: agentoffice.ai/v1alpha1
kind: ModelConnection
metadata:
  name: dean-codex-subscription
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  displayName: "Codex — house subscription"
  description: "Frontier coding brain on the platform's ChatGPT subscription"
  kind: subscription
  provider: openai-codex
  models:
    - id: gpt-5.6-sol
      name: "GPT-5.6 Sol"
    - id: gpt-5.6
      name: "GPT-5.6"
  access:
    groups:
      - model-admins
    users:
      - deanpeterson
