# model-desk — the cluster's metered model front door (LiteLLM in ns
# model-desk; deployed from software-factory-deployer). This is the
# endpoint-kind connection the operator fully renders: gateways whose
# agents reference it get a models.providers.model-desk block and the
# key projected from agent-office/model-desk-agent-key (created
# out-of-band; never in git).
#
# NOTE the OpenAI upstream caps tools[] at 128 — an agent with a
# larger tool surface (a full workshop seat carries ~200) errors on
# this lane until its tool profile is trimmed or the model moves to
# an upstream without the cap (vLLM). Proven live 2026-08-31.
apiVersion: agentoffice.ai/v1alpha1
kind: ModelConnection
metadata:
  name: model-desk
  annotations:
    # Pre-selected for anyone who cannot see claude-work (handsonmode.ai seats):
    # the hiring form sorts defaults first, then by name, so Red Hat hub seats
    # still land on claude-work.
    agentoffice.ai/default-brain: "true"
  labels:
    app.kubernetes.io/managed-by: agent-office-gitops
spec:
  displayName: "Metered frontier — OpenAI"
  description: "OpenAI via the cluster front door; 128-tool cap applies"
  kind: endpoint
  baseUrl: "http://model-desk.model-desk.svc.cluster.local:4000/v1"
  api: openai-completions
  apiKeySecretRef:
    name: model-desk-agent-key
    namespace: agent-office
    key: api-key
  # First model = the connection's default in the hiring form. GPT-5.6 on
  # the metered API (verified 2026-09-10: sol/terra/luna all answer through
  # model-desk); 4o stays as the cheap option.
  models:
    - id: gpt-5.6-sol
      name: "GPT-5.6 Sol"
    - id: gpt-5.6-terra
      name: "GPT-5.6 Terra"
    - id: gpt-5.6-luna
      name: "GPT-5.6 Luna"
    - id: gpt-4o
      name: "GPT-4o"
    - id: gpt-4o-mini
      name: "GPT-4o mini"
  keyStrategy: shared
  access:
    groups:
      - handsonmode-attendees
      - redhat-attendees
      - attendees
      - handsonmode-users
      - redhat-workshop-users
      - model-admins
    users:
      - deanpeterson
