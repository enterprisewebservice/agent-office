apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-office-guardrails
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/enterprisewebservice/agent-office.git
    targetRevision: main
    path: cluster/guardrails
  destination:
    server: https://kubernetes.default.svc
    namespace: guardrails
  # KServe fills predictor defaults (automountServiceAccountToken, model.name)
  # and normalises deploymentStrategy; none of it is drift.
  ignoreDifferences:
    - group: serving.kserve.io
      kind: InferenceService
      jsonPointers:
        - /spec/predictor/automountServiceAccountToken
        - /spec/predictor/model/name
        - /spec/predictor/deploymentStrategy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
