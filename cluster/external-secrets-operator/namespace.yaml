apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    # OpenShift-managed namespace so the operator's webhook + RBAC can
    # land here cleanly. The ESO Subscription targets this namespace
    # via its OperatorGroup below.
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
