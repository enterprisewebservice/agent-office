# Who may write and read traces of tenant "dev" (Tempo multitenancy, OpenShift
# mode): the collector writes; every authenticated user may read, so the
# console Traces view works for anyone who can log in. Tighten to a group later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-dev-traces-write
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: ["dev"]
    resourceNames: ["traces"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tempo-dev-traces-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-dev-traces-write
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-dev-traces-read
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: ["dev"]
    resourceNames: ["traces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tempo-dev-traces-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-dev-traces-read
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:authenticated
