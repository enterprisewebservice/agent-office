apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # layer 1: alerts that reach a human
  - cluster-monitoring-config.yaml
  - alertmanager-main.yaml
  - alerting-rules.yaml
  # layer 2: caps
  - resourcequotas.yaml
  - project-request.yaml
  # layer 3: admission policy for CronJobs
  - cronjob-policy.yaml
  # admission policy: no pod pinned to a control-plane node outside platform namespaces
  - control-plane-pin-policy.yaml
  # the Pipelines pruner, declared with the operator's default values
  - tektonconfig-pruner.yaml
