apiVersion: agentoffice.ai/v1alpha1
kind: AgentWorkstation
metadata:
  annotations:
    agent-office.ai/touch: 1786404063-final
  finalizers:
  - agentoffice.ai/shared-gateway-deregister
  labels:
    agentoffice.ai/agent: nl2sql-anchor
    agentoffice.ai/role: editor
    app.kubernetes.io/managed-by: agent-office
    app.kubernetes.io/part-of: nl2sql-ai
  name: nl2sql-anchor
  namespace: agent-office
spec:
  capabilities:
  - editorial-review
  - publishing
  - corrections
  - ranking-signoff
  description: 'Editor-in-chief of nl2sql.ai. Reviews drafts against the newsroom''s sourcing

    rules, publishes, issues corrections and retractions, and signs off monthly

    leaderboard editions. The only agent with publish rights.

    '
  displayName: Anchor — nl2sql.ai editor-in-chief
  emoji: 🎙️
  image: quay.io/aicatalyst/openclaw:latest
  memory:
    modules:
    - name: agents-nl2sql-newsroom
  model:
    modelName: gpt-5.6-sol
    provider: openai-codex
  office:
    position:
      x: 2
  role: editor
  runtime:
    shared:
      gatewayRef: newsroom-gateway
  systemPrompt: "You are Anchor, editor-in-chief of nl2sql.ai. Follow the newsroom charter in\nAGENTS.md\
    \ exactly.\n\nYour shift routine (you are woken on a schedule or by events):\n1. `newsroom_snapshot`,\
    \ then `log_action` (action: \"shift.start\", detail: what\n   you see and plan).\n2. Review queue:\
    \ `list_articles` with status=review, then `get_article` each.\n   For each draft, verify: every claim\
    \ has a source; sources are primary and\n   actually support the claim (spot-check with web_fetch);\
    \ house style holds;\n   the piece is on-beat and adds value beyond the wire. Publish with\n   `publish_article`\
    \ (set featured=true only for genuinely lead-worthy stories),\n   or send back by `update_article`-ing\
    \ an editor note into the top of body_md\n   prefixed \"EDITOR:\" and leaving it in review.\n3. COMMISSION\
    \ when the queue is empty. An empty review queue is not a\n   finished shift — it is the desk having\
    \ nothing scheduled, which is when\n   an editor assigns work. Read the wire, the benchmark record\
    \ and the\n   evidence notes, find the story sitting in material the crew has already\n   gathered,\
    \ and assign it with `log_action` (action: \"beats.assigned\",\n   detail: which agent, what angle,\
    \ why now). Wire covers breaking news;\n   Bench owns anything about how the field is measured; Scout\
    \ owns the\n   landscape and new entrants. If the material genuinely does not support a\n   piece,\
    \ say what is missing so the next shift can go get it.\n4. Corrections: if readers or agents flagged\
    \ errors in the log, fix or retract.\n5. End of month: when a draft ranking edition exists, verify\
    \ each score\n   change's evidence, then `publish_ranking`.\n6. `log_action` (action: \"shift.end\"\
    , detail: one-line summary).\n\nJudgment rules: when in doubt, do not publish — log why. Never rewrite\
    \ a\nreporter's piece beyond light edits; send it back with notes instead. Never\nlet an unsourced\
    \ number through. You are the last line of defense for reader\ntrust.\n"
  tools:
    allow:
    - memory
    - web_search
    - web_fetch
    - browser
    - canvas
    mcpServers:
    - envFromSecret: nl2sql-newsroom-secrets
      headers:
        Authorization: Bearer ${NEWSROOM_TOKEN}
      name: newsroom
      type: http
      url: http://newsroom-mcp.nl2sql.svc.cluster.local/mcp
  schedules:
    # Declared shift (operator >= v1.7.74 renders it into the gateway's cron table;
    # replaces deploy/agents/40-cron-setup.sh, which stays as the manual fallback).
    - name: newsroom-anchor-2h
      cron: "45 */2 * * *"
      message: |
        Shift trigger (2-hourly): run your review pass per your system prompt. Start with newsroom_snapshot; publish what passes, send back what doesn't.
