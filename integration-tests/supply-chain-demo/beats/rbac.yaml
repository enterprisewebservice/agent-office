# Extra RBAC the supply-chain beats need beyond the genesis baseline:
# - read PipelineRuns in default-tenant (Konflux build watch, cross-namespace)
# - read Deployments + MCPServerRegistrations in agent-office (Act-2 asserts)
# - read ArgoCD Applications in openshift-gitops (teardown prune watch)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aoit-runner-konflux-read
  namespace: default-tenant
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aoit-runner-konflux-read
  namespace: default-tenant
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aoit-runner-konflux-read}
subjects:
  - {kind: ServiceAccount, name: aoit-runner, namespace: agent-office}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aoit-runner-sc-read
  namespace: agent-office
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpserverregistrations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aoit-runner-sc-read
  namespace: agent-office
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aoit-runner-sc-read}
subjects:
  - {kind: ServiceAccount, name: aoit-runner, namespace: agent-office}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aoit-runner-argocd-read
  namespace: openshift-gitops
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aoit-runner-argocd-read
  namespace: openshift-gitops
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aoit-runner-argocd-read}
subjects:
  - {kind: ServiceAccount, name: aoit-runner, namespace: agent-office}
