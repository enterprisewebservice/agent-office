# Supply-chain demo — BEAT (Act 1): file Morgan's capability request as an
# OPEN card on the tracker. Idempotent: reuses an existing open card if present.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sc-card
  namespace: agent-office
  labels:
    app.kubernetes.io/part-of: agent-office-supply-chain-demo
spec:
  description: Ensure the ops-metrics build card exists and is open (Act 1).
  params:
    - name: tracker
      type: string
      default: enterprisewebservice/supply-chain-tracker
  results:
    - name: issue-number
      description: the open card's issue number
  steps:
    - name: card
      image: registry.access.redhat.com/ubi9/ubi:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        curl -sL "http://downloads.openshift-console.svc.cluster.local:80/amd64/linux/oc.tar" -o /tmp/oc.tar && tar -x -C /tmp -f /tmp/oc.tar oc
        GT=$(/tmp/oc get secret github-mcp-installation-token -n agent-office -o jsonpath='{.data.GITHUB_PERSONAL_ACCESS_TOKEN}' | base64 -d)
        gh(){ curl -s -H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" "$@"; }
        N=$(gh "https://api.github.com/repos/$(params.tracker)/issues?state=open" | python3 -c "
        import json,sys
        for i in json.load(sys.stdin):
            if 'ops-metrics' in i['title']: print(i['number']); break")
        if [ -z "$N" ]; then
          N=$(gh -X POST "https://api.github.com/repos/$(params.tracker)/issues" -d '{
            "title": "Build the ops-metrics service (weekly ops answers from orders-api)",
            "body": "Morgan (ops) needs weekly answers computed from orders-api instead of CSV exports.\n\nContract (definition of done): https://github.com/enterprisewebservice/agent-office/blob/main/integration-tests/supply-chain-demo/CONTRACT.md\n\nDefinitions: stuck = >7 days in processing; week = 7 days ending at the platform as_of anchor."}' \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['number'])")
          echo "filed card #$N"
        else
          echo "card #$N already open — reusing"
        fi
        printf "%s" "$N" > "$(results.issue-number.path)"
