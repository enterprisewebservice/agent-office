# Genesis demo — BEAT (genesis-mattermost): chat with an agent in Mattermost.
#
# Exercises the WHOLE chat chain end to end, against the presence the OPERATOR
# auto-provisioned (user @<agent> + #<agent> channel — see the operator's
# reconcileMattermost). This beat does NOT provision; it verifies:
#   1. the operator-provisioned user @<agent> + channel #<agent> exist,
#   2. post a question in the channel,
#   3. the in-cluster mm-bridge drives the REAL openclaw agent and replies AS
#      the agent user — assert a reply arrives.
#
# Proves: self-hosted Mattermost + operator-provisioned per-agent user (own
# name, green dot) + the bridge make a provisioned agent actually answer.
# Idempotent + read-only on the presence (keep=true). Requires operator
# >= v1.7.0 (provisions the user/channel) + the mm-bridge Deployment running.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: genesis-mattermost
  namespace: agent-office
  labels:
    app.kubernetes.io/part-of: agent-office-genesis-demo
spec:
  description: Verify an operator-provisioned agent chats back in Mattermost (via the bridge).
  params:
    - name: agent-name
      type: string
      default: genesis-pm
    - name: mm-url
      type: string
      default: "http://mattermost.mattermost.svc.cluster.local:8065"
    - name: mm-team
      type: string
      default: agents
    - name: oc-download-url
      type: string
      default: "http://downloads.openshift-console.svc.cluster.local:80/amd64/linux/oc.tar"
  steps:
    - name: chat
      image: registry.access.redhat.com/ubi9/ubi:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        curl -sL "$(params.oc-download-url)" -o /tmp/oc.tar && tar -x -C /tmp -f /tmp/oc.tar oc
        OC=/tmp/oc
        AGENT="$(params.agent-name)"; MM="$(params.mm-url)"; TEAM="$(params.mm-team)"
        TOK=$($OC get secret mattermost-admin-token -n agent-office -o jsonpath='{.data.token}' | base64 -d)
        [ -n "$TOK" ] || { echo "FAIL: no mattermost-admin-token in agent-office"; exit 1; }
        # SLUG: the Mattermost handle the operator provisioned under (== AGENT
        # for names <= 22 chars). MUST match mmSlug()/mm_slug() in operator+bridge.
        SLUG=$(python3 -c "import sys,hashlib; n=sys.argv[1]; print(n if len(n)<=22 else n[:13].rstrip('-._')+'-'+hashlib.sha256(n.encode()).hexdigest()[:8])" "$AGENT")
        h(){ curl -s -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" "$@"; }
        jget(){ python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('$1','') if isinstance(d,dict) else '')"; }

        echo "=== resolve the OPERATOR-provisioned user @$SLUG + channel #$SLUG (agent $AGENT) ==="
        TEAM_ID=$(h "$MM/api/v4/teams/name/$TEAM" | jget id)
        [ -n "$TEAM_ID" ] || { echo "FAIL: team '$TEAM' missing — operator hasn't provisioned yet"; exit 1; }
        UID_=$(h "$MM/api/v4/users/username/$SLUG" | jget id)
        [ -n "$UID_" ] || { echo "FAIL: user @$SLUG not found — is the operator (>= v1.7.1) running + an AgentWorkstation named $AGENT present?"; exit 1; }
        echo "  user @$SLUG id=$UID_"
        CH=$(h "$MM/api/v4/teams/$TEAM_ID/channels/name/$SLUG" | jget id)
        [ -n "$CH" ] || { echo "FAIL: channel #$SLUG not found — operator hasn't provisioned the channel"; exit 1; }
        echo "  channel #$SLUG id=$CH"
        # make sure the admin (this token) can post into the channel
        h -X POST "$MM/api/v4/channels/$CH/members" -d "{\"user_id\":\"$(h "$MM/api/v4/users/me" | jget id)\"}" >/dev/null 2>&1 || true

        echo "=== post a question; the mm-bridge should drive $AGENT + reply AS the user ==="
        Q="Integration test ping — reply in one short sentence so we know you're live."
        MYTS=$(h -X POST "$MM/api/v4/posts" -d "{\"channel_id\":\"$CH\",\"message\":\"$Q\"}" | jget create_at)
        [ -n "$MYTS" ] || { echo "FAIL: could not post"; exit 1; }
        echo "  posted at $MYTS; waiting up to ~3.5 min for $AGENT to answer…"
        REPLY=""
        for i in $(seq 1 42); do
          REPLY=$(h "$MM/api/v4/channels/$CH/posts?per_page=10" | MYTS="$MYTS" BID="$UID_" python3 -c 'import sys,json,os;d=json.load(sys.stdin);ts=int(os.environ["MYTS"]);bid=os.environ["BID"];print(next((d["posts"][p]["message"] for p in d["order"] if d["posts"][p]["user_id"]==bid and d["posts"][p]["create_at"]>ts and not d["posts"][p].get("type")),""))')
          [ -n "$REPLY" ] && break
          sleep 5
        done
        if [ -z "$REPLY" ]; then
          echo "FAIL: no reply from $AGENT — is the mm-bridge Deployment running + the agent on a Ready gateway?"
          $OC get pods -n agent-office -l app=mm-bridge 2>/dev/null | sed 's/^/  /'
          exit 1
        fi
        echo "  ✓ $AGENT replied in Mattermost: \"$REPLY\""
        echo; echo "PASS — @$AGENT (operator-provisioned) is live + chatting in #$AGENT via the bridge."
