# PIPELINE DEFINITION
# Name: genesis-model
# Description: The smallest honest predictive model: linear regression by hand-written gradient descent, recovering a known truth.
# Inputs:
#    epochs: int [Default: 300.0]
#    lr: float [Default: 0.05]
#    n: int [Default: 200.0]
#    noise: float [Default: 0.5]
#    seed: int [Default: 7.0]
#    true_b: float [Default: 1.0]
#    true_w: float [Default: 2.0]
components:
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        true_b:
          parameterType: NUMBER_DOUBLE
        true_w:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-generate-data:
    executorLabel: exec-generate-data
    inputDefinitions:
      parameters:
        n:
          parameterType: NUMBER_INTEGER
        noise:
          parameterType: NUMBER_DOUBLE
        seed:
          parameterType: NUMBER_INTEGER
        true_b:
          parameterType: NUMBER_DOUBLE
        true_w:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-gd:
    executorLabel: exec-train-gd
    inputDefinitions:
      artifacts:
        train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        epochs:
          parameterType: NUMBER_INTEGER
        lr:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==2.1.3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(\n    test: dsl.Input[dsl.Dataset],\n    model: dsl.Input[dsl.Model],\n\
          \    true_w: float,\n    true_b: float,\n    metrics: dsl.Output[dsl.Metrics],\n\
          ):\n    \"\"\"Did it actually learn? Two questions:\n    1. Generalization\
          \ \u2014 low error on the held-out points it never trained on.\n    2. Recovery\
          \ \u2014 did w,b land near the universe's true_w,true_b? (Only the\n   \
          \    demo gets to check this; in the real world you never know the truth\
          \ \u2014\n       which is exactly why the test split matters.)\"\"\"\n \
          \   import json\n    import numpy as np\n\n    d = json.load(open(test.path))\n\
          \    x = np.array(d[\"x\"]); y = np.array(d[\"y\"])\n    m = json.load(open(model.path))\n\
          \    w, b = m[\"w\"], m[\"b\"]\n\n    test_mse = float(((w * x + b - y)\
          \ ** 2).mean())\n    w_err = abs(w - true_w)\n    b_err = abs(b - true_b)\n\
          \    print(f\"test MSE={test_mse:.4f}  recovered w={w:.4f} (true {true_w},\
          \ |err|={w_err:.4f})  \"\n          f\"b={b:.4f} (true {true_b}, |err|={b_err:.4f})\"\
          )\n    metrics.log_metric(\"test_mse\", round(test_mse, 6))\n    metrics.log_metric(\"\
          recovery_w_abs_err\", round(w_err, 4))\n    metrics.log_metric(\"recovery_b_abs_err\"\
          , round(b_err, 4))\n    # a single pass/fail the worker agent (and the integration\
          \ test) can read\n    metrics.log_metric(\"learned_ok\", 1.0 if (w_err <\
          \ 0.25 and b_err < 0.25) else 0.0)\n\n"
        image: registry.access.redhat.com/ubi9/python-311:latest
    exec-generate-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==2.1.3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_data(\n    n: int,\n    true_w: float,\n    true_b:\
          \ float,\n    noise: float,\n    seed: int,\n    train: dsl.Output[dsl.Dataset],\n\
          \    test: dsl.Output[dsl.Dataset],\n):\n    \"\"\"The universe. y = true_w*x\
          \ + true_b + Gaussian noise. We hold out a\n    test split so 'did it learn?'\
          \ means 'does it predict UNSEEN points?',\n    not 'did it memorize?'. The\
          \ model never sees true_w/true_b \u2014 only (x, y).\"\"\"\n    import json\n\
          \    import numpy as np\n\n    rng = np.random.default_rng(seed)\n    x\
          \ = rng.uniform(-3.0, 3.0, size=n)\n    y = true_w * x + true_b + rng.normal(0.0,\
          \ noise, size=n)\n    cut = int(n * 0.8)\n    with open(train.path, \"w\"\
          ) as f:\n        json.dump({\"x\": x[:cut].tolist(), \"y\": y[:cut].tolist()},\
          \ f)\n    with open(test.path, \"w\") as f:\n        json.dump({\"x\": x[cut:].tolist(),\
          \ \"y\": y[cut:].tolist()}, f)\n    print(f\"generated {n} points, y = {true_w}*x\
          \ + {true_b} + N(0,{noise}); \"\n          f\"{cut} train / {n - cut} test\"\
          )\n\n"
        image: registry.access.redhat.com/ubi9/python-311:latest
    exec-train-gd:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_gd
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==2.1.3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_gd(\n    train: dsl.Input[dsl.Dataset],\n    epochs: int,\n\
          \    lr: float,\n    model: dsl.Output[dsl.Model],\n    metrics: dsl.Output[dsl.Metrics],\n\
          ):\n    \"\"\"The whole of machine learning, once, by hand.\n\n    Start\
          \ ignorant (w=0, b=0). Repeat: predict, measure how wrong, work out\n  \
          \  which way is downhill for each parameter, take a small step that way.\n\
          \    That's gradient descent. There is nothing else under the hood of the\n\
          \    giant models \u2014 only more parameters and more steps.\"\"\"\n  \
          \  import json\n    import numpy as np\n\n    d = json.load(open(train.path))\n\
          \    x = np.array(d[\"x\"]); y = np.array(d[\"y\"])\n\n    w, b = 0.0, 0.0\
          \                       # a model is just its parameters\n    history =\
          \ []\n    for epoch in range(epochs):\n        yhat = w * x + b        \
          \          # PREDICT: apply current belief\n        err = yhat - y     \
          \               # how wrong, per example\n        loss = float((err ** 2).mean())\
          \   # LOSS: one number to push down (MSE)\n        dw = float(2 * (err *\
          \ x).mean())  # GRADIENT: downhill direction for w\n        db = float(2\
          \ * err.mean())        #           downhill direction for b\n        w -=\
          \ lr * dw                      # LEARN: step downhill\n        b -= lr *\
          \ db\n        if epoch % max(1, epochs // 20) == 0 or epoch == epochs -\
          \ 1:\n            history.append({\"epoch\": epoch, \"loss\": loss, \"w\"\
          : w, \"b\": b})\n            print(f\"epoch {epoch:4d}  loss={loss:.4f}\
          \  w={w:.4f}  b={b:.4f}\")\n\n    json.dump({\"w\": w, \"b\": b, \"history\"\
          : history}, open(model.path, \"w\"))\n    # surface the learned parameters\
          \ + final loss in the Experiments UI\n    metrics.log_metric(\"final_train_loss\"\
          , round(loss, 6))\n    metrics.log_metric(\"learned_w\", round(w, 4))\n\
          \    metrics.log_metric(\"learned_b\", round(b, 4))\n\n"
        image: registry.access.redhat.com/ubi9/python-311:latest
pipelineInfo:
  description: 'The smallest honest predictive model: linear regression by hand-written
    gradient descent, recovering a known truth.'
  name: genesis-model
root:
  dag:
    tasks:
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - generate-data
        - train-gd
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-gd
            test:
              taskOutputArtifact:
                outputArtifactKey: test
                producerTask: generate-data
          parameters:
            true_b:
              componentInputParameter: true_b
            true_w:
              componentInputParameter: true_w
        taskInfo:
          name: evaluate
      generate-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-data
        inputs:
          parameters:
            n:
              componentInputParameter: n
            noise:
              componentInputParameter: noise
            seed:
              componentInputParameter: seed
            true_b:
              componentInputParameter: true_b
            true_w:
              componentInputParameter: true_w
        taskInfo:
          name: generate-data
      train-gd:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-gd
        dependentTasks:
        - generate-data
        inputs:
          artifacts:
            train:
              taskOutputArtifact:
                outputArtifactKey: train
                producerTask: generate-data
          parameters:
            epochs:
              componentInputParameter: epochs
            lr:
              componentInputParameter: lr
        taskInfo:
          name: train-gd
  inputDefinitions:
    parameters:
      epochs:
        defaultValue: 300.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lr:
        defaultValue: 0.05
        isOptional: true
        parameterType: NUMBER_DOUBLE
      n:
        defaultValue: 200.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      noise:
        defaultValue: 0.5
        isOptional: true
        parameterType: NUMBER_DOUBLE
      seed:
        defaultValue: 7.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      true_b:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
      true_w:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
