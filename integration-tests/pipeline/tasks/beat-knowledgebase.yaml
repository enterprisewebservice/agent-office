# Beat (Act 2) — KnowledgeBase create + attach + content, the REAL way.
#
# Drives the actual openclaw-agent scaffolder template with
# createNewKnowledgeBase=true: the template emits a KnowledgeBase CR
# (<name>-wiki) into the agent's gitops repo AND publishes a <name>-wiki
# GitHub repo seeded with wiki-seed/ content. ArgoCD applies both the AW
# (with spec.knowledgeBaseRefs) and the KB; the operator provisions the
# KB PVC and attaches it to the agent's gateway pod as a volume mounted
# at /home/node/.openclaw/wiki/<name>-wiki/.
#
# DEDICATED on purpose: a KB attach mutates the gateway Deployment's
# volumes (= pod restart), so we never attach a transient test KB to the
# shared research-gateway (would bounce the 5 production agents). The KB
# agent brings its OWN gateway — the KB mounts into that isolated pod.
#
# Asserts the reliable, declarative + operator-spec facts (no dependency
# on the fresh codex pod reaching Ready): KB CR created, AW references
# it, PVC bound, the gateway Deployment carries the KB volume+mount, and
# the wiki repo holds the seed content. Pod-internal checks (KBS.md, live
# file in the mount) are best-effort.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aoit-beat-knowledgebase
  namespace: agent-office
  labels:
    app.kubernetes.io/part-of: agent-office-integration-tests
spec:
  description: Drive the real template with createNewKnowledgeBase; assert KB created + attached + mounted + content.
  params:
    - name: agent-name
      type: string
    - name: gh-owner
      type: string
      default: enterprisewebservice
    - name: target-namespace
      type: string
      default: agent-office
    - name: oc-download-url
      type: string
      default: "http://downloads.openshift-console.svc.cluster.local:80/amd64/linux/oc.tar"
  steps:
    - name: knowledgebase
      image: registry.access.redhat.com/ubi9/ubi:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        curl -sL "$(params.oc-download-url)" -o /tmp/oc.tar && tar -x -C /tmp -f /tmp/oc.tar oc
        OC=/tmp/oc
        NAME="$(params.agent-name)"; OWNER="$(params.gh-owner)"; NS="$(params.target-namespace)"
        KB="$NAME-wiki"
        RHDH="http://v1-developer-hub.rhdh-test.svc.cluster.local:7007"
        TOKEN=$($OC get secret -n rhdh-test agent-office-rhdh-token -o jsonpath='{.data.token}' | base64 -d)

        echo "=== drive the REAL template with createNewKnowledgeBase=true (dedicated agent + new KB) ==="
        cat >/tmp/kbbody.json <<EOF
        {
          "templateRef": "template:default/openclaw-agent-advanced",
          "values": {
            "name": "$NAME", "displayName": "IT KB Agent", "emoji": "📚",
            "description": "Ephemeral integration-test agent that curates a new KB (auto-removed).",
            "owner": "user:default/deanpeterson", "role": "assistant", "capabilities": [],
            "systemPrompt": "Ephemeral e2e KB-test agent. Safe to delete.",
            "provider": "openai-codex",
            "compose": { "knowledgeBaseRefs": [], "mcpServers": [] },
            "createNewKnowledgeBase": true,
            "newKnowledgeBaseTopic": "Integration-test knowledge base: platform smoke notes.",
            "namespace": "$NS", "runtimeMode": "dedicated",
            "gatewayRef": "research-gateway", "ghOwner": "$OWNER"
          }
        }
        EOF
        TID=$(curl -s -X POST "$RHDH/api/scaffolder/v2/tasks" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @/tmp/kbbody.json | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')
        [ -n "$TID" ] || { echo "FAIL: no scaffolder task id"; exit 1; }
        echo "  scaffolder task: $TID"
        st=""
        for i in $(seq 1 30); do
          st=$(curl -s "$RHDH/api/scaffolder/v2/tasks/$TID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))')
          echo "  [$i] scaffolder: $st"
          case "$st" in completed) break ;; failed|cancelled) echo "FAIL: scaffolder $st"; exit 1 ;; esac
          sleep 6
        done
        [ "$st" = "completed" ] || { echo "FAIL: scaffolder did not complete"; exit 1; }

        echo
        echo "=== assert the AW materialized with the KB attached (spec.knowledgeBaseRefs) ==="
        awok=""
        for i in $(seq 1 20); do
          if $OC get agentworkstation "$NAME" -n "$NS" >/dev/null 2>&1; then awok=1; break; fi
          echo "  [$i] waiting for ArgoCD + operator to reconcile AW $NAME…"; sleep 9
        done
        [ -n "$awok" ] || { echo "FAIL: AgentWorkstation $NAME not reconciled"; exit 1; }
        HASREF=$($OC get agentworkstation "$NAME" -n "$NS" -o json | python3 -c "import sys,json;d=json.load(sys.stdin);print('yes' if any(r.get('name')=='$KB' for r in (d['spec'].get('knowledgeBaseRefs') or [])) else 'no')")
        [ "$HASREF" = "yes" ] && echo "  ✓ AW $NAME references KnowledgeBase $KB in spec.knowledgeBaseRefs" || { echo "FAIL: AW $NAME does not reference KB $KB"; exit 1; }

        echo
        echo "=== assert the KnowledgeBase CR was applied + the operator bound its PVC ==="
        kbok=""
        for i in $(seq 1 20); do
          if $OC get knowledgebase "$KB" -n "$NS" >/dev/null 2>&1; then kbok=1; break; fi
          echo "  [$i] waiting for ArgoCD to apply KnowledgeBase $KB…"; sleep 9
        done
        [ -n "$kbok" ] || { echo "FAIL: KnowledgeBase $KB not applied from the repo"; exit 1; }
        ORC=$($OC get knowledgebase "$KB" -n "$NS" -o jsonpath='{.metadata.ownerReferences}')
        [ -z "$ORC" ] && echo "  ✓ KnowledgeBase/$KB applied declaratively (ownerReferences=none)" || echo "  (KB has ownerReferences: $ORC)"
        pvcok=""
        for i in $(seq 1 20); do
          PVC=$($OC get pvc -n "$NS" -l agentoffice.ai/knowledgebase="$KB" -o jsonpath='{.items[0].status.phase}' 2>/dev/null || true)
          [ -z "$PVC" ] && PVC=$($OC get pvc "$KB" -n "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "$PVC" = "Bound" ]; then pvcok=1; break; fi
          echo "  [$i] waiting for KB PVC to bind (phase=${PVC:-none})…"; sleep 9
        done
        [ -n "$pvcok" ] && echo "  ✓ KB $KB PVC is Bound" || { echo "FAIL: KB $KB PVC never bound"; exit 1; }

        echo
        echo "=== assert the KB is ATTACHED to the agent's gateway pod (volume + mount on the Deployment) ==="
        mok=""
        for i in $(seq 1 20); do
          MNT=$($OC get deploy "$NAME" -n "$NS" -o json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); c=d['spec']['template']['spec']['containers'][0]; print('yes' if any('/wiki/$KB' in (m.get('mountPath','')) for m in (c.get('volumeMounts') or [])) else 'no')" 2>/dev/null || echo no)
          if [ "$MNT" = "yes" ]; then mok=1; break; fi
          echo "  [$i] waiting for operator to attach KB volume to gateway Deployment…"; sleep 9
        done
        [ -n "$mok" ] && echo "  ✓ gateway Deployment $NAME mounts $KB at /home/node/.openclaw/wiki/$KB/" || { echo "FAIL: KB $KB not mounted on gateway Deployment $NAME"; exit 1; }

        echo
        echo "=== assert the KB shipped with STRUCTURE + CONTENT: the <name>-wiki repo has seed files ==="
        appId=$($OC get secret -n agent-office agent-office-github-app -o jsonpath='{.data.appId}' | base64 -d)
        instId=$($OC get secret -n agent-office agent-office-github-app -o jsonpath='{.data.installationId}' | base64 -d)
        $OC get secret -n agent-office agent-office-github-app -o jsonpath='{.data.privateKey}' | base64 -d > /tmp/ghapp.pem
        b64url(){ openssl base64 -A | tr '+/' '-_' | tr -d '='; }
        now=$(date +%s)
        hh=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
        pp=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$appId" | b64url)
        ss=$(printf '%s.%s' "$hh" "$pp" | openssl dgst -sha256 -sign /tmp/ghapp.pem -binary | b64url)
        apptok=$(curl -s -X POST -H "Authorization: Bearer $hh.$pp.$ss" -H "Accept: application/vnd.github+json" "https://api.github.com/app/installations/$instId/access_tokens" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
        rm -f /tmp/ghapp.pem
        FILES=$(curl -s -H "Authorization: token $apptok" "https://api.github.com/repos/$OWNER/$KB/contents/" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(x.get('name','') for x in d) if isinstance(d,list) else '')" 2>/dev/null || echo "")
        echo "  $KB repo top-level: ${FILES:-<empty>}"
        echo "$FILES" | grep -q "README.md" && echo "  ✓ KB wiki repo seeded with content (README.md present)" || { echo "FAIL: KB wiki repo $KB missing seed content"; exit 1; }

        echo
        echo "=== best-effort: verify the seeded content is readable inside the agent's KB mount ==="
        GWPOD=$($OC get pods -n "$NS" -l agentoffice.ai/gateway="$NAME" --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        if [ -n "$GWPOD" ]; then
          KBS=$($OC exec -n "$NS" "$GWPOD" -c openclaw -- sh -c "test -f /home/node/.openclaw/workspaces/$NAME/KBS.md && grep -l '$KB' /home/node/.openclaw/workspaces/$NAME/KBS.md 2>/dev/null" 2>/dev/null || true)
          [ -n "$KBS" ] && echo "  ✓ KBS.md in the agent workspace lists $KB" || echo "  (KBS.md not rendered yet — pod still warming; spec-level attach already proven)"
        else
          echo "  (dedicated gateway pod not Running yet — spec-level attach + repo content already proven)"
        fi

        echo
        echo "PASS — real scaffolder createNewKnowledgeBase: KB created, attached to the agent (refs + Deployment mount), PVC bound, wiki repo seeded with content."
