# Beat (Act 1) — Compose + Materialize, the REAL way.
#
# Drives the actual openclaw-agent SCAFFOLDER TEMPLATE via the RHDH
# scaffolder API (the wizard's Submit): fetch:template → publish:github
# (real gitops repo, incl. the argocd/applicationset-managed marker) →
# catalog:register. Then the agent-office-agents ArgoCD ApplicationSet
# discovers the repo (marker) and creates the Application in the shared
# agent-office project; ArgoCD syncs the AgentWorkstation; the operator
# reconciles it onto the shared research-gateway. This beat asserts that
# whole real chain materialized — no synthetic CRs, no roadie race.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aoit-beat-create
  namespace: agent-office
  labels:
    app.kubernetes.io/part-of: agent-office-integration-tests
spec:
  description: Drive the real openclaw-agent template; assert ApplicationSet + operator materialize it.
  params:
    - name: agent-name
      type: string
    - name: runtime-mode
      type: string
      default: shared
      description: shared (join research-gateway) or dedicated (own gateway pod).
    - name: gh-owner
      type: string
      default: enterprisewebservice
    - name: target-namespace
      type: string
      default: agent-office
    - name: oc-download-url
      type: string
      default: "http://downloads.openshift-console.svc.cluster.local:80/amd64/linux/oc.tar"
  steps:
    - name: scaffold
      image: registry.access.redhat.com/ubi9/ubi:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        curl -sL "$(params.oc-download-url)" -o /tmp/oc.tar && tar -x -C /tmp -f /tmp/oc.tar oc
        OC=/tmp/oc
        NAME="$(params.agent-name)"; OWNER="$(params.gh-owner)"; NS="$(params.target-namespace)"
        RTMODE="$(params.runtime-mode)"
        echo "  runtime mode: $RTMODE"
        RHDH="http://v1-developer-hub.rhdh-test.svc.cluster.local:7007"
        TOKEN=$($OC get secret -n rhdh-test agent-office-rhdh-token -o jsonpath='{.data.token}' | base64 -d)

        echo "=== drive the REAL openclaw-agent template (scaffolder API) ==="
        cat >/tmp/body.json <<EOF
        {
          "templateRef": "template:default/openclaw-agent",
          "values": {
            "name": "$NAME", "displayName": "IT E2E Agent", "emoji": "🧪",
            "description": "Ephemeral integration-test agent (auto-removed).",
            "owner": "user:default/deanpeterson", "role": "assistant",
            "capabilities": [],
            "systemPrompt": "Ephemeral e2e test agent created by the integration suite. Safe to delete.",
            "provider": "openai-codex",
            "compose": { "knowledgeBaseRefs": [], "mcpServers": [
              { "name": "github", "url": "http://mcp-gateway-data-science-gateway-class.$NS.svc.cluster.local/mcp", "type": "http", "authHeaderValue": "Bearer \${GITHUB_PERSONAL_ACCESS_TOKEN}", "envFromSecret": "github-mcp-installation-token" }
            ] },
            "createNewKnowledgeBase": false, "namespace": "$NS",
            "runtimeMode": "$RTMODE",
            "gatewayRef": "research-gateway", "ghOwner": "$OWNER"
          }
        }
        EOF
        TID=$(curl -s -X POST "$RHDH/api/scaffolder/v2/tasks" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @/tmp/body.json | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')
        [ -n "$TID" ] || { echo "FAIL: no scaffolder task id"; exit 1; }
        echo "  scaffolder task: $TID"
        st=""
        for i in $(seq 1 30); do
          st=$(curl -s "$RHDH/api/scaffolder/v2/tasks/$TID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))')
          echo "  [$i] scaffolder: $st"
          case "$st" in completed) break ;; failed|cancelled) echo "FAIL: scaffolder $st"; exit 1 ;; esac
          sleep 6
        done
        [ "$st" = "completed" ] || { echo "FAIL: scaffolder did not complete"; exit 1; }

        APP="$NAME-agent"
        echo
        echo "=== assert MATERIALIZE: ApplicationSet creates $APP (shared project), operator reconciles AW ==="
        appok=""
        for i in $(seq 1 20); do
          if $OC get applications.argoproj.io "$APP" -n openshift-gitops >/dev/null 2>&1; then
            $OC get applications.argoproj.io "$APP" -n openshift-gitops -o jsonpath='  app='"$APP"' project={.spec.project} sync={.status.sync.status}{"\n"}'
            proj=$($OC get applications.argoproj.io "$APP" -n openshift-gitops -o jsonpath='{.spec.project}')
            [ "$proj" = "agent-office" ] || { echo "FAIL: app not in shared agent-office project (got $proj)"; exit 1; }
            appok=1; break
          fi
          echo "  [$i] waiting for ApplicationSet to create $APP…"; sleep 9
        done
        [ -n "$appok" ] || { echo "FAIL: ApplicationSet did not create $APP within timeout"; exit 1; }

        awok=""
        for i in $(seq 1 20); do
          $OC get agentworkstation "$NAME" -n "$NS" >/dev/null 2>&1 && { awok=1; break; }
          echo "  [$i] waiting for ArgoCD sync + operator to reconcile AW $NAME…"; sleep 9
        done
        [ -n "$awok" ] || { echo "FAIL: AgentWorkstation $NAME not reconciled within timeout"; exit 1; }
        $OC get agentworkstation "$NAME" -n "$NS" -o jsonpath='  AW='"$NAME"' mcp={.spec.tools.mcpServers[0].name}{"\n"}'

        if [ "$RTMODE" = "dedicated" ]; then
          # TRUE-UNIFY MODEL (operator v1.6.6+): the operator has NO dedicated
          # code path. "Dedicated" means the agent's OWN gitops repo declares
          # an AgentGateway/<name> sibling, and the AW's gatewayRef points at
          # it. So the gateway is a first-class DECLARATIVE resource ArgoCD
          # applied from the repo — NOT minted or owned by the operator. The
          # AW registers on it via the exact same path a shared agent uses.
          echo "=== assert DEDICATED (true-unify): the repo's OWN AgentGateway/<name> was applied, with NO operator/AW owner-ref ==="
          gwok=""
          for i in $(seq 1 20); do
            if $OC get agentgateway "$NAME" -n "$NS" >/dev/null 2>&1; then
              # KEY: a declarative gateway has NO ownerReferences (lifecycle is
              # git/ArgoCD). If the operator were still minting+owning it, this
              # would be AgentWorkstation — which is exactly what we removed.
              ORC=$($OC get agentgateway "$NAME" -n "$NS" -o jsonpath='{.metadata.ownerReferences}')
              [ -z "$ORC" ] || { echo "FAIL: AgentGateway $NAME has ownerReferences ($ORC) — expected NONE (declarative, not operator-owned)"; exit 1; }
              # And the AW must actually point at it.
              GR=$($OC get agentworkstation "$NAME" -n "$NS" -o jsonpath='{.spec.runtime.shared.gatewayRef}')
              [ "$GR" = "$NAME" ] || { echo "FAIL: AW $NAME gatewayRef is '$GR', expected '$NAME' (self)"; exit 1; }
              echo "  ✓ AgentGateway/$NAME applied from the repo, ownerReferences=none; AW gatewayRef=$NAME (self)"
              gwok=1; break
            fi
            echo "  [$i] waiting for ArgoCD to apply the repo's AgentGateway…"; sleep 9
          done
          [ -n "$gwok" ] || { echo "FAIL: AgentGateway $NAME not applied from the gitops repo (true-unify dedicated path)"; exit 1; }

          echo "=== assert DEDICATED: the declarative gateway materialized its OWN Deployment (codex + skills pod, same as shared gateways) ==="
          depok=""
          for i in $(seq 1 20); do
            if $OC get deploy "$NAME" -n "$NS" >/dev/null 2>&1; then
              GOK=$($OC get deploy "$NAME" -n "$NS" -o jsonpath='{.metadata.ownerReferences[0].kind}')
              [ "$GOK" = "AgentGateway" ] || { echo "FAIL: Deployment $NAME not owned by its AgentGateway (got $GOK)"; exit 1; }
              echo "  ✓ Deployment/$NAME owned by AgentGateway/$NAME (AW → gateway → deploy cascade)"
              depok=1; break
            fi
            echo "  [$i] waiting for the dedicated gateway Deployment…"; sleep 9
          done
          [ -n "$depok" ] || { echo "FAIL: dedicated gateway Deployment $NAME not built"; exit 1; }

          echo "=== assert NO LEAK: the dedicated agent is NOT a persona in the shared research-gateway ==="
          # gatewayRef=self (asserted above) already proves no leak; this is
          # defense-in-depth. The exec is best-effort: research-gateway's
          # openclaw container occasionally restarts, and under set -e a failed
          # exec command-substitution would abort the whole beat — so guard it.
          SGW=$($OC get pods -n "$NS" -l agentoffice.ai/gateway=research-gateway --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$SGW" ]; then
            HITS=$($OC exec -n "$NS" "$SGW" -c openclaw -- sh -c "grep -o '\"id\": *\"$NAME\"' /home/node/.openclaw/openclaw.json 2>/dev/null | wc -l" 2>/dev/null | tr -d ' ' || echo "x")
            case "$HITS" in
              0) echo "  ✓ dedicated agent is NOT a persona in shared research-gateway" ;;
              x|"") echo "  (couldn't exec research-gateway right now — gatewayRef=self already proved no leak)" ;;
              *) echo "FAIL: dedicated agent leaked into shared research-gateway ($HITS)"; exit 1 ;;
            esac
          else
            echo "  (shared research-gateway pod not Running — gatewayRef=self already proved no leak)"
          fi
        fi

        echo
        echo "PASS — real scaffolder → ApplicationSet (shared project) → ArgoCD → operator: agent materialized ($RTMODE)"
