# Teardown — the Pipeline's `finally` task. ALWAYS runs (pass or fail)
# and removes EVERY artifact a run can create, for BOTH agents the suite
# creates (the shared <run> and the dedicated <run>-ded), so the suite is
# fully idempotent and leaves zero residue. Derives all names from the
# run name, so it cleans up even if a beat failed half-way.
#
# Per agent, in order: delete the GitHub repo FIRST (so the ApplicationSet
# stops generating its app + won't recreate it) → let the ApplicationSet
# prune the Application (cascade → AW → operator de-registers shared
# agents / cascades dedicated children) → delete the AW directly →
# delete the catalog Location. The SHARED agent-office project is left in
# place. Then ASSERT every repo/app/AW is gone.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aoit-teardown
  namespace: agent-office
  labels:
    app.kubernetes.io/part-of: agent-office-integration-tests
spec:
  description: Remove every artifact both agents created (repos, apps, AWs, catalog, ns).
  params:
    - name: run-name
      type: string
    - name: gh-owner
      type: string
      default: enterprisewebservice
    - name: target-namespace
      type: string
      default: agent-office
    - name: oc-download-url
      type: string
      default: "http://downloads.openshift-console.svc.cluster.local:80/amd64/linux/oc.tar"
  steps:
    - name: teardown
      image: registry.access.redhat.com/ubi9/ubi:latest
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        curl -sL "$(params.oc-download-url)" -o /tmp/oc.tar && tar -x -C /tmp -f /tmp/oc.tar oc
        OC=/tmp/oc
        NAME="$(params.run-name)"; OWNER="$(params.gh-owner)"; NS="$(params.target-namespace)"
        AGENTS="$NAME ${NAME}-ded"   # shared + dedicated agents the suite creates
        echo "TEARDOWN for run $NAME (agents: $AGENTS)"

        echo "=== mint short-lived GitHub App token ==="
        appId=$($OC get secret -n agent-office agent-office-github-app -o jsonpath='{.data.appId}' | base64 -d)
        instId=$($OC get secret -n agent-office agent-office-github-app -o jsonpath='{.data.installationId}' | base64 -d)
        $OC get secret -n agent-office agent-office-github-app -o jsonpath='{.data.privateKey}' | base64 -d > /tmp/ghapp.pem
        b64url(){ openssl base64 -A | tr '+/' '-_' | tr -d '='; }
        now=$(date +%s)
        hh=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
        pp=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$appId" | b64url)
        ss=$(printf '%s.%s' "$hh" "$pp" | openssl dgst -sha256 -sign /tmp/ghapp.pem -binary | b64url)
        apptok=$(curl -s -X POST -H "Authorization: Bearer $hh.$pp.$ss" -H "Accept: application/vnd.github+json" "https://api.github.com/app/installations/$instId/access_tokens" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
        rm -f /tmp/ghapp.pem
        RHDH="http://v1-developer-hub.rhdh-test.svc.cluster.local:7007"
        TOKEN=$($OC get secret -n rhdh-test agent-office-rhdh-token -o jsonpath='{.data.token}' | base64 -d)

        for A in $AGENTS; do
          APP="$A-agent"; REPO="$A-agent-gitops"
          echo "=== cleaning agent $A ==="
          for r in "$REPO" "$A-wiki"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: token $apptok" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$OWNER/$r")
            echo "  DELETE repo $OWNER/$r -> $code"
          done
          for i in $(seq 1 14); do
            $OC get applications.argoproj.io "$APP" -n openshift-gitops >/dev/null 2>&1 || { echo "  app $APP pruned"; break; }
            $OC patch applications.argoproj.io "$APP" -n openshift-gitops --type merge -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}' 2>/dev/null || true
            $OC delete applications.argoproj.io "$APP" -n openshift-gitops --ignore-not-found --wait=false 2>/dev/null || true
            sleep 10
          done
          $OC delete agentworkstation "$A" -n "$NS" --ignore-not-found --wait=false 2>/dev/null || true
          LID=$(curl -s "$RHDH/api/catalog/locations" -H "Authorization: Bearer $TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(((x.get('data') or x).get('id','') for x in d if '$REPO' in str((x.get('data') or x).get('target',''))), ''))" 2>/dev/null)
          [ -n "${LID:-}" ] && curl -s -o /dev/null -w "  DELETE location $LID -> %{http_code}\n" -X DELETE "$RHDH/api/catalog/locations/$LID" -H "Authorization: Bearer $TOKEN" || echo "  (no catalog location for $REPO)"
        done

        echo "=== delete ephemeral namespace $NAME if a beat created one ==="
        $OC delete namespace "$NAME" --ignore-not-found --wait=false 2>/dev/null || true

        echo
        echo "=== ASSERT zero residue (both agents) ==="
        rc=0
        for A in $AGENTS; do
          rcode=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $apptok" "https://api.github.com/repos/$OWNER/$A-agent-gitops")
          [ "$rcode" = "404" ] && echo "  ✓ $A repo gone (404)" || { echo "  ✗ $A repo still $rcode"; rc=1; }
          $OC get applications.argoproj.io "$A-agent" -n openshift-gitops >/dev/null 2>&1 && { echo "  ✗ $A Argo app present"; rc=1; } || echo "  ✓ $A Argo app gone"

          # Bounded-wait for the AW AND its minted gateway (dedicated only)
          # to FULLY delete — don't accept "still terminating" as clean. A
          # dedicated agent's gateway is owner-ref'd to the AW, so this
          # proves the AW → AgentGateway → pod/PVC/Svc/Route/CM cascade
          # actually completed (a broken owner-ref would orphan the gateway).
          gone=""
          for i in $(seq 1 15); do
            RES="$($OC get agentworkstation "$A" -n "$NS" 2>/dev/null; $OC get agentgateway "$A" -n "$NS" 2>/dev/null)"
            [ -z "$RES" ] && { gone=1; break; }
            sleep 8
          done
          if [ -n "$gone" ]; then
            echo "  ✓ $A AW + minted gateway fully gone (cascade complete)"
          else
            $OC get agentworkstation "$A" -n "$NS" >/dev/null 2>&1 && { echo "  ✗ $A AW still present after wait"; rc=1; }
            $OC get agentgateway "$A" -n "$NS" >/dev/null 2>&1 && { echo "  ✗ $A gateway ORPHANED (owner-ref/cascade failed)"; rc=1; }
          fi
          # Belt-and-suspenders: no orphaned gateway workload children left.
          for kv in "deploy/$A" "pvc/$A-workspace" "svc/$A" "route/$A" "cm/$A-config"; do
            K="${kv%/*}"; V="${kv#*/}"
            $OC get "$K" "$V" -n "$NS" >/dev/null 2>&1 && { echo "  ✗ $A residue: $K/$V"; rc=1; } || true
          done
        done
        $OC get appproject agent-office -n openshift-gitops >/dev/null 2>&1 && echo "  ✓ shared project intact" || echo "  ✗ shared project missing!"
        # Production agents must be untouched by the run.
        PROD=$($OC get agentworkstation -n "$NS" --no-headers 2>/dev/null | grep -vE "^$NAME(-ded)? " | wc -l | tr -d ' ')
        echo "  ✓ $PROD production agent(s) intact"
        [ "$rc" = "0" ] && echo "TEARDOWN: clean — zero residue." || echo "TEARDOWN: residue detected."
        exit $rc
