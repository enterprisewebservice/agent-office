# Governed Agent Platform — integration-test / demo Pipeline.
#
# Each task is a DEMO BEAT (see integration-tests/DEMO.md). The DAG
# lighting up green in Dev Hub's CI tab IS the narrated demo. A
# `finally` teardown ALWAYS runs and removes EVERY artifact the run
# created (Argo app → AW → shared-gateway de-registration, GitHub
# repo, catalog Location, ephemeral ns), so a run is fully idempotent
# and leaves zero residue.
#
# Beats exercise the REAL creation path (the scaffolder template the
# Dev Hub wizard drives), never synthetic CRs. Extensible: add a beat
# = add a Task under tasks/ + an entry here.
#   Act 1  beat-create (real scaffolder template e2e)
#   Act 2  beat-guardrails, beat-skills                [Phase 2b]
#   Act 3  beat-mcp, beat-autoresearch                 [Phase 3]
#   Act 4  beat-audit  (+ finally: teardown)           [Phase 3]
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: agent-office-integration-tests
  namespace: agent-office
  labels:
    app.kubernetes.io/part-of: agent-office-integration-tests
spec:
  description: >-
    The wow-factor demo suite. Each task proves one demo beat against
    the REAL creation path; the suite running green is the demo working.
    See integration-tests/DEMO.md.
  params:
    - name: gh-owner
      type: string
      default: enterprisewebservice
  tasks:
    # Act 1 — plugin-facing surfaces (namespace-free, runs in parallel).
    - name: beat-endpoints
      displayName: "HTTP endpoints (wizard + card data sources)"
      taskRef:
        name: aoit-beat-endpoints

    # Act 1 — the REAL create path: drive the openclaw-agent scaffolder
    # template (publish:github → argocd → catalog:register → operator).
    - name: beat-create
      displayName: "Create a SHARED agent the real way (scaffolder e2e)"
      taskRef:
        name: aoit-beat-create
      params:
        - name: agent-name
          value: $(context.pipelineRun.name)
        - name: runtime-mode
          value: shared
        - name: gh-owner
          value: $(params.gh-owner)

    # Same real path, runtime: dedicated — operator builds the agent its
    # OWN gateway (different reconcile branch). Runs in parallel.
    - name: beat-create-dedicated
      displayName: "Create a DEDICATED agent (own gateway pod)"
      taskRef:
        name: aoit-beat-create
      params:
        - name: agent-name
          value: $(context.pipelineRun.name)-ded
        - name: runtime-mode
          value: dedicated
        - name: gh-owner
          value: $(params.gh-owner)

    # Act 2 — inspect the REAL materialized agent (before teardown).
    - name: beat-guardrails
      displayName: "Guardrails (no standing creds, ESO secret, constrained SCC)"
      runAfter: [beat-create]
      taskRef:
        name: aoit-beat-guardrails
      params:
        - name: agent-name
          value: $(context.pipelineRun.name)
    - name: beat-skills
      displayName: "Skills discovery (skillSrc=image, SKILL.md layout)"
      runAfter: [beat-create]
      taskRef:
        name: aoit-beat-skills
      params:
        - name: agent-name
          value: $(context.pipelineRun.name)

  finally:
    # Removes EVERY artifact the run created; asserts zero residue.
    - name: teardown
      displayName: "Teardown (remove repo, Argo app, AW, catalog, ns)"
      taskRef:
        name: aoit-teardown
      params:
        - name: run-name
          value: $(context.pipelineRun.name)
        - name: gh-owner
          value: $(params.gh-owner)
