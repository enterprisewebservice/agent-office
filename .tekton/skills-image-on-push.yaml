apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: skills-image-on-push
  namespace: default-tenant
  annotations:
    # Rebuild whenever a skill folder or the Containerfile changes.
    pipelinesascode.tekton.dev/on-cel-expression: 'event == "push" && target_branch == "main" && (body.head_commit.modified.exists(f, f.startsWith("skills-image/")) || body.head_commit.added.exists(f, f.startsWith("skills-image/")))'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    build.appstudio.openshift.io/repo: 'https://github.com/enterprisewebservice/agent-office?rev={{revision}}'
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
  labels:
    appstudio.openshift.io/application: agent-office
    appstudio.openshift.io/component: skills-image
    pipelines.appstudio.openshift.io/type: build
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    # Bump :v0.0.x here + set AgentGateway.spec.skillsImage to the new tag
    # (operator >= v1.7.4) to roll a new skill catalog into agent pods —
    # no operator release needed. v0.0.2 adds the genesis-train skill;
    # v0.0.3 makes genesis-train self-register its DSPA pipeline (bundled
    # pipeline.yaml) so the worker stands up the training itself;
    # v0.0.4 streams the training loss curve to OpenShift AI MLflow.
    # v0.0.5 adds weekly-ops-report (SME ops-summary skill; supply-chain scenario Act 3).
    - name: output-image
      value: 'quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-skills:v0.0.6'
    - name: dockerfile
      value: skills-image/Containerfile
    - name: path-context
      value: skills-image
    - name: rebuild
      value: "true"
    - name: skip-checks
      value: "true"
  pipelineRef:
    resolver: bundles
    params:
      - name: bundle
        value: 'quay.io/konflux-ci/tekton-catalog/pipeline-docker-build@sha256:1b2a544f5308a50b8ebf76e76f10f8be3e12342d6ce7233d2520aca724294a82'
      - name: name
        value: docker-build
      - name: kind
        value: pipeline
  taskRunTemplate:
    podTemplate:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - ec-0d-9a-89-19-46
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        - name: build
          # Trivial image (just a COPY of markdown files) — minimal resources.
          computeResources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
