apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Mirrors the previous Application source: `directory: { recurse: true, exclude: gitops/* }`.
# Switching to kustomize so Argo CD Image Updater can edit the `images:` block
# below on every successful Tekton build (rebumps `newTag` to the newest
# `on-push-<sha>` Quay tag, commits to main, ArgoCD reconciles, pod rolls).
resources:
  - crd/agentworkstation-crd.yaml
  - deploy/agent-office-deploy.yaml
  - rbac/agent-office-rbac.yaml
  - samples/onboarding-agent.yaml
# Image source-of-truth. Change `newTag` here to deploy a different version;
# Image Updater rewrites it automatically when a new build lands.
images:
  - name: quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/agent-office-server
    newTag: on-push-df214a87140fbc80d0527f7667a9f19786e043bd
