# Registers __SVC__'s MCP tools with the gateway broker (discovery via
# tools/list; per-call routing through the HTTPRoute). credentialRef mirrors
# projectboard-mcp: the broker requires an Authorization value for its
# discovery connection even for backends that need no credential of their own.
# NOTE: the declared CRD field is spec.prefix (NOT toolPrefix — that name is
# pruned by client-side apply and REJECTED by ServerSideApply). Probe-caught.
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: __SVC__
  namespace: agent-office
  labels:
    app.kubernetes.io/name: __SVC__
    app.kubernetes.io/component: registration
spec:
  prefix: __SVC___
  path: /mcp
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: __SVC__-route
  credentialRef:
    name: github-mcp-broker-token
    key: AUTHORIZATION
